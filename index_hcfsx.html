function seededRandom(seed){
    let x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
}

// ===== 数据 =====
async function fetchRaw(){
    try{
        let res = await fetch("https://ls.kjkj.fit/kj?t=" + Date.now(), {
            cache: "no-store"
        });

        if(!res.ok){
            throw new Error("接口状态异常");
        }

        let text = await res.text();

        try{
            return JSON.parse(text);
        }catch(e){
            console.warn("返回不是JSON：", text);
            return { data: [] };
        }

    }catch(e){
        console.log("接口失败", e);
        return { data: [] };
    }
}

async function fetchData(){
    const CACHE_KEY = "cacheHistory";
    const CACHE_TIME_KEY = "cacheHistoryTime";
    const EXPIRE = 30 * 60 * 1000;
    let cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");
    let cacheTime = localStorage.getItem(CACHE_TIME_KEY);

    if(cache.length > 0 && cacheTime && (Date.now() - cacheTime < EXPIRE)){
        return cache;
    }

    try{
        let json = await fetchRaw();
        let data = (json.data || []).slice(0, kjDataSize);

        // ❗ 接口空 → 用旧缓存
        if(!data.length){
            if(cache){
                console.warn("接口无数据，用缓存");
                return JSON.parse(cache);
            }
            return [];
        }

        // ✅ 写缓存
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        localStorage.setItem(CACHE_TIME_KEY, Date.now());

        return data;

    }catch(e){
        console.log("拉取数据异常", e);
        // ❗ 兜底
        if(cache){
            return JSON.parse(cache);
        }

        return [];
    }
}
// ===== 工具 =====
function getHistory(raw){
    return raw
        .filter(i=>i && i.num)
        .map(i=>i.num.split(',').map(Number));

// ===== 杀号 =====
function killNumbers(history){
    let freq=Array(50).fill(0);
    history.forEach(p=>{
        let tm=p[6];
        freq[tm]++;
    });
    let killSet=new Set();
    // ⭐ 只杀“极端没出现的”
    for(let i=1;i<=49;i++){
        if(freq[i]===0 && killSet.size<10){
            killSet.add(i);
        }
    }
    return killSet;
}

// ===== 特码权重 =====
function calcTmWeights(history, seed){

    let freq = Array(50).fill(0);
    let last = Array(50).fill(999);

    history.forEach((p, idx)=>{
        let tm = p[6];

        freq[tm]++;

        // ⭐ 最近出现位置
        if(last[tm] === 999){
            last[tm] = idx;
        }
    });

    let maxF = Math.max(...freq);

    let weights = [];

    for(let i=1;i<=49;i++){

        // ⭐ 热度
        let hot = freq[i] / (maxF || 1);

        // ⭐ 遗漏值（越久没出越高）
        let gap = Math.min(last[i], 40) / 40;

        // ⭐ 极冷号额外加分
        let cold = 0;

        if(last[i] > 30){
            cold = 0.45;
        }else if(last[i] > 20){
            cold = 0.25;
        }else if(last[i] > 10){
            cold = 0.12;
        }

        // ⭐ 最近刚开 → 压制
        let recentPenalty = 1;

        if(last[i] <= 1){
            recentPenalty = 0.45;
        }else if(last[i] <= 3){
            recentPenalty = 0.7;
        }

        // ⭐ 新权重公式
        let w =
            0.15
            + hot * 0.35
            + gap * 0.9
            + cold
            + seededRandom(seed + i) * 0.18;

        w *= recentPenalty;

        weights[i] = w;
    }

    return weights;
}


// ===== 特码生成 =====
function genTmUltimate(weights, seed){
    let arr = [];
    for(let i=1;i<=49;i++){
        arr.push({n: i, w: weights[i]});
    }
    arr.sort((a,b)=>b.w-a.w);
    let top = arr.slice(0,30).map(i=>i.n);
    let bets = shrinkBets(top, seed);

    // 统计号码出现频率
    let freq = {};
    bets.forEach(b=>{
        b.forEach(n=>{
            freq[n] = (freq[n] || 0) + 1;
        });
    });

    // 取出现频率最高的8个号码
    let nums = Object.keys(freq).sort((a,b)=>{
        let diff = freq[b] - freq[a];
        if(diff !== 0) return diff;
        return weights[b] - weights[a];
    }).slice(0,8).map(Number).sort((a,b)=>a-b);

    // alert("推荐号码:"+ nums);
    return { nums, top, kill: arr.slice(35).map(i=>i.n) };
}

// ===== 正码 =====
function calcWeights(history, seed){
    let freq=Array(50).fill(0);

    history.forEach(p=>p.forEach(n=>freq[n]++));

    let maxF=Math.max(...freq);
    let weights=[];

    for(let i=0;i<50;i++){
        weights[i] = 0.5 + (freq[i]/maxF) + seededRandom(seed + i)*0.2;
    }

    return weights;
}

function genOne(w,c,seed){
    let n=[];
    let idx=0;

    while(n.length < c){
        let x = Math.floor(seededRandom(seed + idx)*49)+1;
        idx++;

        if(!n.includes(x)) n.push(x);
    }

    return n.sort((a,b)=>a-b);
}

// ===== 固定组 =====
async function initFixed(force=false){
    let raw=await fetchData();
    let history=getHistory(raw);
    let latestId = raw[0].id;
    let seed_fix = latestId * 10 + 3;
    if(!force && fixedData.t){
        renderFixed();
        return;
    }

    // let wtm=calcTmWeights(history);
    // let tm=genTmUltimate(wtm);

    let wtm = calcTmWeights(history, seed_fix);
    let tm;
    if(fixedData.t){
        // ① 保留4个最强号码
        let keep = selectKeep(fixedData.t, history);
        // ② 只补2个新号码
        while(keep.length < 6){
            let pool = genTmUltimate(wtm, seed_fix).nums;
            let x = pool[Math.floor(seededRandom(seed_fix++)*pool.length)];

            if(!keep.includes(x)){
                keep.push(x);
            }
        }
        tm = {nums: keep.sort((a,b)=>a-b)};
    }else{
        // 第一次生成
        tm = genTmUltimate(wtm, seed_fix);
    }
    let z = genOne(calcWeights(history,seed_fix),4,seed_fix);

    // fixedData={t:tm.nums,z};

    let expire = new Date();
    expire.setDate(expire.getDate() + lockDays);

    fixedData = {
        t:tm.nums,
        z,
        start: today,
        expire: expire.toISOString().split("T")[0]
    };

    localStorage.setItem("fixedData",JSON.stringify(fixedData));

    renderFixed();
}

function selectKeep(oldNums, history){
    let freq = {};
    oldNums.forEach(n=>{
        freq[n] = 0;
        history.forEach(p=>{
            if(p.includes(n)){
                freq[n]++;
            }
        });
    });
    // 按出现次数排序（出现多 = 强号）
    return oldNums.sort((a,b)=>freq[b]-freq[a]).slice(0,4); // ⭐保留4个
}

function renderFixed(){
    if(!fixedData.t) return;

    document.getElementById("fixedOut").innerHTML=`
    <div class="card fixed">
    🔵 固定追号组<br>
    特码：${fixedData.t.join(",")}<br>
    正码：${fixedData.z.join(",")}
    </div>`;
}

// ===== 特码分析 =====
async function showTmAnalysis(forceUpdate=false){
    if(forceUpdate && !confirm("=====  确认刷新特码？=====")){
        return;
    }
    let box = document.getElementById("tmOut");
    box.innerHTML = "⏳ 正在计算分析...";
    await new Promise(r => setTimeout(r, 300));
    let raw = await fetchData();
    if(!raw || !raw.length){
        box.innerHTML = "⚠️ 拉取数据失败";
        return;
    }
    let latest = raw[0];
    let history = getHistory(raw);
    let latestId = latest.id;
    let currentPeriod = Number(latest.qishu) + 1;
    let seed_tm = latestId * 10 + 1;
    if(forceUpdate){
        seed_tm += Date.now();
    }
    updateResult(latest);
    // raw.slice(0, 10).forEach(item => updateResult(item));
    fixMissingHistory(latest);
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    let cachedItem = list.find(i => i.expect === currentPeriod);
    if(cachedItem && !forceUpdate){
        showToast("✅ 已生成本期分析结果");
        currentAnalysis = {
            nums: cachedItem.nums,
            top: cachedItem.top,
            kill: cachedItem.kill,
            seed: seed_tm
        };
        renderTm(list.find(i => i.expect === currentPeriod), currentPeriod);
        return;
    }
    // ⭐ 每次都重新算（关键）
    let wtm = calcTmWeights(history, seed_tm);
    let result = genTmUltimate(wtm, seed_tm);
    currentAnalysis = {
        nums: result.nums,
        top: result.top,
        kill: result.kill,
        seed: seed_tm
    }
    savePrediction(result, latest);
    renderTm(result, currentPeriod);
    if(forceUpdate){
        showToast("♻️ 已手动刷新分析结果");
    }
}

function fixMissingHistory(latest){
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    let currentQishu = Number(latest.qishu)
    let exists = new Set(list.map(i => Number(i.expect)));
    // ⭐ 补最近10期（你可以改范围）
    for(let i = currentQishu; i > currentQishu - 10; i--){
        if(!exists.has(i)){
            list.unshift({
                expect: i,
                date: latest.date,
                nums: [],   // 没预测
                top: [],
                kill: [],
                open: null,
                hit: null,
                hitNums: false,
                hitTop: false
            });
        }
    }
    list.sort((a,b)=>b.expect - a.expect);
    localStorage.setItem("tmHistory", JSON.stringify(list));
}

function savePrediction(result, latest){

    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");

    let expect = Number(latest.qishu) + 1;
    list = list.filter(i => i.expect != expect);

    list.unshift({
        expect,
        date: latest.date,

        nums: result.nums,
        top: result.top,
        kill: result.kill,

        open: null,
        hit: null
    });

    // 限制数量
    if(list.length > 30){
        list = list.slice(0,30);
    }

    localStorage.setItem("tmHistory", JSON.stringify(list));
}

function updateResult(latest){
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    let qishu = Number(latest.qishu);
    let openNum = Number(latest.num.split(",")[6]);
    let found = false;
    list.forEach(item => {
        if(Number(item.expect) === qishu){
            found = true
            if(item.open === null){
                item.open = openNum;
                item.hitNums = item.nums.includes(openNum);
                item.hitTop  = item.top.includes(openNum);
                item.hit = item.hitTop;
            }
        }
    });
    if(!found){
        list.unshift({
            expect: qishu,
            date: latest.date,
            nums: [],
            top: [],
            kill: [],
            open: openNum,
            hit: false,
            hitNums: false,
            hitTop: false
        });
    }
    list.sort((a,b)=>b.expect - a.expect);
    localStorage.setItem("tmHistory", JSON.stringify(list));
}

function renderTm(result, currentPeriod) {
    let top30 = result.top || [];

    // 从 localStorage 获取最近 1 期开奖号码
    let lastOpenNum = null;
    try {
        let raw = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
        if (raw.length > 0 && raw[0] && raw[0].num) {
            let nums = raw[0].num.split(",").map(Number);
            lastOpenNum = nums[6];
        }
    } catch (e) {}

    // 排除极冷（遗漏 > 25 期）
    let history = [];
    try {
        let raw = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
        history = getHistory(raw);
    } catch (e) {}

    let missMap = new Map();
    for (let i = 1; i <= 49; i++) {
        let lastIdx = -1;
        for (let j = 0; j < history.length; j++) {
            if (history[j][6] === i) {
                lastIdx = j;
                break;
            }
        }
        let miss = lastIdx === -1 ? history.length : lastIdx;
        missMap.set(i, miss);
    }

    // 过滤 Top30
    let filtered = top30.filter(num => {
        if (lastOpenNum !== null && num === lastOpenNum) return false;
        let miss = missMap.get(num) || 999;
        return miss <= 25;
    });

    if (filtered.length < 8) {
        filtered = top30.filter(num => {
            if (lastOpenNum !== null && num === lastOpenNum) return false;
            return true;
        });
    }
    if (filtered.length < 8) {
        filtered = [...top30];
    }

    // ⭐ 关键改动：使用更强的随机种子（加入当期时间戳）
    let seed = currentPeriod * 10000 + Math.floor(Date.now() / 86400000);
    let shuffled = [...filtered];
    for (let i = shuffled.length - 1; i > 0; i--) {
        let j = Math.floor(seededRandom(seed + i * 10000) * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    let final8 = shuffled.slice(0, 8).sort((a, b) => a - b);
    window.defaultRecommend = final8;
    document.getElementById("tmOut").innerHTML = `
    <div class="card tm">
    🔥 当前${currentPeriod}期特码分析（仅供参考待投注）<br><br>
    ❌ 杀号${result.kill.length}：<span style="word-break:break-all;">${(result.kill || []).slice(0, 20).join(",")}
</span><br><br>
    ⭐ Top${result.top.length}：<span style="word-break:break-all;">${result.top.join(",")}</span><br><br>
    🎯 推荐：${final8.join(",")}<br>
    <!--<span style="font-size:12px;">✅ 已剔除：上期特码 + 遗漏＞25期</span>-->
    </div>`;
}

async function generateBets(){
    // 如果没有缓存的分析结果，先调用分析
    if(!currentAnalysis){
        await showTmAnalysis(false);
    }
    if(!currentAnalysis){
        document.getElementById("betOut").innerHTML = `<div class="card tm">⚠️ 请先刷新特码分析</div>`;
        return;
    }

    let bets = shrinkBets(currentAnalysis.top, currentAnalysis.seed);

    let html = `<div class="card tm">
    💰 投注方案（选择其中一个或多个方案）<br><br>`;

    bets.forEach((b,i)=>{
        html += `方案${i+1}：${b.join(",")}<br>`;
    });

    document.getElementById("betOut").innerHTML = html;
}

function shrinkBets(top, seed){
    let result=[];

    for(let i=0;i<10;i++){

        let arr=[...top];

        // Fisher-Yates 洗牌（稳定版）
        for(let j=arr.length-1;j>0;j--){
            let k = Math.floor(seededRandom(seed + i*50 + j)*(j+1));
            [arr[j], arr[k]] = [arr[k], arr[j]];
        }

        let pick = arr.slice(0,8).sort((a,b)=>a-b);
        result.push(pick);
    }

    return result;
}

    loading = true;

    let box = document.getElementById("history");
    box.innerHTML = "⏳ 正在加载开奖数据...";
    await new Promise(r => setTimeout(r, 300));

        loading = false;
        return;
    }

    let html=`<div class="card tm"><b>📊 最近${hisKjDataSize}期开奖数据</b><br>`;

    });

async function showTmHistory(){
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    list = list.filter(i => i.open !== null && i.open !== undefined && i.expect).slice(0,fupanSize);
    if(!list.length){
        document.getElementById("tmHistory").innerHTML = "暂无历史投注数据";
        return;
    }

    let box = document.getElementById("tmHistory");
    box.innerHTML = "⏳ 正在加载历史投注结果...";
    await new Promise(r => setTimeout(r, 200));

    let html = `<div class="card tm">
    📊 历史投注结果 ${list.length}期<br><br>`;

    list.forEach(i=>{
        let note = '';
        if (i.hcApplied) note += ' 📊横财富';
        if (i.sxApplied) note += ' ✂️剔生肖';

        html += `
        <div style="margin-bottom:10px;">
        ${i.expect}期${note}<br>
        Top：<span style="word-break:break-all;">${i.top.slice(0,30).join(",")}</span><br>
        🎯 推荐：${i.nums.join(",")}<br>

        🎲 开奖：<b style="color:#ff5722;">${i.open}</b><br>
        ${i.nums.length === 0 ? "⚠️ 无预测" : ""}
        ${i.hitNums ? "✅ 推荐命中" : ""}
        ${i.hitTop ? "✅ Top命中" : ""}
        ${i.nums.length > 0 && !i.hitNums && !i.hitTop ? "❌ 未中" : ""}
        </div>
        <hr>`;
    });
    html += `</div>`;
    box.innerHTML = html;
}

function formatNums(nums){
    let arr = nums.split(",");
    return arr.map((n,idx)=>{
        // ⭐ 最后一个号码特殊处理
        if(idx === arr.length - 1){
            return `<span class="mq-num mq-tm">${n}</span>`;
        }
        return `<span class="mq-num mq-normal">${n}</span>`;
    }).join("");
}

async function updateMarquee() {
  let base = "📊 自动同步最新开奖，每日仅生成一次分析结果";
  try {
    let raw = await fetchData(); // 用你的缓存函数
    let latest = raw[0];
    let lastId = localStorage.getItem("marqueeLastId");
    let numsHtml = formatNums(latest.num);
    let text = "";
    // ⭐ 判断是否新开奖
    if (lastId != latest.id) {
      text = `${base}　　<span class="highlight">🆕 新开奖：${latest.qishu}期（${latest.date}）${numsHtml}</span>`;
      localStorage.setItem("marqueeLastId", latest.id);
    } else {
      text = `${base}　　📢 最新：${latest.qishu}期（${latest.date}）${numsHtml}`;
    }
    // ⭐ 双倍拼接（无缝滚动）
    document.getElementById("marqueeText").innerHTML = text + "　　" + text;
  } catch (e) {
    console.log("滚动条失败", e);
    document.getElementById("marqueeText").innerText = base;
  }
}

async function init(){
    let box = document.getElementById("indexOut");
    box.innerHTML = "⏳ 正在加载数据...";
    let slowTimer = setTimeout(()=>{
        box.innerHTML = "🐢 网络有点慢，请稍等...";
    }, 3000);
    let data = [];
    try{
        data = await fetchData();
    }catch(e){
        console.log("加载异常", e);
    }
    clearTimeout(slowTimer);
    if(!data || !data.length){
        box.innerHTML = `
        ⚠️ 数据加载失败<br><br>
        <button onclick="location.reload()">🔄 点击重试</button>
        `;
        return;
    }
    box.innerHTML = "";
    updateMarquee();
    await showTmAnalysis();
    updateHengCaiLabel();

    // ⭐ 只保留一个恢复逻辑
    restoreHengCaiCache();
}

function restoreHengCaiCache() {
    let cached = localStorage.getItem('hengCaiCache');
    if (!cached) return;

    try {
        let data = JSON.parse(cached);
        let today = new Date().toISOString().split('T')[0];
        if (data.date !== today) {
            localStorage.removeItem('hengCaiCache');
            return;
        }

        if (!currentAnalysis || !currentAnalysis.nums) return;

        let tmOut = document.getElementById('tmOut');
        if (!tmOut) return;

        // 检查是否已经应用了横财富
        // if (tmOut.innerHTML.includes('交集')) return;

        let html = tmOut.innerHTML;
        html = html.replace(
            /🎯 推荐[^<]*/,
            `🎯 推荐：${data.finalNums.join(', ')}`
        );
        tmOut.innerHTML = html;

        // ⭐ 新增：同步更新 localStorage 中的历史记录
        let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
        if (list.length > 0) {
            list[0].nums = data.finalNums;
            list[0].hcApplied = true;
            list[0].sxApplied = false;
            localStorage.setItem("tmHistory", JSON.stringify(list));
        }
    } catch(e) {
        localStorage.removeItem('hengCaiCache');
    }
}

function applyHengCai() {
    let input = document.getElementById('hcInput').value.trim();
    if (!input) return showToast('请输入横财富30码');

    let hcNums = [];
    let matches = input.match(/\d+/g);
    if (matches) {
        matches.forEach(p => {
            let n = parseInt(p);
            if (n >= 1 && n <= 49 && !hcNums.includes(n)) {
                hcNums.push(n);
            }
        });
    }

    if (hcNums.length === 0) return showToast('未识别到有效号码');
    if (!currentAnalysis || !currentAnalysis.top) return showToast('请先刷新特码分析');

    let top30 = currentAnalysis.top || [];
    let intersect = top30.filter(n => hcNums.includes(n));

    let finalNums = [...intersect];
    // if (finalNums.length < 8) {
    //     let remaining = top30.filter(n => !finalNums.includes(n));
    //     for (let i = 0; i < Math.min(8 - finalNums.length, remaining.length); i++) {
    //         finalNums.push(remaining[i]);
    //     }
    // }
    finalNums.sort((a,b)=>a-b);

    let tmOut = document.getElementById('tmOut');
    if (tmOut) {
        let html = tmOut.innerHTML;
        html = html.replace(
            /🎯 推荐[^<]*/,
            `🎯 推荐：${finalNums.join(', ')}`
        );
        tmOut.innerHTML = html;
    }

    // ⭐ 同步更新 localStorage 历史记录
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    if (list.length > 0) {
        list[0].nums = finalNums;
        list[0].hcApplied = true;
        list[0].sxApplied = false;  // 清除生肖标记，因为横财富覆盖了
        localStorage.setItem("tmHistory", JSON.stringify(list));
    }

    localStorage.setItem('hengCaiCache', JSON.stringify({
        finalNums: finalNums,
        intersectCount: intersect.length,
        date: new Date().toISOString().split('T')[0]
    }));

    showToast(`✅ 推荐${intersect.length}个号码，已更新`);
}

function clearHengCai() {
    document.getElementById('hcInput').value = '';
    localStorage.removeItem('hengCaiCache');

    let tmOut = document.getElementById('tmOut');
    if (tmOut && window.defaultRecommend) {
        let html = tmOut.innerHTML;
        html = html.replace(
            /🎯 推荐[^<]*/,
            `🎯 推荐：${window.defaultRecommend.join(', ')}`
        );
        tmOut.innerHTML = html;
        showToast('已恢复默认推荐');
    } else {
        location.reload();
    }
}

function updateHengCaiLabel() {
    let label = document.getElementById('hcLabel');
    if (!label) return;
    try {
        let raw = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
        if (raw.length > 0) {
            let qishu = Number(raw[0].qishu) + 1;
            label.textContent = `📊 当前${qishu}期 横财富30码`;
        }
    } catch(e) {}
}

function applyShengXiaoFilter() {
    let input = document.getElementById('shengXiaoInput').value.trim();
    if (!input) {
        showToast('请输入要剔除的生肖');
        return;
    }

    let shengXiaoList = [];
    let chars = input.split('');
    for (let ch of chars) {
        if (SHENGXIAO_MAP[ch]) {
            shengXiaoList.push(ch);
        }
    }

    if (shengXiaoList.length === 0) {
        showToast('未识别到有效生肖（鼠牛虎兔龙蛇马羊猴鸡狗猪）');
        return;
    }

    let removeNums = [];
    shengXiaoList.forEach(sx => {
        if (SHENGXIAO_MAP[sx]) {
            removeNums = removeNums.concat(SHENGXIAO_MAP[sx]);
        }
    });
    removeNums = [...new Set(removeNums)];

    if (!currentAnalysis || !currentAnalysis.top) {
        showToast('请先刷新特码分析');
        return;
    }

    // ⭐ 判断横财富输入框是否有值
    let hcInput = document.getElementById('hcInput').value.trim();
    let top30 = currentAnalysis.top || [];
    let baseNums = [];

    if (hcInput) {
        // 有横财富：从当前显示的推荐中提取（已经是交集结果）
        let tmOut = document.getElementById('tmOut');
        if (!tmOut) return;
        let currentHtml = tmOut.innerHTML;
        let match = currentHtml.match(/🎯 推荐[^：]*：([\d,\s]+)/);
        if (!match) {
            showToast('未找到当前推荐号码');
            return;
        }
        baseNums = match[1].split(/[,\s]+/).map(Number).filter(n => !isNaN(n));
    } else {
        // 没有横财富：直接用 Top30
        baseNums = [...top30];
    }

    // 剔除生肖
    let filteredNums = baseNums.filter(n => !removeNums.includes(n));
    filteredNums.sort((a, b) => a - b);

    let tmOut = document.getElementById('tmOut');
    if (tmOut) {
        let html = tmOut.innerHTML;
        let label = hcInput ? `（交集+剔除${shengXiaoList.join('')}后${filteredNums.length}码）` : `（剔除${shengXiaoList.join('')}后${filteredNums.length}码）`;
        html = html.replace(
            /🎯 推荐[^<]*/,
            `🎯 推荐${label}：${filteredNums.join(', ')}`
        );
        tmOut.innerHTML = html;
    }

    // 同步更新 localStorage
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    if (list.length > 0) {
        list[0].nums = filteredNums;
        list[0].sxApplied = true;
        list[0].hcApplied = !!hcInput;
        localStorage.setItem("tmHistory", JSON.stringify(list));
    }

    document.getElementById('shengXiaoStatus').textContent = `已剔除：${shengXiaoList.join('、')}（${removeNums.join(', ')}），剩余${filteredNums.length}个`;

    showToast(`✅ 已剔除${shengXiaoList.join('、')}，剩余${filteredNums.length}个号码`);
}
