function backtestHot20() {
    let raw = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
    if (!raw.length) {
        alert('没有历史数据');
        return;
    }
    let history = raw.map(i => i.num.split(',').map(Number));
    let results = [];
    let start = 50;

    for (let i = start; i < history.length; i++) {
        let past = history.slice(i - start, i);
        let openNum = history[i][6];

        let freq = {};
        for (let p of past) {
            let num = p[6];
            freq[num] = (freq[num] || 0) + 1;
        }
        let sorted = Object.keys(freq).sort((a, b) => freq[b] - freq[a]);
        let hot20 = sorted.slice(0, 25).map(Number);

        results.push({
            expect: raw[i].qishu,
            openNum: openNum,
            hit: hot20.includes(openNum)
        });
    }

    let total = results.length;
    let hitCount = results.filter(r => r.hit).length;
    let rate = total > 0 ? Math.round(hitCount / total * 100) : 0;

    // 显示在页面顶部
    let box = document.getElementById('indexOut');
    box.innerHTML = `
    <div class="card" style="border-left:5px solid #28a745;">
    📊 热号15码回测结果（最近${total}期）<br>
    命中 <b>${hitCount}</b> 期 / 共 ${total} 期<br>
    命中率 <b style="color:#e91e63;font-size:20px;">${rate}%</b>
    </div>
    `;
    alert(`命中率 ${rate}%（${hitCount}/${total}）`);
}

function seededRandom(seed){
    let x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
}

async function fetchData(){
    const CACHE_KEY = "cacheHistory";
    const CACHE_TIME_KEY = "cacheHistoryTime";
    const EXPIRE = 30 * 60 * 1000;
    let cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");
    let cacheTime = localStorage.getItem(CACHE_TIME_KEY);

    if(cache.length > 0 && cacheTime && (Date.now() - cacheTime < EXPIRE)){
        return cache;
    }

    try{
        let json = await fetchRaw();
        let data = (json.data || []).slice(0, kjDataSize);

        // ❗ 接口空 → 用旧缓存
        if(!data.length){
            if(cache){
                console.warn("接口无数据，用缓存");
                return JSON.parse(cache);
            }
            return [];
        }

        // ✅ 写缓存
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        localStorage.setItem(CACHE_TIME_KEY, Date.now());

        return data;

    }catch(e){
        console.log("拉取数据异常", e);
        // ❗ 兜底
        if(cache){
            return JSON.parse(cache);
        }

        return [];
    }
}

// ===== 特码权重 =====
function calcTmWeights(history, seed){

    let freq = Array(50).fill(0);
    let last = Array(50).fill(999);

    history.forEach((p, idx)=>{
        let tm = p[6];
        freq[tm]++;
        // ⭐ 最近出现位置
        if(last[tm] === 999){
            last[tm] = idx;
        }
    });

    let maxF = Math.max(...freq);
    let weights = [];
    for(let i=1;i<=49;i++){
        // ⭐ 热度
        let hot = freq[i] / (maxF || 1);
        // ⭐ 重复加分
        let repeatBonus = 0;
        if (freq[i] >= 3) {
            repeatBonus = 0.3;
        } else if (freq[i] >= 2) {
            repeatBonus = 0.2;
        } else if (freq[i] >= 1) {
            repeatBonus = 0.1;
        }
        // ⭐ 遗漏值（越久没出越高），last[i] 越小 → 最近开过 → gap 小；last[i] 越大 → 很久没开 → gap 大
        let gap = Math.min(last[i], 40) / 40;
        // ⭐ 极冷号额外加分,===== 冷号加分（遗漏越久，加分越多） =====
        let cold = 0;
        // last[i] 表示号码 i 距离最近一次开奖的间隔期数（遗漏值）
        // 例如：last[1] = 0 表示 01 上期刚开，last[1] = 5 表示 01 已经5期没开了
        if(last[i] > 30){
            cold = 0.45;
        }else if(last[i] > 20){
            cold = 0.25;
        }else if(last[i] > 10){
            cold = 0.12;
        }

        // ⭐ 最近刚开 → 压制, ===== 近期惩罚（刚开过 → 权重打折） =====,默认不打折
        let recentPenalty = 1;
        if(last[i] <= 1){
          // 上期刚开 → 权重 × 0.45（严重压制）
            recentPenalty = 0.45;
        }else if(last[i] <= 3){
          // 最近2-3期开过 → 权重 × 0.7（中等压制）
            recentPenalty = 0.7;
        }

        // ⭐ 新权重公式
        // let w = 0.15 + hot * 0.35 + gap * 0.6 + cold + seededRandom(seed + i) * 0.18;
        // let w = 0.2 + hot * 0.45 + gap * 0.4 + cold + seededRandom(seed + i) * 0.12;
        let w = 0.2 + hot * 0.45 + gap * 0.4 + cold + repeatBonus + seededRandom(seed + i) * 0.12;
        // w *= recentPenalty;
        weights[i] = w;
    }

    return weights;
}


// ===== 特码生成 =====
function genTmUltimate(weights, seed){
    let arr = [];
    for(let i=1;i<=49;i++){
        arr.push({n: i, w: weights[i]});
    }
    arr.sort((a,b)=>b.w-a.w);
    let top = arr.slice(0,40).map(i=>i.n);
    let bets = shrinkBets(top, seed);

    // 统计号码出现频率
    let freq = {};
    bets.forEach(b=>{
        b.forEach(n=>{
            freq[n] = (freq[n] || 0) + 1;
        });
    });

    // 取出现频率最高的8个号码
    let nums = Object.keys(freq).sort((a,b)=>{
        let diff = freq[b] - freq[a];
        if(diff !== 0) return diff;
        return weights[b] - weights[a];
    }).slice(0,8).map(Number).sort((a,b)=>a-b);

    return { nums, top, kill: arr.slice(40).map(i=>i.n) };
}

// ===== 正码 =====
function calcWeights(history, seed){
    let freq=Array(50).fill(0);

    history.forEach(p=>p.forEach(n=>freq[n]++));

    let maxF=Math.max(...freq);
    let weights=[];

    for(let i=0;i<50;i++){
        weights[i] = 0.5 + (freq[i]/maxF) + seededRandom(seed + i)*0.2;
    }

    return weights;
}

function genOne(w,c,seed){
    let n=[];
    let idx=0;

    while(n.length < c){
        let x = Math.floor(seededRandom(seed + idx)*49)+1;
        idx++;

        if(!n.includes(x)) n.push(x);
    }

    return n.sort((a,b)=>a-b);
}

// ===== 固定组 =====
async function initFixed(force=false){
    let raw=await fetchData();
    let history=getHistory(raw);
    let latestId = raw[0].id;
    let seed_fix = latestId * 10 + 3;
    if(!force && fixedData.t){
        renderFixed();
        return;
    }

    // let wtm=calcTmWeights(history);
    // let tm=genTmUltimate(wtm);

    let wtm = calcTmWeights(history, seed_fix);
    let tm;
    if(fixedData.t){
        // ① 保留4个最强号码
        let keep = selectKeep(fixedData.t, history);
        // ② 只补2个新号码
        while(keep.length < 6){
            let pool = genTmUltimate(wtm, seed_fix).nums;
            let x = pool[Math.floor(seededRandom(seed_fix++)*pool.length)];

            if(!keep.includes(x)){
                keep.push(x);
            }
        }
        tm = {nums: keep.sort((a,b)=>a-b)};
    }else{
        // 第一次生成
        tm = genTmUltimate(wtm, seed_fix);
    }
    let z = genOne(calcWeights(history,seed_fix),4,seed_fix);

    // fixedData={t:tm.nums,z};

    let expire = new Date();
    expire.setDate(expire.getDate() + lockDays);

    fixedData = {
        t:tm.nums,
        z,
        start: today,
        expire: expire.toISOString().split("T")[0]
    };

    localStorage.setItem("fixedData",JSON.stringify(fixedData));

    renderFixed();
}

function selectKeep(oldNums, history){
    let freq = {};
    oldNums.forEach(n=>{
        freq[n] = 0;
        history.forEach(p=>{
            if(p.includes(n)){
                freq[n]++;
            }
        });
    });
    // 按出现次数排序（出现多 = 强号）
    return oldNums.sort((a,b)=>freq[b]-freq[a]).slice(0,4); // ⭐保留4个
}

}

    let currentPeriod = Number(latest.qishu) + 1;
    let seed_tm = latestId * 10 + 1;
    if(forceUpdate){
        seed_tm += Date.now();
    }
    updateResult(latest);
    // raw.slice(0, 10).forEach(item => updateResult(item));
      // ⭐ 每次都重新算（关键）
    let wtm = calcTmWeights(history, seed_tm);
    fixMissingHistory(latest);
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    let cachedItem = list.find(i => i.expect === currentPeriod);
    if(1===1 && cachedItem && !forceUpdate){
        showToast("✅ 已生成本期分析结果");
        currentAnalysis = {
            nums: cachedItem.nums,
            top: cachedItem.top,
            kill: cachedItem.kill,
            seed: seed_tm,
            weights: wtm
        };
        renderTm(list.find(i => i.expect === currentPeriod), currentPeriod);
        return;
    }
    let result = genTmUltimate(wtm, seed_tm);
    currentAnalysis = {
        nums: result.nums,
        top: result.top,
        kill: result.kill,
        seed: seed_tm,
        weights: wtm
    }
    savePrediction(result, latest);
    renderTm(result, currentPeriod);
    if(forceUpdate){
        showToast("♻️ 已手动刷新分析结果");
    }
}

function fixMissingHistory(latest){
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    let currentQishu = Number(latest.qishu)
    let exists = new Set(list.map(i => Number(i.expect)));
    // ⭐ 补最近10期（你可以改范围）
    for(let i = currentQishu; i > currentQishu - 10; i--){
        if(!exists.has(i)){
            list.unshift({
                expect: i,
                date: latest.date,
                nums: [],   // 没预测
                top: [],
                kill: [],
                open: null,
                hit: null,
                hitNums: false,
                hitTop: false
            });
        }
    }
    list.sort((a,b)=>b.expect - a.expect);

// ===== 50期热号15码 =====
function getHot20(history) {
    let freq = {};
    for (let p of history.slice(0, 50)) {
        let num = p[6];
        freq[num] = (freq[num] || 0) + 1;
    }
    let sorted = Object.keys(freq).sort((a, b) => freq[b] - freq[a]);
    return sorted.slice(0, 20).map(Number).sort((a, b) => a - b);
}

function getHot15(history) {
    let freq = {};
    for (let p of history.slice(0, 50)) {
        let num = p[6];
        freq[num] = (freq[num] || 0) + 1;
    }
    let sorted = Object.keys(freq).sort((a, b) => freq[b] - freq[a]);

    // 取前12个高频号
    let hot12 = sorted.slice(0, 12).map(Number);

    // 找最近5期出现1次的号码
    let recent = history.slice(0, 5);
    let recentFreq = {};
    for (let p of recent) {
        let num = p[6];
        recentFreq[num] = (recentFreq[num] || 0) + 1;
    }
    let candidates = Object.keys(recentFreq).filter(k => recentFreq[k] === 1).map(Number);
    candidates = candidates.filter(n => !hot12.includes(n));

    // 不够3个，从近10期出现1次的补
    if (candidates.length < 3) {
        let recent10 = history.slice(0, 10);
        let freq10 = {};
        for (let p of recent10) {
            let num = p[6];
            freq10[num] = (freq10[num] || 0) + 1;
        }
        let more = Object.keys(freq10).filter(k => freq10[k] === 1).map(Number);
        more = more.filter(n => !hot12.includes(n) && !candidates.includes(n));
        candidates = candidates.concat(more);
    }

    // 还不够，从高频池第13-18名补
    if (candidates.length < 3) {
        let backup = sorted.slice(12, 18).map(Number);
        backup = backup.filter(n => !hot12.includes(n) && !candidates.includes(n));
        candidates = candidates.concat(backup);
    }

    let hot15 = [...hot12, ...candidates.slice(0, 3)];
    return hot15.sort((a, b) => a - b);
}

function renderTm(result, currentPeriod) {
    let top30 = [...(result.top || [])].sort((a, b) => a - b);
    let kill = [...(result.kill || [])].sort((a, b) => a - b);

    let history = [];

        history = getHistory(raw);
    } catch (e) {}

    // 检查横财富缓存
    let hengCaiCache = localStorage.getItem('hengCaiCache');

            if (data.date === today && data.finalNums && data.finalNums.length > 0) {

            }
        } catch(e) {}
    }

    let label = finalNums ? `${finalNums.length}码` : `热号15码`;

    let hot15History = JSON.parse(localStorage.getItem("hot15History") || "[]");
    let exist = hot15History.some(item => item.expect === currentPeriod);

}

function shrinkBets(top, seed){
    let result=[];

    for(let i=0;i<10;i++){

        let arr=[...top];

        // Fisher-Yates 洗牌（稳定版）
        for(let j=arr.length-1;j>0;j--){
            let k = Math.floor(seededRandom(seed + i*50 + j)*(j+1));
            [arr[j], arr[k]] = [arr[k], arr[j]];
        }

        let pick = arr.slice(0,8).sort((a,b)=>a-b);
        result.push(pick);
    }

    return result;
}

        let match = currentHtml.match(/🎯 推荐[^：]*：([\d,\s]+)/);
        if (!match) {
            showToast('未找到当前推荐号码');
            return;
        }
        baseNums = match[1].split(/[,\s]+/).map(Number).filter(n => !isNaN(n));
    } else {
        baseNums = [...top30];
    }

    let filteredNums = baseNums.filter(n => !removeNums.includes(n));
    filteredNums.sort((a, b) => a - b);

    let tmOut = document.getElementById('tmOut');
    if (tmOut) {
        let html = tmOut.innerHTML;
        let label = hcInput ? `（交集+剔除${shengXiaoList.join('')}后${filteredNums.length}码）` : `（剔除${shengXiaoList.join('')}后${filteredNums.length}码）`;
        html = html.replace(
            /🎯 推荐[^<]*/,
            `🎯 推荐${label}：${filteredNums.join(', ')}`
        );
        tmOut.innerHTML = html;
    }

    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    if (list.length > 0) {
        list[0].nums = filteredNums;
        list[0].sxApplied = true;
        list[0].hcApplied = !!hcInput;
        localStorage.setItem("tmHistory", JSON.stringify(list));
    }

    // ⭐ 保存横财富缓存时保留完整数据
    let cached = localStorage.getItem('hengCaiCache');
    let hcData = cached ? JSON.parse(cached) : {};
    localStorage.setItem('hengCaiCache', JSON.stringify({
        finalNums: filteredNums,
        intersect: hcData.intersect || [],
        addedNums: [],
        hcNums: hcData.hcNums || [],
        weightRank: currentAnalysis.top || [],
        sxNums: removeNums,
        date: new Date().toISOString().split('T')[0]
    }));

    document.getElementById('shengXiaoStatus').textContent = `已剔除：${shengXiaoList.join('、')}（${removeNums.join(', ')}），剩余${filteredNums.length}个`;

    showToast(`✅ 已剔除${shengXiaoList.join('、')}，剩余${filteredNums.length}个号码`);
}


// ===== 初始化 =====

// generateRecommendations();
init();
// updateHengCaiLabel();
