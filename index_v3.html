<script>

const lockDays = 7;
const today = new Date().toISOString().split("T")[0];
let fixedData = JSON.parse(localStorage.getItem("fixedData") || "{}");
let loading = false;
const kjDataSize = 100;
const hisKjDataSize = 10;
const fupanSize = 10;

function seededRandom(seed){
    let x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
}

// ===== 数据 =====
async function fetchRaw(){
    try{
        let res = await fetch("https://ls.kjkj.fit/kj?t=" + Date.now(), {
            cache: "no-store"
        });

        if(!res.ok){
            throw new Error("接口状态异常");
        }

        let text = await res.text();

        try{
            return JSON.parse(text);
        }catch(e){
            console.warn("返回不是JSON：", text);
            return { data: [] };
        }

    }catch(e){
        console.log("接口失败", e);
        return { data: [] };
    }
}

async function fetchData(){
    const CACHE_KEY = "cacheHistory";
    const CACHE_TIME_KEY = "cacheHistoryTime";
    const EXPIRE = 30 * 60 * 1000;
    let cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");
    let cacheTime = localStorage.getItem(CACHE_TIME_KEY);

    if(cache.length > 0 && cacheTime && (Date.now() - cacheTime < EXPIRE)){
        return cache;
    }

    try{
        let json = await fetchRaw();
        let data = (json.data || []).slice(0, kjDataSize);

        // ❗ 接口空 → 用旧缓存
        if(!data.length){
            if(cache){
                console.warn("接口无数据，用缓存");
                return JSON.parse(cache);
            }
            return [];
        }

        // ✅ 写缓存
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        localStorage.setItem(CACHE_TIME_KEY, Date.now());

        return data;

    }catch(e){
        console.log("拉取数据异常", e);
        // ❗ 兜底
        if(cache){
            return JSON.parse(cache);
        }

        return [];
    }
}
// ===== 工具 =====
function getHistory(raw){
    return raw
        .filter(i=>i && i.num)
        .map(i=>i.num.split(',').map(Number));
}

function showToast(msg){
    let t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("show");

    setTimeout(()=>{
        t.classList.remove("show");
    },2000);
}

// ===== 杀号 =====
function killNumbers(history){
    let freq=Array(50).fill(0);
    history.forEach(p=>{
        let tm=p[6];
        freq[tm]++;
    });
    let killSet=new Set();
    // ⭐ 只杀“极端没出现的”
    for(let i=1;i<=49;i++){
        if(freq[i]===0 && killSet.size<10){
            killSet.add(i);
        }
    }
    return killSet;
}

// ===== 特码权重 =====
function calcTmWeights(history, seed){

    let freq = Array(50).fill(0);
    let last = Array(50).fill(999);

    history.forEach((p, idx)=>{
        let tm = p[6];
        freq[tm]++;
        last[tm] = Math.min(last[tm], idx);
    });

    let maxF = Math.max(...freq);
    let weights = [];

    for(let i=1;i<=49;i++){

        let hot = freq[i] / (maxF || 1);
        let gap = last[i] / history.length;

        let w =
            0.3
            + hot * 0.4
            + gap * 1.0   // ⭐ 提高“该出概率”
            + seededRandom(seed + i) * 0.05;

        // ❗ 刚开过 → 强压
        if(last[i] === 0){
            w *= 0.4;
        }

        // ❗ 最近2期 → 再压
        if(last[i] <= 2){
            w *= 0.6;
        }

        weights[i] = w;
    }

    return weights;
}
function calcTmWeightsV1(history, seed){

    let freq=Array(50).fill(0);
    let recent=Array(50).fill(0);
    let last=Array(50).fill(999);

    history.forEach((p,idx)=>{
        let tm=p[6];
        freq[tm]++;
        last[tm]=Math.min(last[tm],idx);
    });

    history.slice(0,15).forEach((p,idx)=>{
        let tm=p[6];
        recent[tm]+=(15-idx);
    });

    let maxF=Math.max(...freq);
    let maxR=Math.max(...recent);

    let killSet=killNumbers(history);
    let weights=[];

    for(let i=1;i<=49;i++){
        if(killSet.has(i)){
            weights[i]=0.01;
            continue;
        }
        let hot=freq[i]/(maxF||1);
        let boom=recent[i]/(maxR||1);
        let gap=last[i]/history.length;
        // 基础分 + 热度 + 最近趋势/关键/爆发 + 冷却程度 + 固定种子随机 的综合评分
        weights[i] =
            0.28                       // 基础分
            + hot*0.55                   // 热号更明显
            + boom*1.05                  // 最近趋势权重
            + gap*0.65                   // 冷却权重
            + coldBonus(i, history)*0.22 // 长期未出冷号加分
            + seededRandom(seed + i)*0.07; // 随机性降低
    }

    return weights;
}
function coldBonus(num, history){
    let lastAppear = history.findIndex(p => p.includes(num));
    // 完全没出现（极冷）
    if(lastAppear === -1) return 0.8;
    // 分层冷号（越久越加分）
    if(lastAppear > 35) return 0.6;
    if(lastAppear > 25) return 0.4;
    if(lastAppear > 15) return 0.2;
    return 0;
}
function pickNumbers(pool, count, seed){
    let res = [];
    let tries = 0;

    // ⭐ 防死循环
    while(res.length < count && tries < 50){
        let x = pool[Math.floor(seededRandom(seed + tries) * pool.length)];
        if(!res.includes(x)){
            res.push(x);
        }
        tries++;
    }

    return res;
}
// ===== 特码生成 =====
function genTmUltimate(weights, seed){

    let arr = [];
    for(let i=1;i<=49;i++){
        arr.push({n:i,w:weights[i]});
    }

    arr.sort((a,b)=>b.w-a.w);

    let top16 = arr.slice(0,16).map(i=>i.n);

    // 🎯 核心：只从Top选（不乱搞冷号）
    let strong = top16.slice(0,6);
    let mid    = top16.slice(6,12);

    let res = [];

    // ⭐ 6个核心 + 2个补充
    res = res.concat(pickNumbers(strong, 6, seed));
    res = res.concat(pickNumbers(mid, 2, seed + 100));

    res = [...new Set(res)];

    // 兜底
    let idx = 0;
    while(res.length < 8 && idx < 50){
        let x = top16[Math.floor(seededRandom(seed + 500 + idx)*top16.length)];
        if(!res.includes(x)){
            res.push(x);
        }
        idx++;
    }

    return {
        nums: res.slice(0,8).sort((a,b)=>a-b),
        top: top16,
        kill: arr.slice(20).map(i=>i.n)
    };
}
function genTmUltimateV1(weights, seed){

    let arr = [];
    for(let i=1;i<=49;i++){
        arr.push({n:i,w:weights[i]});
    }

    arr.sort((a,b)=>b.w-a.w);

    let top16 = arr.slice(0,16).map(i=>i.n);

    let hotPart = top16.slice(0,8);
    let midPart = top16.slice(8,12);
    let coldPart = arr.slice(20,35).map(i=>i.n);

    let res = [];

    // ⭐ 分段选
    res = res.concat(pickNumbers(hotPart, 4, seed));
    res = res.concat(pickNumbers(midPart, 2, seed + 100));
    res = res.concat(pickNumbers(coldPart, 2, seed + 200));

    // ⭐ 去重
    res = [...new Set(res)];

    // ⭐ 不够8个补齐（关键兜底）
    let idx = 0;
    while(res.length < 8 && idx < 100){
        let x = arr[Math.floor(seededRandom(seed + 500 + idx) * arr.length)].n;
        if(!res.includes(x)){
            res.push(x);
        }
        idx++;
    }

    return {
        nums: res.slice(0,8).sort((a,b)=>a-b),
        top: top16,
        kill: arr.slice(20).map(i=>i.n)
    };
}

function genTmUltimate_bak(w, seed){
    let arr=[];
    for(let i=1;i<=49;i++){
        arr.push({n:i,w:w[i]});
    }
    arr.sort((a,b)=>b.w-a.w);
    let top = arr.slice(0,16).filter(i=>i.w>0).map(i=>i.n);
    let res=[];
    let idx=0;
    // ⭐ 正常从Top16选
    while(res.length < 8){
        let x = top[Math.floor(seededRandom(seed + idx)*top.length)];
        idx++;

        if(!res.includes(x)) res.push(x);
    }
    // ⭐ 强制加1个冷号（关键！！）
    let coldPool = arr.slice(25).map(i=>i.n); // 后半段
    let cold = coldPool[Math.floor(seededRandom(seed + 999)*coldPool.length)];
    if(!res.includes(cold)){
        res[0] = cold;
    }
    return {
        nums:res.sort((a,b)=>a-b),
        top,
        kill:arr.slice(20).map(i=>i.n) // 杀号也别太狠
    };
}

// ===== 正码 =====
function calcWeights(history, seed){
    let freq=Array(50).fill(0);

    history.forEach(p=>p.forEach(n=>freq[n]++));

    let maxF=Math.max(...freq);
    let weights=[];

    for(let i=0;i<50;i++){
        weights[i] = 0.5 + (freq[i]/maxF) + seededRandom(seed + i)*0.2;
    }

    return weights;
}

function genOne(w,c,seed){
    let n=[];
    let idx=0;

    while(n.length < c){
        let x = Math.floor(seededRandom(seed + idx)*49)+1;
        idx++;

        if(!n.includes(x)) n.push(x);
    }

    return n.sort((a,b)=>a-b);
}

// ===== 推荐 =====
async function generateRecommendations(){

    let raw=await fetchData();
    let history=getHistory(raw);
    let latestId = raw[0].id;

    let seed_rec = latestId * 10 + 2;

    let w = calcWeights(history, seed_rec);
    let wtm = calcTmWeights(history, seed_rec);

    let pool=[];

    for(let i=0;i<200;i++){

        let seedLoop = seed_rec + i * 100;

        let tm = genTmUltimate(wtm, seedLoop);
        let z  = genOne(w, 4, seedLoop + 50);

        pool.push({
            t:tm.nums,
            z,
            sc: seededRandom(seedLoop + 99)*100
        });
    }

    pool.sort((a,b)=>b.sc-a.sc);

    let best=pool[0];
    let second=pool[1];

    document.getElementById("out").innerHTML=`
    <div class="card best">
    🟢 最优推荐<br>
    特码：${best.t.join(",")}<br>
    正码：${best.z.join(",")}
    </div>

    <div class="card balance">
    🟡 次优推荐<br>
    特码：${second.t.join(",")}<br>
    正码：${second.z.join(",")}
    </div>`;
}

// ===== 固定组 =====
async function initFixed(force=false){
    let raw=await fetchData();
    let history=getHistory(raw);
    let latestId = raw[0].id;
    let seed_fix = latestId * 10 + 3;
    if(!force && fixedData.t){
        renderFixed();
        return;
    }

    // let wtm=calcTmWeights(history);
    // let tm=genTmUltimate(wtm);

    let wtm = calcTmWeights(history, seed_fix);
    let tm;
    if(fixedData.t){
        // ① 保留4个最强号码
        let keep = selectKeep(fixedData.t, history);
        // ② 只补2个新号码
        while(keep.length < 6){
            let pool = genTmUltimate(wtm, seed_fix).nums;
            let x = pool[Math.floor(seededRandom(seed_fix++)*pool.length)];

            if(!keep.includes(x)){
                keep.push(x);
            }
        }
        tm = {nums: keep.sort((a,b)=>a-b)};
    }else{
        // 第一次生成
        tm = genTmUltimate(wtm, seed_fix);
    }
    let z = genOne(calcWeights(history,seed_fix),4,seed_fix);

    // fixedData={t:tm.nums,z};

    let expire = new Date();
    expire.setDate(expire.getDate() + lockDays);

    fixedData = {
        t:tm.nums,
        z,
        start: today,
        expire: expire.toISOString().split("T")[0]
    };

    localStorage.setItem("fixedData",JSON.stringify(fixedData));

    renderFixed();
}

function selectKeep(oldNums, history){
    let freq = {};
    oldNums.forEach(n=>{
        freq[n] = 0;
        history.forEach(p=>{
            if(p.includes(n)){
                freq[n]++;
            }
        });
    });
    // 按出现次数排序（出现多 = 强号）
    return oldNums.sort((a,b)=>freq[b]-freq[a]).slice(0,4); // ⭐保留4个
}

function renderFixed(){
    if(!fixedData.t) return;

    document.getElementById("fixedOut").innerHTML=`
    <div class="card fixed">
    🔵 固定追号组<br>
    特码：${fixedData.t.join(",")}<br>
    正码：${fixedData.z.join(",")}
    </div>`;
}

async function changeFixed(){
    if(confirm("确认更换固定组？将重新锁定7天")){
        await initFixed(true);
    }
}

// ===== 特码分析 =====
async function showTmAnalysis(forceUpdate=false){
    if(forceUpdate && !confirm("=====  确认刷新特码？=====")){
        return;
    }
    let box = document.getElementById("tmOut");
    box.innerHTML = "⏳ 正在计算分析...";
    await new Promise(r => setTimeout(r, 300));
    let raw = await fetchData();
    if(!raw || !raw.length){
        box.innerHTML = "⚠️ 拉取数据失败";
        return;
    }
    updateResult(raw[0]);
    let history = getHistory(raw);
    let latestId = raw[0].id;
    let currentPeriod = Number(raw[0].qishu) + 1;
    let seed_tm = latestId * 10 + 1;
    // ⭐ 每次都重新算（关键）
    let wtm = calcTmWeights(history, seed_tm);
    let result = genTmUltimate(wtm, seed_tm);
    savePrediction(result, raw[0]);
    renderTm(result, currentPeriod);
}

function savePrediction(result, latest){

    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");

    let expect = Number(latest.qishu) + 1;

    // ⭐ 过滤掉旧脏数据（关键）
    list = list.filter(i => i.expect);

    // ⭐ 防重复
    if(list.some(i => i.expect == expect)){
        return;
    }

    list.unshift({
        expect,
        date: latest.date,

        nums: result.nums,
        top: result.top,
        kill: result.kill,

        open: null,
        hit: null
    });

    // 限制数量
    if(list.length > 30){
        list = list.slice(0,30);
    }

    localStorage.setItem("tmHistory", JSON.stringify(list));
}

function updateResult(latest){

    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");

    let qishu = Number(latest.qishu);
    let openNum = Number(latest.num.split(",")[6]);

    list.forEach(item => {
        if(!item){
            console.warn("没有找到对应期号:", qishu);
            return;
        }
        // if(item.expect == qishu && item.open === null){
        //     item.open = openNum;
        //     // item.hit = item.nums.includes(openNum);
        //     item.hitNums = item.nums.includes(openNum);
        //     item.hitTop = item.top.includes(openNum);
        //     item.hit = item.hitTop;
        // }

        if(item.expect == qishu && item.open === null){
          item.open = openNum;
          item.hitNums = item.nums.includes(openNum);
          item.hitTop  = item.top.includes(openNum);
          item.hit = item.hitTop;
          // ⭐ 关键：兼容旧数据
          if(item.hitNums === undefined) item.hitNums = false;
          if(item.hitTop === undefined) item.hitTop = false;
      }
    });

    localStorage.setItem("tmHistory", JSON.stringify(list));
}

function renderTm(result,currentPeriod){
    document.getElementById("tmOut").innerHTML=`
    <div class="card tm">
    🔥 当前${currentPeriod}期特码分析（仅供参考待投注）<br><br>
    ❌ 杀号：<span style="word-break:break-all;">
${(result.kill || []).slice(0,20).join(",")}
</span><br><br>
    ⭐ Top${result.top.length}：${result.top.join(",")}<br><br>
    🎯 推荐：${result.nums.join(",")}
    </div>`;
}

async function generateBets(){

    let raw=await fetchData();
    let history=getHistory(raw);
    let latestId = raw[0].id;
    let seed_bet = latestId * 10 + 4;
    let wtm = calcTmWeights(history, seed_bet);
    let result = genTmUltimate(wtm, seed_bet);
    let bets = shrinkBets(result.top, seed_bet);

    let html=`<div class="card tm">
    💰 投注方案（选择其中一个或多个方案）<br><br>`;

    bets.forEach((b,i)=>{
        html+=`方案${i+1}：${b.join(",")}<br>`;
    });
    html+=`</div>`;
    document.getElementById("betOut").innerHTML = html;
}

function shrinkBets(top, seed){
    let result=[];

    for(let i=0;i<10;i++){

        let arr=[...top];

        // Fisher-Yates 洗牌（稳定版）
        for(let j=arr.length-1;j>0;j--){
            let k = Math.floor(seededRandom(seed + i*50 + j)*(j+1));
            [arr[j], arr[k]] = [arr[k], arr[j]];
        }

        let pick = arr.slice(0,8).sort((a,b)=>a-b);
        result.push(pick);
    }

    return result;
}

// ===== 开奖 =====
async function loadHistory(){
    if(loading) return;
    loading = true;

    let box = document.getElementById("history");
    box.innerHTML = "⏳ 正在加载开奖数据...";
    await new Promise(r => setTimeout(r, 300));
    let list = await fetchData();
    if(!list || !list.length){
        box.innerHTML = "⚠️ 数据获取失败，请稍后再试";
        loading = false;
        return;
    }

    let html=`<div class="card tm"><b>📊 最近${hisKjDataSize}期开奖数据</b><br>`;

    list.slice(0,hisKjDataSize).forEach(i=>{
        if(!i || !i.num) return;
        html += `${i.qishu}期 (${i.date})<br>${i.num}<br><br>`;
    });

    html+=`</div>`;

    box.innerHTML = html;

    loading = false;
}

async function showTmHistory(){
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    list = list.filter(i => i.open !== null && i.open !== undefined && i.expect).slice(0,fupanSize);
    if(!list.length){
        document.getElementById("tmHistory").innerHTML = "暂无历史投注数据";
        return;
    }

    let box = document.getElementById("tmHistory");
    box.innerHTML = "⏳ 正在加载历史投注结果...";
    await new Promise(r => setTimeout(r, 200));

    let html = `<div class="card tm">
    📊 特码历史投注结果 ${list.length}期<br><br>`;

    list.forEach(i=>{
        html += `
        <div style="margin-bottom:10px;">
        ${i.expect}期<br>
        🔥 Top：${i.top.slice(0,16).join(",")}<br>
        🎯 推荐：${i.nums.join(",")}<br>

        🎲 开奖：<b style="color:#ff5722;">${i.open}</b><br>
        ${i.hitNums ? "✅ 推荐命中" : ""}
        ${i.hitTop ? "✅ Top命中" : ""}
        ${!i.hitNums && !i.hitTop ? "❌ 未中" : ""}
        </div>
        <hr>`;
    });
    html += `</div>`;
    box.innerHTML = html;
}

function formatNums(nums){
    let arr = nums.split(",");
    return arr.map((n,idx)=>{
        // ⭐ 最后一个号码特殊处理
        if(idx === arr.length - 1){
            return `<span class="mq-num mq-tm">${n}</span>`;
        }
        return `<span class="mq-num mq-normal">${n}</span>`;
    }).join("");
}

async function updateMarquee(){
    let base = "📊 自动同步最新开奖，每日仅生成一次分析结果";
    try{
        let raw = await fetchData(); // 用你的缓存函数
        let latest = raw[0];
        let lastId = localStorage.getItem("marqueeLastId");
        let numsHtml = formatNums(latest.num);
        let text = "";
        // ⭐ 判断是否新开奖
        if(lastId != latest.id){
            text = `${base}　　<span class="highlight">🆕 新开奖：${latest.qishu}期（${latest.date}）${numsHtml}</span>`;
            localStorage.setItem("marqueeLastId", latest.id);
        }else{
            text = `${base}　　📢 最新：${latest.qishu}期（${latest.date}）${numsHtml}`;
        }
        // ⭐ 双倍拼接（无缝滚动）
        document.getElementById("marqueeText").innerHTML = text + "　　" + text;
    }catch(e){
        console.log("滚动条失败", e);
        document.getElementById("marqueeText").innerText = base;
    }
}

    let exist = JSON.parse(localStorage.getItem("tmHistory") || "[]");

    // ⭐ 如果少于2条，就补数据
    if(exist.length >= 2){
        return;

    let base = [

        top: [1,28,6,49,21,22,17,41,32,47,12,39,20,42,13,45],
        open: 45,

      },
      {

        top: [28,1,6,22,17,21,39,32,41,12,11,42,45,47,20,33],
        open: 49,
        hit: false
      }

    // ⭐ 合并（去重）
    let merged = [...base, ...exist];

async function init(){
    let box = document.getElementById("indexOut");
    box.innerHTML = "⏳ 正在加载数据...";
    // ⭐ 3秒后显示慢提示
    let slowTimer = setTimeout(()=>{
        box.innerHTML = "🐢 网络有点慢，请稍等...";
    }, 3000);
    let data = [];
    try{
        data = await fetchData();
    }catch(e){
        console.log("加载异常", e);
    }
    clearTimeout(slowTimer);
    // ❗ 关键：判断结果
    if(!data || !data.length){
        box.innerHTML = `
        ⚠️ 数据加载失败<br><br>
        <button onclick="location.reload()">🔄 点击重试</button>
        `;
        return;
    }
    box.innerHTML = "";
    updateMarquee();
    showTmAnalysis();
}
