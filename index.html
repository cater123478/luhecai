// ===== 数据 =====
async function fetchRaw(){
    try {
        // 添加10秒超时控制
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        
        let res = await fetch("https://ls.kjkj.fit/kj?t=" + Date.now(), {
            cache: "no-store",
            signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        if(!res.ok){
            throw new Error(`接口状态异常: ${res.status}`);
        }
        let text = await res.text();
        try{
            return JSON.parse(text);
        }catch(e){
            console.warn("返回不是JSON：", text.substring(0, 200));
            return { data: [] };
        }
    }catch(e){
        if (e.name === 'AbortError') {
            console.error("接口请求超时（>10秒）");
        } else {
            // 接口请求失败
        }
        return { data: [] };
    }
}

async function fetchData(forceRefresh = false){
    const CACHE_KEY = "cacheHistory";
    const CACHE_TIME_KEY = "cacheHistoryTime";
    const EXPIRE = 30 * 60 * 1000;
    
    // 安全读取缓存
    let cache = [];
    try {
        let cacheStr = localStorage.getItem(CACHE_KEY);
        if (cacheStr) {
            cache = JSON.parse(cacheStr);
        }
    } catch(e) {
        console.warn("缓存数据解析失败，将重新获取");
        cache = [];
        localStorage.removeItem(CACHE_KEY);
    }
    
    let cacheTime = localStorage.getItem(CACHE_TIME_KEY);

    // 如果不是强制刷新，且缓存有效，则使用缓存
    if(!forceRefresh && cache.length > 0 && cacheTime && (Date.now() - cacheTime < EXPIRE)){
        return cache;
    }
    
    if (forceRefresh) {
        // 强制刷新，忽略缓存
    }

    try{
        let json = await fetchRaw();
        let data = (json.data || []).slice(0, kjDataSize);
        // ❗ 接口空 → 用旧缓存
        if(!data.length){
            if(cache.length > 0){
                console.warn("接口无数据，用缓存");
                return cache;
            }
            return [];
        }
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        localStorage.setItem(CACHE_TIME_KEY, Date.now());
        return data;
    }catch(e){
        console.warn("拉取数据异常", e);
        if(cache.length > 0){
            return cache;
        }
        return [];
    }
}

function saveHot15History(hot15, latest, history) {
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    let expect = Number(latest.qishu) + 1;

    // 删除当前期旧记录
    list = list.filter(i => i.expect != expect);

    // ★ 精简保存：只保留必要字段
    let pureNums = hot15.map(item => ({
        num: item.num || item,
        level: item.level || 'supplement',
        score: Math.round((item.score || 0) * 100) / 100,
        category: item.category || ''
    }));
    
    let zodiacs = getHotZodiacs(history);
    let pureZodiacs = zodiacs.map(item => ({
        zodiac: item.zodiac,
        level: item.level || 'supplement',
        score: Math.round((item.score || 0) * 100) / 100,
        category: item.category || ''
    }));

    // 插入当前期（精简格式）
    list.unshift({
        expect: expect,
        date: latest.date,
        nums: pureNums,
        zodiacNums: pureZodiacs,
        top: [],
        kill: [],
        open: null,
        hit: null
    });

    // 补全最近10期（只有没记录的才补）
    let exists = new Set(list.map(i => Number(i.expect)));
    let currentQishu = Number(latest.qishu);
    for (let i = currentQishu; i > currentQishu - 10; i--) {
        if (!exists.has(i) && i !== expect) {
            list.push({
                expect: i,
                date: latest.date,
                nums: [],
                top: [],
                kill: [],
                open: null,
                hit: null
            });
        }
    }

    list.sort((a, b) => b.expect - a.expect);
    if (list.length > 30) list = list.slice(0, 30);
    localStorage.setItem("tmHistory", JSON.stringify(list));

    // 自动同步到云端（静默执行，不阻塞）
    saveToCloud(list).catch(e => console.error("云端同步失败:", e));
}

function updateResult(latest){
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    let qishu = Number(latest.qishu);
    
    // 解析特码（兼容多种格式）
    let nums;
    if (Array.isArray(latest.num)) {
        nums = latest.num;
    } else if (typeof latest.num === 'string') {
        nums = latest.num.replace(/\+/g, '').split(',').map(n => parseInt(n.trim()));
    }
    let openNum = nums ? nums[nums.length - 1] : null;
    
    let found = false;
    list.forEach(item => {
        if(Number(item.expect) === qishu){
            found = true
            if(item.open === null){
                item.open = openNum;
                item.hitNums = item.nums ? item.nums.map(n => String(n)).includes(String(openNum)) : false;
                item.hitTop  = item.top ? item.top.map(n => String(n)).includes(String(openNum)) : false;
                item.hit = item.hitTop;
                // ⭐ 生肖命中
                item.hitZodiac = item.zodiacNums ? item.zodiacNums.includes(getZodiac(openNum)) : false;            }
        }
    });
    if(!found){
        list.unshift({
            expect: qishu,
            date: latest.date,
            nums: [],
            zodiacNums: [],
            top: [],
            kill: [],
            open: openNum,
            hit: false,
            hitNums: false,
            hitTop: false,
            hitZodiac: false
        });
    }
    list.sort((a,b)=>b.expect - a.expect);
    localStorage.setItem("tmHistory", JSON.stringify(list));

    // 开奖结果更新后自动同步到云端
    saveToCloud(list).catch(e => console.error("云端同步失败:", e));

    let hot15History = JSON.parse(localStorage.getItem("hot15History") || "[]");
    let idx = hot15History.findIndex(item => item.expect === qishu);
    if (idx !== -1) {
        hot15History[idx].open = openNum;
        hot15History[idx].hit = hot15History[idx].nums ? hot15History[idx].nums.map(n => String(n)).includes(String(openNum)) : false;
        // ★ 同时设置 hitNums 和 hitZodiac（用于显示）
        hot15History[idx].hitNums = hot15History[idx].nums ? hot15History[idx].nums.map(n => String(n)).includes(String(openNum)) : false;
        hot15History[idx].hitZodiac = hot15History[idx].zodiacNums ? hot15History[idx].zodiacNums.includes(getZodiac(openNum)) : false;
        localStorage.setItem("hot15History", JSON.stringify(hot15History));
    }
}

// ===== 统一推荐引擎（号码+生肖共用） =====

/**
 * 通用统计计算
 * @param {Array} history - 历史数据数组
 * @param {Function} extractor - 从每期提取值的函数 (periodData) => value
 * @param {Array} allItems - 所有候选项列表
 * @param {Array|null} rawData - 原始数据（用于获取期号）
 * @returns {Array} 每个候选项的统计数据
 */
function calculateStats(history, extractor, allItems, rawData = null) {
    let data = history.slice(0, 50);
    let freq = {};
    let lastAppearIndex = {};
    let lastAppearQishu = {};
    let latestQishu = rawData && rawData.length > 0 ? parseInt(rawData[0].qishu) : 0;

    for (let i = 0; i < data.length; i++) {
        let value = extractor(data[i]);
        if (value === undefined || value === null) continue;

        freq[value] = (freq[value] || 0) + 1;

        if (lastAppearIndex[value] === undefined || i < lastAppearIndex[value]) {
            lastAppearIndex[value] = i;
            if (rawData && rawData[i]) {
                lastAppearQishu[value] = parseInt(rawData[i].qishu);
            }
        }
    }

    // 计算连续遗漏
    let consecutiveMiss = {};
    for (let item of allItems) {
        consecutiveMiss[item] = 0;
        for (let i = 0; i < data.length; i++) {
            if (extractor(data[i]) === item) break;
            consecutiveMiss[item]++;
        }
        if (lastAppearIndex[item] === undefined) {
            consecutiveMiss[item] = 50;
        }
    }

    // 构建详细统计数据
    let result = [];
    for (let item of allItems) {
        let f = freq[item] || 0;
        let rawMiss = lastAppearIndex[item] !== undefined ? lastAppearIndex[item] : 999;
        let missValue = Math.min(rawMiss, 50);
        let consec = Math.min(consecutiveMiss[item], 50);
        let freqRate = f / 50;

        let lastQishu = lastAppearQishu[item] || (latestQishu - 999);
        let periodsSinceLast = latestQishu - lastQishu;

        result.push({
            id: item,
            freq: f,
            freqRate: freqRate,
            rawMiss: rawMiss,
            miss: missValue,
            consecutiveMiss: consec,
            periodsSinceLast: periodsSinceLast,
            lastQishu: lastQishu
        });
    }

    return result;
}

/**
 * 频率区间分类
 * @param {Object} item - 统计数据项
 * @param {Object} thresholds - 阈值配置 { overheat, hot, warm }
 * @returns {String} 分类名称
 */
function categorizeByFreq(item, thresholds = {}) {
    let { overheat = 0.14, hot = 0.10, warm = 0.06 } = thresholds;

    if (item.freqRate >= overheat) return 'overheat';
    if (item.freqRate >= hot) return 'hot';
    if (item.freqRate >= warm) return 'warm';
    return 'cold';
}

/**
 * 回温检测：冷门/温号在最近N期内出现过
 * @param {Object} item - 已分类的统计项
 * @param {Number} maxPeriods - 最大期数阈值（默认3）
 * @returns {Boolean} 是否回温
 */
function checkWarmingUp(item, maxPeriods = 3) {
    return (item.category === 'cold' || item.category === 'warm') &&
           item.periodsSinceLast <= maxPeriods;
}

/**
 * ★★★ 统一选择引擎 ★★★
 * 支持：4级分类 + 过热排除 + 回温优先 + 日期轮换 + 自定义配额
 * 
 * @param {Array} statsData - calculateStats 返回的统计数据（需先调用 categorizeByFreq + checkWarmingUp）
 * @param {Object} config - 配置选项：
 *   - count: Number - 总选择数量（默认15）
 *   - quotas: Object - 各分类配额 { overheat, hot, warm, cold }（可选，有默认值）
 *   - scoreFn: Function - 自定义评分函数 (item) => number（可选）
 *   - preferWarmingFor: Array - 需要回温优先的分类（默认 ['warm', 'cold']）
 *   - displayLevels: Object - 显示层级配置 { core, supplement, cold }（百分比或固定数）
 * @returns {Array} 选择结果（带 level 标记）
 */
function unifiedSelect(statsData, config = {}) {
    let {
        count = 15,
        quotas = {},
        scoreFn = null,
        preferWarmingFor = ['warm', 'cold'],
        displayLevels = {},
        pureRankCategories = []  // ★ 使用纯分数排名的分类（不日期轮换）
    } = config;

    // ★ 默认配额（根据总数智能分配）
    let defaultQuotas;
    if (count <= 4) {
        defaultQuotas = { overheat: 0, hot: 1, warm: 2, cold: 1 };
    } else if (count <= 10) {
        defaultQuotas = { overheat: 0, hot: 2, warm: Math.ceil(count * 0.5), cold: Math.floor(count * 0.15) };
    } else {
        // 15码：热30% 温45% 冷15% 其余按分补
        defaultQuotas = {
            overheat: 0,
            hot: Math.ceil(count * 0.27),
            warm: Math.ceil(count * 0.40),
            cold: Math.floor(count * 0.13)
        };
    }
    let finalQuotas = { ...defaultQuotas, ...quotas };

    let result = [];
    let used = new Set();
    let rotateFactor = new Date().getDate();

    // ★ 辅助函数：在指定类别中选择（回温优先 + 日期轮换）
    function selectFromCategory(category, maxCount, preferWarming = false) {
        let candidates = statsData.filter(item =>
            item.category === category && !used.has(item.id)
        );

        if (candidates.length === 0) return [];

        // 排序
        candidates.sort((a, b) => {
            // 回温优先
            if (preferWarming) {
                if (a.isWarmingUp && !b.isWarmingUp) return -1;
                if (!a.isWarmingUp && b.isWarmingUp) return 1;
                if (a.periodsSinceLast !== b.periodsSinceLast) {
                    return a.periodsSinceLast - b.periodsSinceLast;
                }
            }

            // 评分排序
            if (scoreFn) {
                return scoreFn(b) - scoreFn(a);
            }
            // 默认评分：频率权重 + 遗漏权重
            let scoreA = a.freq * 4 + Math.sqrt(a.miss) * 2;
            let scoreB = b.freq * 4 + Math.sqrt(b.miss) * 2;
            return scoreB - scoreA;
        });

        // ★ 纯分数排名模式（不使用日期轮换，按分数+频率均衡选取）
        if (pureRankCategories.includes(category)) {
            // ★ 按频率分组：0次 vs 1次及以上
            let zeroFreq = candidates.filter(c => c.freq === 0);
            let nonZeroFreq = candidates.filter(c => c.freq > 0);

            // 各组分别排序
            zeroFreq.sort((a, b) => scoreFn ? scoreFn(b) - scoreFn(a) : (b.miss - a.miss));
            nonZeroFreq.sort((a, b) => scoreFn ? scoreFn(b) - scoreFn(a) : (b.freq * 4 + Math.sqrt(b.miss) * 2 - a.freq * 4 - Math.sqrt(a.miss) * 2));

            // ★ 动态均衡分配：按实际数量比例分配（至少各1个）
            let totalCount = zeroFreq.length + nonZeroFreq.length;
            let zeroRatio = zeroFreq.length / totalCount;
            let zeroCount = Math.max(Math.round(maxCount * zeroRatio), 1);
            let nonZeroCount = maxCount - zeroCount;
            if (nonZeroCount < 1 && maxCount > 1) { zeroCount = maxCount - 1; nonZeroCount = 1; }

            // ★ 0次号用日期轮换 + 步长分散（避免集中）
            let zeroSelected = [];
            if (zeroFreq.length > 0 && zeroCount > 0) {
                if (zeroFreq.length > zeroCount) {
                    let start = (rotateFactor - 1) % zeroFreq.length;
                    let step = Math.floor(zeroFreq.length / zeroCount);  // 步长分散
                    for (let i = 0; i < zeroCount; i++) {
                        zeroSelected.push(zeroFreq[(start + i * step) % zeroFreq.length]);
                    }
                } else {
                    zeroSelected = zeroFreq;
                }
            }

            // 非零次号用日期轮换
            let nonZeroSelected = [];
            if (nonZeroFreq.length > 0 && nonZeroCount > 0) {
                if (nonZeroFreq.length > nonZeroCount) {
                    let start = rotateFactor % nonZeroFreq.length;
                    for (let i = 0; i < nonZeroCount; i++) {
                        nonZeroSelected.push(nonZeroFreq[(start + i) % nonZeroFreq.length]);
                    }
                } else {
                    nonZeroSelected = nonZeroFreq;
                }
            }

            let selected = [...zeroSelected, ...nonZeroSelected];

            return selected;
        }

        // ★ 回温优先选择 + 日期轮换
        if (preferWarming) {
            let warmingCandidates = candidates.filter(c => c.isWarmingUp);
            let normalCandidates = candidates.filter(c => !c.isWarmingUp);

            let selected = [];

            // 1. 先选回温的（日期轮换）
            if (warmingCandidates.length > 0 && selected.length < maxCount) {
                let warmCount = Math.min(warmingCandidates.length, maxCount);
                let warmStartIndex = (rotateFactor - 1) % warmingCandidates.length;

                for (let i = 0; i < warmCount && selected.length < maxCount; i++) {
                    let idx = (warmStartIndex + i) % warmingCandidates.length;
                    selected.push(warmingCandidates[idx]);
                }
            }

            // 2. 再从非回温中选（日期轮换，不同偏移）
            if (normalCandidates.length > 0 && selected.length < maxCount) {
                let remaining = maxCount - selected.length;
                let normalStartIndex = (rotateFactor) % normalCandidates.length;

                for (let i = 0; i < remaining && selected.length < maxCount; i++) {
                    let idx = (normalStartIndex + i) % normalCandidates.length;
                    selected.push(normalCandidates[idx]);
                }
            }

            return selected;
        }

        // 不需要回温优先 → 直接日期轮换
        if (candidates.length > maxCount) {
            let startIndex = (rotateFactor - 1) % candidates.length;
            let selected = [];

            for (let i = 0; i < maxCount; i++) {
                let idx = (startIndex + i) % candidates.length;
                selected.push(candidates[idx]);
            }

            return selected;
        }

        return candidates.slice(0, maxCount);
    }

    // ★ 按类别顺序选择：hot → warm → cold → overheat（补充用）
    const categoryOrder = ['hot', 'warm', 'cold'];

    for (let cat of categoryOrder) {
        if (finalQuotas[cat] > 0) {
            let picks = selectFromCategory(cat, finalQuotas[cat], preferWarmingFor.includes(cat));
            picks.forEach(p => {
                result.push(p);
                used.add(p.id);
            });
        }
    }

    // ★ 如果还不够，从剩余候选中补满（纯分数排序，不按类别优先）
    if (result.length < count) {
        let remaining = statsData.filter(item => !used.has(item.id));
        remaining.sort((a, b) => {
            if (scoreFn) return scoreFn(b) - scoreFn(a);
            let scoreA = a.freq * 4 + Math.sqrt(a.miss) * 2;
            let scoreB = b.freq * 4 + Math.sqrt(b.miss) * 2;
            return scoreB - scoreA;
        });

        for (let r of remaining) {
            if (result.length >= count) break;
            result.push(r);
            used.add(r.id);
        }
    }

    // ★ 分层标记：整体按评分排序后切3段（科学推荐，不固化category）
    // 15个号统一按score高→低排序，前5→🔥，中5→⭐，后5→💎
    let CORE_COUNT = displayLevels.core || 5;
    let SUPP_COUNT = (displayLevels.supplement || 10) - CORE_COUNT;
    
    result.sort((a, b) => {
        if (scoreFn) return scoreFn(b) - scoreFn(a);
        return (b.freq * 4 + Math.sqrt(b.miss) * 2) - (a.freq * 4 + Math.sqrt(a.miss) * 2);
    });
    
    result.forEach((item, index) => {
        if (index < CORE_COUNT) item.level = 'core';
        else if (index < CORE_COUNT + SUPP_COUNT) item.level = 'supplement';
        else item.level = 'cold';
    });

    return result;
}

// ===== 50期热号15码（使用统一引擎）=====
function getHotNumbers(history, count = 15) {
    // 1-49 号码列表
    const ALL_NUMS = Array.from({ length: 49 }, (_, i) => i + 1);
    
    // 获取原始数据（用于期号计算）
    let rawData = null;
    try {
        rawData = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
    } catch(e) {}

    // ★ 步骤1：计算统计
    let stats = calculateStats(
        history,
        (period) => period[6],  // 提取特码（第7个号码）
        ALL_NUMS,
        rawData
    );

    // ★ 步骤2：分类 + 回温检测
    let thresholds = { overheat: 0.16, hot: 0.10, warm: 0.02 };  // 号码阈值：≥8次过热, ≥5次热, ≥1次温(扩大warm池)
    stats.forEach(item => {
        item.category = categorizeByFreq(item, thresholds);
        item.isWarmingUp = checkWarmingUp(item, 3);
        // 号码额外字段
        item.num = item.id;
        // ★ 计算评分（用于显示）：频率权重高，遗漏次要，冷门小补偿，近期惩罚
        let coldBonus = (item.freq === 0) ? 2 : 0;
        let recentPenalty = (item.miss <= 2) ? (2 - item.miss) * 8 : 0;  // 近期开出惩罚（加大）
        item.score = item.freq * 10 + Math.sqrt(item.miss) * 2 + item.consecutiveMiss * 0.2 + coldBonus - recentPenalty;
    });

    // ★ 步骤3：使用统一引擎选择
    // 号码专用评分：频率×10 + √遗漏×2 + 连续遗漏×0.2 + 冷门补偿(2) - 近期惩罚(×8)
    let numScoreFn = (item) => {
        let coldBonus = (item.freq === 0) ? 2 : 0;  // 0次号小补偿
        let recentPenalty = (item.miss <= 2) ? (2 - item.miss) * 8 : 0;  // 近期开出惩罚（加大）
        return item.freq * 10 + Math.sqrt(item.miss) * 2 + item.consecutiveMiss * 0.2 + coldBonus - recentPenalty;
    };
    
    let result = unifiedSelect(stats, {
        count: count,
        quotas: { overheat: 0, hot: 5, warm: 5, cold: 5 },  // 原始配额：均衡分配
        scoreFn: numScoreFn,
        preferWarmingFor: ['warm', 'cold'],
        pureRankCategories: ['cold', 'warm'],  // ★ cold和warm都：纯分数排名
        displayLevels: { core: 5, supplement: 10 }  // 🔥前5 ⭐6-10 💎11-15
    });

    return result;
}

function getHotZodiacs(history, count = 4) {
    // 12生肖列表
    const ALL_ZODIACS = ['马', '蛇', '龙', '兔', '虎', '牛', '鼠', '猪', '狗', '鸡', '猴', '羊'];
    
    // 获取原始数据（用于期号计算）
    let rawData = null;
    try {
        rawData = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
    } catch(e) {}

    // ★ 步骤1：计算统计
    let stats = calculateStats(
        history,
        (period) => getZodiac(period[6]),  // 提取特码对应的生肖
        ALL_ZODIACS,
        rawData
    );

    // ★ 步骤2：分类 + 回温检测
    let thresholds = { overheat: 0.14, hot: 0.10, warm: 0.06 };  // 生肖原阈值
    stats.forEach(item => {
        item.category = categorizeByFreq(item, thresholds);
        item.isWarmingUp = checkWarmingUp(item, 3);
        // 生肖额外字段
        item.zodiac = item.id;
        // ★ 计算评分（用于显示）：频率权重高，遗漏次要，近期惩罚
        let zodiacRecentPenalty = (item.miss <= 2) ? (2 - item.miss) * 5 : 0;  // 生肖惩罚（加大）
        item.score = item.freq * 4 + Math.sqrt(item.miss) * 2 - zodiacRecentPenalty;
    });

    // ★ 步骤3：使用统一引擎选择
    // 生肖专用评分：频率×4 + √遗漏×2 - 近期惩罚(×5)
    let zodiacScoreFn = (item) => {
        let recentPenalty = (item.miss <= 2) ? (2 - item.miss) * 5 : 0;  // 生肖惩罚（加大）
        return item.freq * 4 + Math.sqrt(item.miss) * 2 - recentPenalty;
    };
    
    let result = unifiedSelect(stats, {
        count: count,
        quotas: { overheat: 0, hot: 1, warm: 2, cold: 1 },  // 生肖原配额
        scoreFn: zodiacScoreFn,  // 使用带近期惩罚的评分
        preferWarmingFor: ['warm', 'cold'],
        displayLevels: { core: 1, supplement: 3 }  // 生肖：🔥1个 ⭐2个 💎1个
    });

    return result;
}

function renderTm(result, currentPeriod) {
    // ★ 记录当前显示的期号（用于云端加载后重新渲染）
    window.currentDisplayPeriod = currentPeriod;
    
    let top30 = [...(result.top || [])].sort((a, b) => a - b);
    let kill = [...(result.kill || [])].sort((a, b) => a - b);

    // ★ 获取最新开奖期号，用于判断是否为历史期
    let latestQishu = 0;
    try {
        let raw = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
        if (raw && raw.length > 0) {
            latestQishu = Number(raw[0].qishu) || 0;
        }
    } catch (e) {}
    
    // ★ 核心判断：只有明确知道是当前期才计算！
    // 保守策略：默认当历史期处理，避免误判导致覆盖云端数据
    let hasCacheData = (latestQishu > 0);
    let isCurrentPeriod = hasCacheData && (currentPeriod > latestQishu);
    
    // ★ 读取历史记录
    let hot15History = JSON.parse(localStorage.getItem("hot15History") || "[]");
    let historyRecord = hot15History.find(item => item.expect === currentPeriod);

    let nums, zodiacResult;
    
    if (!isCurrentPeriod) {
        // ★ 历史期或无法确定：只读取保存的数据，绝不重新计算！
        if (historyRecord && historyRecord.nums && historyRecord.nums.length > 0) {
            nums = historyRecord.nums;
            zodiacResult = historyRecord.zodiacNums || [];
        } else {
            // 无保存数据：显示空，不计算不保存
            nums = [];
            zodiacResult = [];
        }
    } else {
        // ★ 确认是当前期（未开奖）：检查数据版本是否变化
        // 核心逻辑：数据更新 = 推荐变化；数据不变 = 用缓存
        
        // 1. 获取当前最新的历史数据期号
        let currentDataPeriod = 0;
        try {
            let rawHistory = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
            if (rawHistory && rawHistory.length > 0) {
                // ★ 注意：原始数据用 qishu 字段，不是 expect！
                currentDataPeriod = Math.max(...rawHistory.map(item => {
                    let period = item.qishu || item.expect || item.period || 0;
                    return parseInt(period) || 0;
                }));
            }
        } catch (e) {}
        
        // 2. 获取缓存是基于哪期数据计算的
        let cacheBasedOnPeriod = historyRecord?.basedOnPeriod || 0;
        
        // 3. 比较：数据版本是否变化（或者数据还没加载完）
        if (historyRecord && historyRecord.nums && historyRecord.nums.length > 0 
            && cacheBasedOnPeriod === currentDataPeriod 
            && currentDataPeriod > 0) {  // 确保数据已加载（期号>0）
            // ✅ 数据没变（还是同一批50期数据）→ 用缓存，稳定不变
            nums = historyRecord.nums;
            zodiacResult = historyRecord.zodiacNums || [];
        } else {
            // ❌ 数据已更新（有新开奖）或 数据还没加载 → 重新计算
            let history = [];
            try {
                let raw = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
                history = getHistory(raw);
            } catch (e) {}
            
            nums = getHotNumbers(history);
            zodiacResult = getHotZodiacs(history);
        }
    }
    let label = `热号15码`;
    
    // ★ 只有确认是当前期才保存和同步
    if (isCurrentPeriod && nums.length > 0) {
        // ★ 精简保存：只保留必要字段（num/level/score/category）
        let pureNums = nums.map(item => ({
            num: item.num || item,
            level: item.level || 'supplement',
            score: Math.round((item.score || 0) * 100) / 100,  // 保留2位小数
            category: item.category || ''
        }));
        
        let pureZodiacs = zodiacResult.map(item => ({
            zodiac: item.zodiac,
            level: item.level || 'supplement',
            score: Math.round((item.score || 0) * 100) / 100,
            category: item.category || ''
        }));
        
        // 本地时间（无时差）
        let now = new Date();
        let pad = n => String(n).padStart(2, '0');
        let localDate = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        
        // 获取当前最新数据期号（用于后续判断是否需要重算）
        let basedOnPeriod = 0;
        try {
            let rawHistory = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
            if (rawHistory && rawHistory.length > 0) {
                // ★ 注意：原始数据用 qishu 字段，不是 expect！
                basedOnPeriod = Math.max(...rawHistory.map(item => {
                    let period = item.qishu || item.expect || item.period || 0;
                    return parseInt(period) || 0;
                }));
            }
        } catch (e) {}
        
        let newRecord = {
            expect: currentPeriod,
            nums: pureNums,           // 精简号码数组
            zodiacNums: pureZodiacs,   // 精简生肖数组
            open: null,
            hit: false,
            date: localDate,
            basedOnPeriod: basedOnPeriod  // ★ 基于哪期数据计算的（数据版本）
        };
        
        // ★ 查找并更新或插入
        let existIndex = hot15History.findIndex(item => item.expect === currentPeriod);
        if (existIndex !== -1) {
            // 已存在 → 更新（保留 open/hit 等开奖结果）
            newRecord.open = hot15History[existIndex].open;
            newRecord.hit = hot15History[existIndex].hit;
            newRecord.hitNums = hot15History[existIndex].hitNums;
            newRecord.hitTop = hot15History[existIndex].hitTop;
            newRecord.hitZodiac = hot15History[existIndex].hitZodiac;
            hot15History[existIndex] = newRecord;
        } else {
            // 不存在 → 插入到开头
            hot15History.unshift(newRecord);
        }
        
        hot15History = hot15History.slice(0, 30);
        localStorage.setItem("hot15History", JSON.stringify(hot15History));
        
        // ★ 同步到云端
        saveToCloud(hot15History).catch(e => console.error("云端同步失败:", e));
    }
    
    // ★ 分层格式化号码显示（方案B：组首标图标）
    let shownLevels = new Set();  // 记录已显示图标的层级
    let numsHtml = nums.map((item, index) => {
        let num = item.num || item;  // 兼容旧格式
        let level = item.level || 'normal';
        let score = item.score ?? '?';
        let category = item.category || '';
        
        // ★ 只在该层级的第一个元素前加图标
        let prefix = '';
        if (!shownLevels.has(level)) {
            if (level === 'core') prefix = '🔥';
            else if (level === 'supplement') prefix = '⭐';
            else if (level === 'cold') prefix = '💎';
            shownLevels.add(level);
        }
        
        // PC端title悬停 + 手机端点击显示（精简版：只显示评分和分类）
        let title = `号码${num}: ${category} | 评分${typeof score === 'number' ? score.toFixed(1) : score}`;
        let freq = item.freq ?? 0;
        let miss = item.miss ?? 0;
        let consec = item.consecutiveMiss ?? 0;
        return `<span style="cursor:pointer" onclick="showNumDetail(this, '${num}', ${freq}, ${miss}, ${consec}, ${score})" title="${title}">${prefix}${num}</span>`;
    }).join(' ');
    
    // ★ 分层格式化生肖显示（方案B：组首标图标）
    let shownZodiacLevels = new Set();
    let zodiacHtml = zodiacResult.map((item, index) => {
        let zodiac = item.zodiac;
        let level = item.level || 'normal';
        let score = item.score ?? '?';
        let category = item.category || '';
        
        let prefix = '';
        if (!shownZodiacLevels.has(level)) {
            if (level === 'core') prefix = '🔥';
            else if (level === 'supplement') prefix = '⭐';
            else if (level === 'cold') prefix = '💎';
            shownZodiacLevels.add(level);
        }
        
        let title = `生肖${zodiac}: ${category} | 评分${typeof score === 'number' ? score.toFixed(1) : score}`;
        let zFreq = item.freq ?? 0;
        let zMiss = item.miss ?? 0;
        let zConsec = item.consecutiveMiss ?? 0;
        return `<span style="cursor:pointer" onclick="showZodiacDetail(this, '${zodiac}', ${zFreq}, ${zMiss}, ${zConsec}, ${score})" title="${title}">${prefix}${zodiac}</span>`;
    }).join(' ');
    
    document.getElementById("tmOut").innerHTML = `
    <div class="card tm">
    🔥 当前${currentPeriod}期分析<br><br>
    🎯 号码推荐：<span style="word-break:break-all;">${numsHtml}</span><br>
    <!--<small style="color:#666;">(🔥核心5个 ⭐补充5个 💎观察5个)</small><br>--><br>
    🐭 生肖推荐：<span style="word-break:break-all;">${zodiacHtml}</span><br>
    <!--<small style="color:#666;">(🔥必选 ⭐备选 💎观察)</small><br>-->
    </div>`;
}

// ★ 统一解析数据数组：处理各种格式（支持多层嵌套字符串）
function parseDataArray(arr) {
    if (!arr) return [];
    
    // 情况1: 整个是字符串
    if (typeof arr === 'string') {
        try { arr = JSON.parse(arr); } catch(e) { 
            console.error("parseDataArray 解析失败:", arr.substring(0, 100));
            return []; 
        }
    }
    if (!Array.isArray(arr)) return [];
    
    return arr.map((item, idx) => {
        // 已经是对象且不是字符串
        if (typeof item === 'object' && item !== null) {
            // 额外检查：确保 .num 不是字符串格式的对象
            if (item.num && typeof item.num === 'string' && item.num.startsWith('{')) {
                try { item.num = JSON.parse(item.num).num; } catch(e) {}
            }
            return item;
        }
        
        // 是字符串，尝试解析（最多尝试2次，处理双重序列化）
        if (typeof item === 'string') {
            item = item.trim();
            let parsed = item;
            // 第一次解析
            if (parsed.startsWith('{') || parsed.startsWith('[')) {
                try { parsed = JSON.parse(parsed); } catch(e) {}
            }
            // 检查是否还需要第二次解析
            if (typeof parsed === 'string' && (parsed.startsWith('{') || parsed.startsWith('['))) {
                try { parsed = JSON.parse(parsed); } catch(e) {}
            }
            // 如果最终是对象，返回
            if (typeof parsed === 'object' && parsed !== null) return parsed;
            // 否则包装
            return { num: Number(parsed) || parsed, level: 'normal' };
        }
        
        // 其他类型
        return { num: item, level: 'normal' };
    });
}

// 静默补全缺失的开奖结果（不触发界面刷新）
async function silentUpdateMissingResults(list) {
    const needUpdate = list.filter(i => (i.open === null || i.open === undefined) && i.expect);
    if (needUpdate.length === 0) return;

    try {
        const data = await fetchData();
        let updated = false;
        
        for (let item of needUpdate) {
            const found = data.find(d => d.qishu == item.expect);
            if (found && found.num) {
                // 解析num字段（兼容多种格式）
                let nums;
                if (Array.isArray(found.num)) {
                    nums = found.num;
                } else if (typeof found.num === 'string') {
                    // 处理字符串格式，可能包含 "+" 号
                    nums = found.num.replace(/\+/g, '').split(',').map(n => parseInt(n.trim()));
                }
                
                if (nums && nums.length >= 7) {
                    // 取最后一个作为特码（第7个号码）
                    let teCode = nums[nums.length - 1];
                    
                    // 验证特码是否有效（1-49）
                    if (teCode >= 1 && teCode <= 49) {
                        item.open = teCode;
                        item.hitNums = item.nums.includes(item.open);
                        let openZodiac = getZodiac(item.open);
                        item.hitZodiac = (item.zodiacNums || []).includes(openZodiac);
                        updated = true;
                    } else {
                        // 特码无效，跳过
                    }
                } else {
                    // 号码数量不足，跳过
                }
            }
        }
        
        if (updated) {
            // 保存更新后的数据（静默保存，不刷新界面）
            localStorage.setItem("tmHistory", JSON.stringify(list));

            // 同步到云端
            saveToCloud(list).catch(e => {});
        }

    } catch (e) {
        // 补全失败，忽略
    }
}

// 每天9点和10点自动刷新
function scheduleRefresh() {
    let now = new Date();
    let next9 = new Date();
    next9.setHours(9, 0, 0, 0);
    let next10 = new Date();
    next10.setHours(18, 0, 0, 0);

    let targets = [next9, next10];
    for (let t of targets) {
        if (t <= now) t.setDate(t.getDate() + 1);
    }
    let next = targets[0] < targets[1] ? targets[0] : targets[1];
    let delay = next - now;

    setTimeout(() => {
        location.reload();
    }, delay);
}

// 从云端加载历史推荐（页面打开时自动调用）
async function loadFromCloud() {
  if (!CLOUD_API_KEY) {
    return null;
  }
  
  const binId = getCloudBinId();
  if (!binId) {
    return null;
  }
  
  try {
    const res = await fetch(`${JSONBIN_API_URL}/b/${binId}/latest`, {
      headers: { "X-Master-Key": CLOUD_API_KEY }
    });
    
    if (!res.ok) {
      return null;
    }
    
    const result = await res.json();
    const cloudData = result.record;
    
    if (cloudData && Array.isArray(cloudData)) {
      // 获取本地数据用于智能合并
      let localData = [];
      try {
        localData = JSON.parse(localStorage.getItem("tmHistory") || "[]");
      } catch(e) {}
      
      // 智能合并：对于每期数据，优先保留有open值（已开奖）的版本
      const mergedData = [];
      const processedExpects = new Set();
      
      // 先处理云端数据
      for (const cloudItem of cloudData) {
        if (!cloudItem.expect) continue;
        
        const localItem = localData.find(i => i.expect === cloudItem.expect);
        let finalItem = { ...cloudItem };
        
        if (localItem) {
          // 合并策略：优先保留有有效open值的版本
          const cloudHasOpen = cloudItem.open !== null && cloudItem.open !== undefined && cloudItem.open !== 0;
          const localHasOpen = localItem.open !== null && localItem.open !== undefined && localItem.open !== 0;
          
          if (localHasOpen && !cloudHasOpen) {
            // 本地有open值，云端没有 → 用本地的open
            finalItem.open = localItem.open;
            finalItem.hitNums = localItem.hitNums;
            finalItem.hitZodiac = localItem.hitZodiac;
          } else if (localHasOpen && cloudHasOpen && localItem.open !== cloudItem.open) {
            // 两边都有open但值不同 → 保留本地的（假设本地是最新修复过的）
            finalItem.open = localItem.open;
            finalItem.hitNums = localItem.hitNums;
            finalItem.hitZodiac = localItem.hitZodiac;
          }
          
          // 合并nums/zodiacNums
          // ★ 通用保护：所有已开奖的历史期，保留本地已有的推荐数据，不覆盖
          let isHistoryPeriod = (finalItem.open !== null && finalItem.open !== undefined) || 
                                (localItem.open !== null && localItem.open !== undefined);
          
          if (isHistoryPeriod && localItem.nums && localItem.nums.length > 0) {
            // 历史期：优先用本地的推荐数据（防止被错误覆盖）
            finalItem.nums = localItem.nums;
            finalItem.zodiacNums = localItem.zodiacNums || finalItem.zodiacNums;
          } else if ((!finalItem.nums || finalItem.nums.length === 0) && (localItem.nums && localItem.nums.length > 0)) {
            // 当前期或空数据：正常合并
            finalItem.nums = localItem.nums;
          }
          if ((!finalItem.zodiacNums || finalItem.zodiacNums.length === 0) && (localItem.zodiacNums && localItem.zodiacNums.length > 0)) {
            finalItem.zodiacNums = localItem.zodiacNums;
          }
        }
        
        mergedData.push(finalItem);
        processedExpects.add(cloudItem.expect);
      }
      
      // 添加本地有但云端没有的记录
      for (const localItem of localData) {
        if (localItem.expect && !processedExpects.has(localItem.expect)) {
          mergedData.push(localItem);
        }
      }

      // 按期号排序（新的在前）
      mergedData.sort((a, b) => (b.expect || 0) - (a.expect || 0));

      // 保存合并后的数据
      localStorage.setItem("tmHistory", JSON.stringify(mergedData));
      
      // ★ 同步到 hot15History（用于历史期显示）
      let hot15History = JSON.parse(localStorage.getItem("hot15History") || "[]");
      let needUpdate = false;
      
      for (const cloudItem of mergedData) {
        if (!cloudItem.expect || !cloudItem.nums) continue;
        
        // ★ 通用保护：历史期（已开奖）保留本地数据
        let isHistoryPeriod = (cloudItem.open !== null && cloudItem.open !== undefined);
        let localRecord = hot15History.find(i => i.expect === cloudItem.expect);
        let localHasData = localRecord && localRecord.nums && localRecord.nums.length > 0;
        
        if (isHistoryPeriod && localHasData) {
          // 历史期且本地有数据 → 跳过云端，保留本地
          continue;
        }
        
        let localIdx = hot15History.findIndex(i => i.expect === cloudItem.expect);
        if (localIdx === -1) {
          // 本地没有 → 添加
          hot15History.push(cloudItem);
          needUpdate = true;
        } else if (!hot15History[localIdx].nums || hot15History[localIdx].nums.length === 0) {
          // 本地为空 → 用云端数据更新
          hot15History[localIdx] = cloudItem;
          needUpdate = true;
        }
      }
      
      if (needUpdate) {
        // 按期号排序
        hot15History.sort((a, b) => (b.expect || 0) - (a.expect || 0));
        localStorage.setItem("hot15History", JSON.stringify(hot15History));
        
        // ★ 重新渲染当前期（让历史期能正确显示云端数据）
        if (window.currentDisplayPeriod) {
          renderTm({top: [], kill: []}, window.currentDisplayPeriod);
        }
      }
      
      return mergedData;
    }

    return null;
  } catch (e) {
    return null;
  }
}

async function fixAllHistoryData() {
    let box = document.getElementById("indexOut");
    
    if (!confirm("🔧 确定要修复所有历史数据吗？\n\n这将：\n1. 强制获取最新开奖数据\n2. 重新计算每期的特码（取最后一个号码）\n3. 更新所有命中结果\n4. 保存到本地并同步云端")) {
        return;
    }
    
    box.innerHTML = "🔧 正在修复历史数据，请稍等...";
    
    try {
        // 1. 获取历史记录
        let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");

        if (list.length === 0) {
            alert("没有历史数据需要修复");
            return;
        }

        // 2. 获取最新开奖数据（强制刷新，不用缓存）
        box.innerHTML = "🔧 步骤1/4: 正在强制获取最新开奖数据...";

        const data = await fetchData(true);  // true = 强制刷新

        if (!data || data.length === 0) {
            alert("❌ 无法获取开奖数据，请检查网络连接\n\n可能需要点击多次重试");
            return;
        }

        // 3. 逐期修复
        box.innerHTML = "🔧 步骤2/4: 正在重新计算特码和命中结果...";
        let fixedCount = 0;
        let errorCount = 0;
        let skipCount = 0;
        
        for (let item of list) {
            const found = data.find(d => d.qishu == item.expect);
            
            if (found && found.num) {
                // 解析号码（兼容数组和字符串）
                let nums;
                if (Array.isArray(found.num)) {
                    nums = found.num.map(n => parseInt(n));
                } else if (typeof found.num === 'string') {
                    // 去除所有非数字字符，然后分割
                    nums = found.num.replace(/[^0-9,]/g, '').split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));
                }

                if (nums && nums.length >= 7) {
                    // 取最后一个作为特码
                    let newOpenNum = nums[nums.length - 1];
                    
                    // 验证特码有效性（1-49）
                    if (newOpenNum >= 1 && newOpenNum <= 49) {
                        let oldOpen = item.open;
                        
                        // 强制更新（不管是否相同）
                        item.open = newOpenNum;
                        
                        // 重新计算命中结果
                        item.hitNums = (item.nums || []).includes(item.open);
                        let openZodiac = getZodiac(item.open);
                        item.hitZodiac = (item.zodiacNums || []).includes(openZodiac);
                        
                        if (oldOpen !== newOpenNum) {
                            fixedCount++;
                        } else {
                            skipCount++;
                        }
                    } else {
                        // 特码无效
                        errorCount++;
                    }
                } else {
                    // 号码数量不足
                    errorCount++;
                }
            } else {
                // API中未找到该期数据
            }
        }

        // 4. 保存修复后的数据
        box.innerHTML = "🔧 步骤3/4: 正在保存到本地存储...";
        localStorage.setItem("tmHistory", JSON.stringify(list));

        // 5. 同步到云端
        box.innerHTML = "🔧 步骤4/4: 正在同步到云端...";
        let cloudResult = await saveToCloud(list);
        
        // 6. 强制刷新显示
        box.innerHTML = "";
        updateMarquee(data[0]);  // 传入已获取的数据
        await showTmAnalysis();  // 这会重新渲染主界面
        
        // 手动触发一次历史结果显示（确保使用最新数据）
        await showTmHistory();   // 强制刷新历史记录
        
        // 7. 显示结果
        alert(`✅ 修复完成！\n\n📊 数据统计：\n• 修复了 ${fixedCount} 条记录\n• 无需修复 ${skipCount} 条\n• 出错 ${errorCount} 条\n\n💾 数据已保存到本地${cloudResult ? '并同步到云端' : '（云端同步失败）'}\n\n请查看"历史投注结果"确认`);

    } catch(e) {
        box.innerHTML = "❌ 修复失败：" + e.message;
        alert("❌ 修复失败：" + e.message + "\n\n请查看控制台(F12)了解详情");
    }
}

// ★ 通用修复历史期数据（被错误覆盖后恢复）
async function fixPeriodData(correctData) {
    try {
        // 1. 更新本地存储
        let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
        let idx = list.findIndex(i => i.expect === correctData.expect);
        if (idx >= 0) {
            list[idx] = correctData;
        } else {
            list.push(correctData);
        }
        localStorage.setItem("tmHistory", JSON.stringify(list));
        
        // 2. 更新hot15History
        let hot15List = JSON.parse(localStorage.getItem("hot15History") || "[]");
        let hIdx = hot15List.findIndex(i => i.expect === correctData.expect);
        if (hIdx >= 0) {
            hot15List[hIdx] = correctData;
        } else {
            hot15List.push(correctData);
        }
        localStorage.setItem("hot15History", JSON.stringify(hot15List));
        
        // 3. 同步到云端
        await saveToCloud(list);
        return true;
    } catch(e) {
        console.error(`❌ 修复${correctData.expect}期失败:`, e);
        return false;
    }
}

async function init(){
    let box = document.getElementById("indexOut");
    const startTime = Date.now();
    
    // ⚡ 立即从缓存显示滚动提示（毫秒级，不等任何网络请求）
    try {
        let cache = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
        if (cache && cache.length > 0) {
            let latest = cache[0];
            let numsHtml = formatNums(latest.num);
            let base = "📊 自动同步最新开奖，每日仅生成一次分析结果";
            let text = `${base}　　📢 最新开奖：${latest.qishu}期（${latest.date}）${numsHtml}`;
            document.getElementById("marqueeText").innerHTML = text + "　　" + text;
            
            // ★ 优化：立即用缓存数据渲染分析结果（不等网络）
            let currentPeriod = Number(latest.qishu) + 1;
            updateResult(latest);
            renderTm({top: [], kill: []}, currentPeriod);  // 用缓存数据渲染
        } else {
            document.getElementById("marqueeText").innerHTML = "📊 自动同步最新开奖，每日仅生成一次分析结果　　📊 自动同步最新开奖，每日仅生成一次分析结果";
        }
    } catch(e) {
        document.getElementById("marqueeText").innerHTML = "📊 自动同步最新开奖，每日仅生成一次分析结果　　📊 自动同步最新开奖，每日仅生成一次分析结果";
    }
    
    // ★ 修复已知被损坏的历史期数据
    try {
        await fixCorruptedPeriods();
    } catch(e) {
        console.log("历史期修复跳过:", e.message);
    }
    
    // ★ 后台静默获取数据（不阻塞界面）
    let data = [];
    let useCache = false;
    
    // 自动从云端加载历史推荐（如果配置了API Key）- 改为非阻塞
    if (CLOUD_API_KEY) {
        loadFromCloud().catch(e => console.log("云端加载失败:", e));
    }

    try{
        data = await fetchData();
        
        // 如果API返回空数据，尝试使用缓存
        if (!data || data.length === 0) {
            let cacheStr = localStorage.getItem("cacheHistory");
            if (cacheStr) {
                try {
                    data = JSON.parse(cacheStr);
                    useCache = true;
                } catch(e) {}
            }
        }
    }catch(e){
        // API失败时，尝试使用缓存
        let cacheStr = localStorage.getItem("cacheHistory");
        if (cacheStr) {
            try {
                data = JSON.parse(cacheStr);
                useCache = true;
            } catch(e2) {}
        }
    }
    
    if(!data || !data.length){
        box.innerHTML = `
        ⚠️ 数据加载失败<br><br>
        <div style="font-size:12px;color:#666;margin:10px 0;">
        可能的原因：<br>
        • 网络连接问题<br>
        • 防火墙/杀毒软件拦截<br>
        • 服务器暂时不可用
        </div>
        <button onclick="location.reload()" style="margin-right:10px;">🔄 重试</button>
        <button onclick="fixAllHistoryData()">🔧 修复历史数据</button>
        `;
        return;
    }
    
    // ★ 数据获取完成，更新显示
    let latest = data[0];
    
    // ★ 每次都重新渲染（确保日期轮换等实时因子生效）
    box.innerHTML = "";
    updateMarquee(latest);
    await showTmAnalysis();
    
    // 检查是否有新期号，显示对应提示
    let cache = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
    let cacheLatest = cache && cache.length > 0 ? cache[0] : null;
    let hasNewData = !cacheLatest || latest.qishu !== cacheLatest.qishu;
    
    if (hasNewData) {
        showToast(`✅ 已更新至最新期`);
    } else {
        showToast(`✅ 数据已是最新`);
    }
}
