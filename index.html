const CLOUD_CACHE_KEY = 'luhecai_cloud_cache';
const CLOUD_CACHE_TIME_KEY = 'luhecai_cloud_cache_time';
const CLOUD_CACHE_TTL = 60000; // 10秒缓存

async function getCloudData(forceRefresh = false) {
    const now = Date.now();
    
    // 从 sessionStorage 读取缓存
    if (!forceRefresh) {
        try {
            const cached = sessionStorage.getItem(CLOUD_CACHE_KEY);
            const cacheTime = parseInt(sessionStorage.getItem(CLOUD_CACHE_TIME_KEY)) || 0;
            if (cached && (now - cacheTime) < CLOUD_CACHE_TTL) {
                return { data: JSON.parse(cached), fromCache: true };
            }
        } catch(e) {}
    }
    
    if (!CLOUD_API_KEY) return { data: [], fromCache: false };
    
    try {
        const binId = getCloudBinId();
        if (!binId) return { data: [], fromCache: false };
        
        const res = await fetch(`${JSONBIN_API_URL}/b/${binId}/latest`, {
            headers: { "X-Master-Key": CLOUD_API_KEY }
        });
        if (res.ok) {
            const result = await res.json();
            const data = Array.isArray(result.record) ? result.record : [];
            // 存入 sessionStorage
            try {
                sessionStorage.setItem(CLOUD_CACHE_KEY, JSON.stringify(data));
                sessionStorage.setItem(CLOUD_CACHE_TIME_KEY, now.toString());
            } catch(e) {}
            return { data, fromCache: false };
        }
    } catch(e) {
        console.log("云端读取失败:", e.message);
    }
    return { data: [], fromCache: false };
}

// ★ 保存到云端（同时更新缓存）
async function saveCloudData(data) {
    if (!CLOUD_API_KEY) return false;
    
    try {
        const binId = getCloudBinId();
        if (!binId) return false;
        
        await fetch(`${JSONBIN_API_URL}/b/${binId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                "X-Master-Key": CLOUD_API_KEY
            },
            body: JSON.stringify(data)
        });
        // 更新 sessionStorage 缓存
        try {
            sessionStorage.setItem(CLOUD_CACHE_KEY, JSON.stringify(data));
            sessionStorage.setItem(CLOUD_CACHE_TIME_KEY, Date.now().toString());
        } catch(e) {}
        return true;
    } catch(e) {
        console.error("云端保存失败:", e);
        return false;
    }
}

async function fetchRaw(){
    try {
        // 添加10秒超时控制
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        
        let res = await fetch("https://ls.kjkj.fit/kj?t=" + Date.now(), {
            cache: "no-store",
            signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        if(!res.ok){
            throw new Error(`接口状态异常: ${res.status}`);
        }
        let text = await res.text();
        try{
            return JSON.parse(text);
        }catch(e){
            console.warn("返回不是JSON：", text.substring(0, 200));
            return { data: [] };
        }
    }catch(e){
        if (e.name === 'AbortError') {
            console.error("接口请求超时（>10秒）");
        } else {
            // 接口请求失败
        }
        return { data: [] };
    }
}

async function fetchData(forceRefresh = false){
    const CACHE_KEY = "cacheHistory";
    const CACHE_TIME_KEY = "cacheHistoryTime";
    const EXPIRE = 30 * 60 * 1000;
    
    // 安全读取缓存
    let cache = [];
    try {
        let cacheStr = localStorage.getItem(CACHE_KEY);
        if (cacheStr) {
            cache = JSON.parse(cacheStr);
        }
    } catch(e) {
        console.warn("缓存数据解析失败，将重新获取");
        cache = [];
        localStorage.removeItem(CACHE_KEY);
    }
    
    let cacheTime = localStorage.getItem(CACHE_TIME_KEY);

    // 如果不是强制刷新，且缓存有效，则使用缓存
    if(!forceRefresh && cache.length > 0 && cacheTime && (Date.now() - cacheTime < EXPIRE)){
        return cache;
    }
    
    if (forceRefresh) {
        // 强制刷新，忽略缓存
    }

    try{
        let json = await fetchRaw();
        let data = (json.data || []).slice(0, kjDataSize);
        // ❗ 接口空 → 用旧缓存
        if(!data.length){
            if(cache.length > 0){
                console.warn("接口无数据，用缓存");
                return cache;
            }
            return [];
        }
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        localStorage.setItem(CACHE_TIME_KEY, Date.now());
        return data;
    }catch(e){
        console.warn("拉取数据异常", e);
        if(cache.length > 0){
            return cache;
        }
        return [];
    }
}

async function showTmAnalysis(forceUpdate=false){

    }

        box.innerHTML = "⚠️ 拉取数据失败";
        return;
    }

    let currentPeriod = Number(latest.qishu) + 1;

        // ★ 云端有当前期推荐 → 直接使用（多端一致）

            num: n.num,
            level: n.level || 'supplement',
            score: n.score || 0,
            category: n.category || '',

            miss: n.miss || 0,
            consecutiveMiss: n.consecutiveMiss || 0

        zodiacs = (cloudRecommendation.zodiacNums || []).map(z => ({
            zodiac: z.zodiac,
            level: z.level || 'supplement',
            score: z.score || 0,
            category: z.category || ''

            <div style="font-size:16px; color:#e74c3c; font-weight:bold; margin-bottom:10px;">云端连接失败</div>

            <button onclick="location.reload()" style="padding:8px 24px; font-size:14px; cursor:pointer; border:none; border-radius:6px; background:#3498db; color:white;">🔄 刷新页面</button>
        </div>`;
        throw new Error("CLOUD_ERROR");  // ← 抛出错误让init()知道失败了
    } else if (!CLOUD_API_KEY) {
        // ★ 无API Key → 本地模式（单设备）
        hot15 = await getHotNumbers(history);
        zodiacs = await getHotZodiacs(history);
    } else {
        // ★ 云端无当前期推荐 → 计算并保存（首次/强制刷新）

async function saveHot15History(hot15, latest, history, zodiacs=null) {
    // ★ 纯云端模式：只保存到云端，不存本地（避免缓存导致多端不一致）
    let expect = Number(latest.qishu) + 1;

    // ★ 精简保存：保留必要字段 + 统计字段（用于详情显示）
    let pureNums = hot15.map(item => ({
        num: item.num || item,
        level: item.level || 'supplement',
        score: Math.round((item.score || 0) * 100) / 100,
        category: item.category || '',
        freq: item.freq || 0,
        miss: item.miss || 0,
        consecutiveMiss: item.consecutiveMiss || 0
    }));

    // ★ 如果没传入zodiacs，则计算（兼容旧调用）
    if (!zodiacs) {
        zodiacs = await getHotZodiacs(history);
    }
    let pureZodiacs = zodiacs.map(item => ({
        zodiac: item.zodiac,
        level: item.level || 'supplement',
        score: Math.round((item.score || 0) * 100) / 100,
        category: item.category || '',
        freq: item.freq || 0,
        freqRate: item.freqRate || 0,
        miss: item.miss || 0,
        consecutiveMiss: item.consecutiveMiss || 0
    }));

    // 获取当前最新数据期号（用于数据驱动缓存）
    let basedOnPeriod = 0;
    try {
        let rawHistory = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
        if (rawHistory && rawHistory.length > 0) {
            basedOnPeriod = Math.max(...rawHistory.map(item => {
                let period = item.qishu || item.expect || item.period || 0;
                return parseInt(period) || 0;
            }));
        }
    } catch (e) {}

    // 实时时间
    let now = new Date();
    let localDate = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    
    let newRecord = {
        expect: expect,
        nums: pureNums,
        zodiacNums: pureZodiacs,
        open: null,
        hit: false,
        date: localDate,
        basedOnPeriod: basedOnPeriod
    };
    
    // ★ 只同步到云端（不存本地！）
    if (CLOUD_API_KEY) {
        try {
            const binId = getCloudBinId();
            if (binId) {
                // 先拉取云端现有数据，合并后上传（防止覆盖已有数据）
                let {data: existingData} = await getCloudData();
                
                // 查找是否已存在当前期记录
                let existIndex = existingData.findIndex(r => r.expect === expect);
                if (existIndex !== -1) {
                    // 已存在 → 保留开奖结果，更新推荐
                    newRecord.open = existingData[existIndex].open;
                    newRecord.hit = existingData[existIndex].hit;
                    newRecord.hitNums = existingData[existIndex].hitNums;
                    newRecord.hitTop = existingData[existIndex].hitTop;
                    newRecord.hitZodiac = existingData[existIndex].hitZodiac;
                    existingData[existIndex] = newRecord;
                } else {
                    // 不存在 → 插入到开头
                    existingData.unshift(newRecord);
                }
                
                // 只保留最近30期
                existingData = existingData.slice(0, 30);
                
                // 上传到云端（使用统一的saveCloudData）
                await saveCloudData(existingData);
                console.log(`✅ ${expect}期推荐已保存到云端`);
            }
        } catch(e) {
            console.error("云端保存失败:", e);
        }
    }
}

// ★ 纯云端模式：更新开奖结果（只操作云端，不存本地）
async function updateResult(latest){
    // ★ 先从云端读取历史记录
    let {data: list} = await getCloudData();

    let qishu = Number(latest.qishu);

    // 解析特码（兼容多种格式）
    let nums;
    if (Array.isArray(latest.num)) {
        nums = latest.num;
    } else if (typeof latest.num === 'string') {
        nums = latest.num.replace(/\+/g, '').split(',').map(n => parseInt(n.trim()));
    }
    let openNum = nums ? nums[nums.length - 1] : null;

    let found = false;
    list.forEach(item => {
        if(Number(item.expect) === qishu){
            found = true
            if(item.open === null){
                item.open = openNum;
                item.hitNums = item.nums ? item.nums.map(n => String(n)).includes(String(openNum)) : false;
                item.hitTop  = item.top ? item.top.map(n => String(n)).includes(String(openNum)) : false;
                item.hit = item.hitTop;
                // ⭐ 生肖命中
                item.hitZodiac = item.zodiacNums ? item.zodiacNums.includes(getZodiac(openNum)) : false;            }
        }
    });
    if(!found){
        list.unshift({
            expect: qishu,
            date: latest.date,
            nums: [],
            zodiacNums: [],
            top: [],
            kill: [],
            open: openNum,
            hit: false,
            hitNums: false,
            hitTop: false,
            hitZodiac: false
        });
    }
    list.sort((a,b)=>b.expect - a.expect);

    // ★ 纯云端模式：直接保存到云端（使用统一的saveCloudData）
    await saveCloudData(list);
}

/**

 * @param {Array} allItems - 所有候选项列表
 * @param {Array|null} rawData - 原始数据（用于获取期号）
 * @returns {Array} 每个候选项的统计数据
 */
function calculateStats(history, extractor, allItems, rawData = null) {
    let data = history.slice(0, 50);
    let freq = {};
    let lastAppearIndex = {};
    let lastAppearQishu = {};
    let latestQishu = rawData && rawData.length > 0 ? parseInt(rawData[0].qishu) : 0;

    for (let i = 0; i < data.length; i++) {
        let value = extractor(data[i]);
        if (value === undefined || value === null) continue;

        freq[value] = (freq[value] || 0) + 1;

        if (lastAppearIndex[value] === undefined || i < lastAppearIndex[value]) {
            lastAppearIndex[value] = i;
            if (rawData && rawData[i]) {
                lastAppearQishu[value] = parseInt(rawData[i].qishu);
            }
        }
    }

    // 计算连续遗漏
    let consecutiveMiss = {};
    for (let item of allItems) {
        consecutiveMiss[item] = 0;
        for (let i = 0; i < data.length; i++) {
            if (extractor(data[i]) === item) break;
            consecutiveMiss[item]++;
        }
        if (lastAppearIndex[item] === undefined) {
            consecutiveMiss[item] = 50;
        }
    }

    // 构建详细统计数据
    let result = [];
    for (let item of allItems) {
        let f = freq[item] || 0;
        let rawMiss = lastAppearIndex[item] !== undefined ? lastAppearIndex[item] : 999;
        let missValue = Math.min(rawMiss, 50);
        let consec = Math.min(consecutiveMiss[item], 50);
        let freqRate = f / 50;

        let lastQishu = lastAppearQishu[item] || (latestQishu - 999);
        let periodsSinceLast = latestQishu - lastQishu;

        result.push({
            id: item,
            freq: f,
            freqRate: freqRate,
            rawMiss: rawMiss,
            miss: missValue,
            consecutiveMiss: consec,
            periodsSinceLast: periodsSinceLast,
            lastQishu: lastQishu
        });
    }

    return result;
}

/**
 * 频率区间分类
 * @param {Object} item - 统计数据项
 * @param {Object} thresholds - 阈值配置 { overheat, hot, warm }
 * @returns {String} 分类名称
 */
function categorizeByFreq(item, thresholds = {}) {
    let { overheat = 0.14, hot = 0.10, warm = 0.06 } = thresholds;

    if (item.freqRate >= overheat) return 'overheat';
    if (item.freqRate >= hot) return 'hot';
    if (item.freqRate >= warm) return 'warm';
    return 'cold';
}

/**
 * 回温检测：冷门/温号在最近N期内出现过
 * @param {Object} item - 已分类的统计项
 * @param {Number} maxPeriods - 最大期数阈值（默认3）
 * @returns {Boolean} 是否回温
 */
function checkWarmingUp(item, maxPeriods = 3) {
    return (item.category === 'cold' || item.category === 'warm') &&
           item.periodsSinceLast <= maxPeriods;
}

/**
 * ★★★ 统一选择引擎 ★★★
 * 支持：4级分类 + 过热排除 + 回温优先 + 日期轮换 + 自定义配额
 *
 * @param {Array} statsData - calculateStats 返回的统计数据（需先调用 categorizeByFreq + checkWarmingUp）
 * @param {Object} config - 配置选项：
 *   - count: Number - 总选择数量（默认15）
 *   - quotas: Object - 各分类配额 { overheat, hot, warm, cold }（可选，有默认值）
 *   - scoreFn: Function - 自定义评分函数 (item) => number（可选）
 *   - preferWarmingFor: Array - 需要回温优先的分类（默认 ['warm', 'cold']）
 *   - displayLevels: Object - 显示层级配置 { core, supplement, cold }（百分比或固定数）
 * @returns {Array} 选择结果（带 level 标记）
 */

/**
 * 获取最近N期推荐过的cold层号码（用于覆盖机制）
 * @param {number} periods - 查看最近几期，默认2期
 * @returns {Array} 最近N期cold层推荐过的号码列表
 */
async function getRecentlyRecommendedColdNums(periods = 2) {
    // ★ 使用统一的云端读取（带内存缓存）
    let {data: tmHistory} = await getCloudData();

    // 获取当前期号
    let currentPeriod = window.currentDisplayPeriod || 0;
    if (currentPeriod === 0) {
        // 尝试从cacheHistory获取最新期号推算
        let raw = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
        if (raw && raw.length > 0) {
            let maxQishu = Math.max(...raw.map(item => {
                let p = item.qishu || item.expect || item.period || 0;
                return parseInt(p) || 0;
            }));
            currentPeriod = maxQishu + 1;
        }
    }

    // 取最近N期（排除当前期）
    let recentRecords = tmHistory
        .filter(r => r.expect && r.expect < currentPeriod && r.nums && Array.isArray(r.nums))
        .sort((a, b) => b.expect - a.expect)
        .slice(0, periods);

    // 提取这些期中cold层的号码
    let recommendedColdNums = [];
    recentRecords.forEach(record => {
        if (record.nums) {
            record.nums.forEach(num => {
                let numObj = num.num || num;
                let level = num.level || '';

                // 只收集cold层的号
                if (level === 'cold') {
                    recommendedColdNums.push(Number(numObj));
                }
                });
            }
        });

        return [...new Set(recommendedColdNums)];  // 去重
}

async function unifiedSelect(statsData, config = {}) {
    let {
        count = 15,
        quotas = {},
        scoreFn = null,
        preferWarmingFor = ['warm', 'cold'],
        displayLevels = {},
        pureRankCategories = []  // ★ 使用纯分数排名的分类（不日期轮换）
    } = config;

    // ★ 默认配额（根据总数智能分配）
    let defaultQuotas;
    if (count <= 4) {
        defaultQuotas = { overheat: 0, hot: 1, warm: 2, cold: 1 };
    } else if (count <= 10) {
        defaultQuotas = { overheat: 0, hot: 2, warm: Math.ceil(count * 0.5), cold: Math.floor(count * 0.15) };
    } else {
        // 15码：热30% 温45% 冷15% 其余按分补
        defaultQuotas = {
            overheat: 0,
            hot: Math.ceil(count * 0.27),
            warm: Math.ceil(count * 0.40),
            cold: Math.floor(count * 0.13)
        };
    }
    let finalQuotas = { ...defaultQuotas, ...quotas };

    let result = [];
    let used = new Set();
    
    // ★ 数据驱动轮换因子：基于数据版本号，不是日期！
    // 只有开奖后数据更新了，rotateFactor 才会变 → 推荐才会变
    let dataVersionPeriod = 0;
    try {
        let rawHistory = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
        if (rawHistory && rawHistory.length > 0) {
            dataVersionPeriod = Math.max(...rawHistory.map(item => {
                return parseInt(item.qishu || item.expect || item.period || 0) || 0;
            }));
        }
    } catch (e) {}
    let rotateFactor = dataVersionPeriod > 0 ? dataVersionPeriod : new Date().getDate();

    // ★ 辅助函数：在指定类别中选择（回温优先 + 日期轮换）
    async function selectFromCategory(category, maxCount, preferWarming = false) {
        let candidates = statsData.filter(item =>
            item.category === category && !used.has(item.id)
        );

        if (candidates.length === 0) return [];

        // 排序
        candidates.sort((a, b) => {
            // 回温优先
            if (preferWarming) {
                if (a.isWarmingUp && !b.isWarmingUp) return -1;
                if (!a.isWarmingUp && b.isWarmingUp) return 1;
                if (a.periodsSinceLast !== b.periodsSinceLast) {
                    return a.periodsSinceLast - b.periodsSinceLast;
                }
            }

            // 评分排序
            if (scoreFn) {
                return scoreFn(b) - scoreFn(a);
            }
            // 默认评分：频率权重 + 遗漏权重
            let scoreA = a.freq * 4 + Math.sqrt(a.miss) * 2;
            let scoreB = b.freq * 4 + Math.sqrt(b.miss) * 2;
            return scoreB - scoreA;
        });

        // ★ 纯分数排名模式（不使用日期轮换，按分数+频率均衡选取）
        if (pureRankCategories.includes(category)) {
            // ★ 按频率分组：0次 vs 1次及以上
            let zeroFreq = candidates.filter(c => c.freq === 0);
            let nonZeroFreq = candidates.filter(c => c.freq > 0);

            // 各组分别排序
            zeroFreq.sort((a, b) => scoreFn ? scoreFn(b) - scoreFn(a) : (b.miss - a.miss));
            nonZeroFreq.sort((a, b) => scoreFn ? scoreFn(b) - scoreFn(a) : (b.freq * 4 + Math.sqrt(b.miss) * 2 - a.freq * 4 - Math.sqrt(a.miss) * 2));

            // ★ 动态均衡分配：按实际数量比例分配（至少各1个）
            let totalCount = zeroFreq.length + nonZeroFreq.length;
            let zeroRatio = zeroFreq.length / totalCount;
            let zeroCount = Math.max(Math.round(maxCount * zeroRatio), 1);
            let nonZeroCount = maxCount - zeroCount;
            if (nonZeroCount < 1 && maxCount > 1) { zeroCount = maxCount - 1; nonZeroCount = 1; }

            // ★ 0次号选择：cold层加入"覆盖机制"，其他层保持原逻辑
            let zeroSelected = [];
            if (zeroFreq.length > 0 && zeroCount > 0) {
                if (zeroFreq.length > zeroCount) {
                    // ★ 判断是否是cold层（需要覆盖机制）
                    if (category === 'cold') {
                        // cold层：排除近期已推荐的0频次号，强制覆盖不同号码
                        let excludeNums = await getRecentlyRecommendedColdNums(2);

                        // 分成两组：没推荐过的 vs 推荐过的
                        let available = zeroFreq.filter(c => !excludeNums.includes(c.id));
                        let excluded = zeroFreq.filter(c => excludeNums.includes(c.id));

                        if (available.length >= zeroCount) {
                            // ✅ 没推荐过的够选 → 全从available中轮换选
                            let start = (rotateFactor - 1) % available.length;
                            let step = Math.floor(available.length / zeroCount);
                            for (let i = 0; i < zeroCount; i++) {
                                zeroSelected.push(available[(start + i * step) % available.length]);
                            }
                        } else {
                            // ⚠️ 不够 → 先选available，再从excluded补
                            zeroSelected = [...available];
                            let needMore = zeroCount - zeroSelected.length;
                            if (needMore > 0 && excluded.length > 0) {
                                let start = (rotateFactor - 1) % excluded.length;
                                let step = Math.floor(excluded.length / needMore);
                                for (let i = 0; i < needMore; i++) {
                                    zeroSelected.push(excluded[(start + i * step) % excluded.length]);
                                }
                            }
                        }
                    } else {
                        // 非cold层（warm等）：保持原有日期轮换逻辑不变
                        let start = (rotateFactor - 1) % zeroFreq.length;
                        let step = Math.floor(zeroFreq.length / zeroCount);  // 步长分散
                        for (let i = 0; i < zeroCount; i++) {
                            zeroSelected.push(zeroFreq[(start + i * step) % zeroFreq.length]);
                        }
                    }
                } else {
                    zeroSelected = zeroFreq;
                }
            }

            // 非零次号用日期轮换
            let nonZeroSelected = [];
            if (nonZeroFreq.length > 0 && nonZeroCount > 0) {
                if (nonZeroFreq.length > nonZeroCount) {
                    let start = rotateFactor % nonZeroFreq.length;
                    for (let i = 0; i < nonZeroCount; i++) {
                        nonZeroSelected.push(nonZeroFreq[(start + i) % nonZeroFreq.length]);
                    }
                } else {
                    nonZeroSelected = nonZeroFreq;
                }
            }

            let selected = [...zeroSelected, ...nonZeroSelected];

            return selected;
        }

        // ★ 回温优先选择 + 日期轮换
        if (preferWarming) {
            let warmingCandidates = candidates.filter(c => c.isWarmingUp);
            let normalCandidates = candidates.filter(c => !c.isWarmingUp);

            let selected = [];

            // 1. 先选回温的（日期轮换）
            if (warmingCandidates.length > 0 && selected.length < maxCount) {
                let warmCount = Math.min(warmingCandidates.length, maxCount);
                let warmStartIndex = (rotateFactor - 1) % warmingCandidates.length;

                for (let i = 0; i < warmCount && selected.length < maxCount; i++) {
                    let idx = (warmStartIndex + i) % warmingCandidates.length;
                    selected.push(warmingCandidates[idx]);
                }
            }

            // 2. 再从非回温中选（日期轮换，不同偏移）
            if (normalCandidates.length > 0 && selected.length < maxCount) {
                let remaining = maxCount - selected.length;
                let normalStartIndex = (rotateFactor) % normalCandidates.length;

                for (let i = 0; i < remaining && selected.length < maxCount; i++) {
                    let idx = (normalStartIndex + i) % normalCandidates.length;
                    selected.push(normalCandidates[idx]);
                }
            }

            return selected;
        }

        // 不需要回温优先 → 直接日期轮换
        if (candidates.length > maxCount) {
            let startIndex = (rotateFactor - 1) % candidates.length;
            let selected = [];

            for (let i = 0; i < maxCount; i++) {
                let idx = (startIndex + i) % candidates.length;
                selected.push(candidates[idx]);
            }

            return selected;
        }

        return candidates.slice(0, maxCount);
    }

    // ★ 按类别顺序选择：hot → warm → cold → overheat（补充用）
    const categoryOrder = ['hot', 'warm', 'cold'];

    for (let cat of categoryOrder) {
        if (finalQuotas[cat] > 0) {
            let picks = await selectFromCategory(cat, finalQuotas[cat], preferWarmingFor.includes(cat));
            picks.forEach(p => {
                result.push(p);
                used.add(p.id);
            });
        }
    }

    // ★ 如果还不够，从剩余候选中补满（纯分数排序，不按类别优先）
    if (result.length < count) {
        let remaining = statsData.filter(item => !used.has(item.id));
        remaining.sort((a, b) => {
            if (scoreFn) return scoreFn(b) - scoreFn(a);
            let scoreA = a.freq * 4 + Math.sqrt(a.miss) * 2;
            let scoreB = b.freq * 4 + Math.sqrt(b.miss) * 2;
            return scoreB - scoreA;
        });

        for (let r of remaining) {
            if (result.length >= count) break;
            result.push(r);
            used.add(r.id);
        }
    }

    // ★ 分层标记：整体按评分排序后切3段（科学推荐，不固化category）
    // 15个号统一按score高→低排序，前5→🔥，中5→⭐，后5→💎
    let CORE_COUNT = displayLevels.core || 5;
    let SUPP_COUNT = (displayLevels.supplement || 10) - CORE_COUNT;

    result.sort((a, b) => {
        if (scoreFn) return scoreFn(b) - scoreFn(a);
        return (b.freq * 4 + Math.sqrt(b.miss) * 2) - (a.freq * 4 + Math.sqrt(a.miss) * 2);
    });

    result.forEach((item, index) => {
        if (index < CORE_COUNT) item.level = 'core';
        else if (index < CORE_COUNT + SUPP_COUNT) item.level = 'supplement';
        else item.level = 'cold';
    });

    return result;
}

// ===== 50期热号15码（使用统一引擎）=====
async function getHotNumbers(history, count = 15) {
    // 1-49 号码列表
    const ALL_NUMS = Array.from({ length: 49 }, (_, i) => i + 1);

    // 获取原始数据（用于期号计算）
    let rawData = null;
    try {
        rawData = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
    } catch(e) {}

    // ★ 步骤1：计算统计
    let stats = calculateStats(
        history,
        (period) => period[6],  // 提取特码（第7个号码）
        ALL_NUMS,
        rawData
    );

    // ★ 步骤2：分类 + 回温检测
    let thresholds = { overheat: 0.16, hot: 0.10, warm: 0.02 };  // 号码阈值：≥8次过热, ≥5次热, ≥1次温(扩大warm池)
    stats.forEach(item => {
        item.category = categorizeByFreq(item, thresholds);
        item.isWarmingUp = checkWarmingUp(item, 3);
        // 号码额外字段
        item.num = item.id;
        // ★ 计算评分（用于显示）：频率权重高，遗漏次要，冷门小补偿，近期惩罚
        let coldBonus = (item.freq === 0) ? 2 : 0;
        let recentPenalty = (item.miss <= 2) ? (2 - item.miss) * 8 : 0;  // 近期开出惩罚（加大）
        item.score = item.freq * 10 + Math.sqrt(item.miss) * 2 + item.consecutiveMiss * 0.2 + coldBonus - recentPenalty;
    });

    // ★ 步骤3：使用统一引擎选择
    // 号码专用评分：频率×10 + √遗漏×2 + 连续遗漏×0.2 + 冷门补偿(2) - 近期惩罚(×8)
    let numScoreFn = (item) => {
        let coldBonus = (item.freq === 0) ? 2 : 0;  // 0次号小补偿
        let recentPenalty = (item.miss <= 2) ? (2 - item.miss) * 8 : 0;  // 近期开出惩罚（加大）
        return item.freq * 10 + Math.sqrt(item.miss) * 2 + item.consecutiveMiss * 0.2 + coldBonus - recentPenalty;
    };

    let result = await unifiedSelect(stats, {
        count: count,
        quotas: { overheat: 0, hot: 5, warm: 5, cold: 5 },  // 原始配额：均衡分配
        scoreFn: numScoreFn,
        preferWarmingFor: ['warm', 'cold'],
        pureRankCategories: ['cold', 'warm'],  // ★ cold和warm都：纯分数排名
        displayLevels: { core: 5, supplement: 10 }  // 🔥前5 ⭐6-10 💎11-15
    });

    return result;
}

                    // 计算生肖统计
                    const ALL_ZODIACS = ['马', '蛇', '龙', '兔', '虎', '牛', '鼠', '猪', '狗', '鸡', '猴', '羊'];
                    let zodStats = calculateStats(history, (p) => getZodiac(p[6]), ALL_ZODIACS, raw);
                    zodiacResult = zodiacResult.map(item => {
                        let stat = zodStats.find(s => s.id === item.zodiac);
                        return stat ? { ...item, freq: stat.freq, freqRate: stat.freqRate, miss: stat.miss, consecutiveMiss: stat.consecutiveMiss } : item;
                    });
                } catch(e) {
                    console.log("补全统计字段失败:", e.message);
                }
            }
        } else {
            // 无保存数据：显示空，不计算不保存
            nums = [];
            zodiacResult = [];
        }
    } else {
        // ★ 确认是当前期（未开奖）：优先使用预计算数据
        if (precomputedData && precomputedData.nums && precomputedData.nums.length > 0) {
            // ★ 使用showTmAnalysis传入的预计算数据（保证显示和保存一致）✅
            nums = precomputedData.nums;
            zodiacResult = precomputedData.zodiacNums || [];
        } else if (historyRecord && historyRecord.nums && historyRecord.nums.length > 0) {
            // 有缓存 → 检查数据版本是否变化
            let currentDataPeriod = 0;
            try {
                let rawHistory = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
                if (rawHistory && rawHistory.length > 0) {
                    currentDataPeriod = Math.max(...rawHistory.map(item => {
                        let period = item.qishu || item.expect || item.period || 0;
                        return parseInt(period) || 0;
                    }));
                }
            } catch (e) {}

            let cacheBasedOnPeriod = historyRecord?.basedOnPeriod || 0;

            if (cacheBasedOnPeriod === currentDataPeriod && currentDataPeriod > 0) {
                // ✅ 数据没变 → 用缓存（稳定不变）
                nums = historyRecord.nums;
                zodiacResult = historyRecord.zodiacNums || [];
            } else {
                // ❌ 数据更新了 → 重算
                let history = [];
                try {
                    let raw = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
                    history = getHistory(raw);
                } catch (e) {}

                nums = await getHotNumbers(history);
                zodiacResult = await getHotZodiacs(history);
            }
        }
    }
    let label = `热号15码`;

    // ★ 注意：保存逻辑已移到 showTmAnalysis() 中统一处理
    // renderTm 只负责显示，不再保存（避免二次覆盖导致数据丢失）
    
    // ★ 分层格式化号码显示（方案B：组首标图标）
    let shownLevels = new Set();  // 记录已显示图标的层级
    let numsHtml = nums.map((item, index) => {
        let num = item.num || item;  // 兼容旧格式
        let level = item.level || 'normal';
        let score = item.score ?? '?';
        let category = item.category || '';
        
        // ★ 只在该层级的第一个元素前加图标
        let prefix = '';
        if (!shownLevels.has(level)) {
            if (level === 'core') prefix = '🔥';
            else if (level === 'supplement') prefix = '⭐';
            else if (level === 'cold') prefix = '💎';
            shownLevels.add(level);
        }
        
        // PC端title悬停 + 手机端点击显示（精简版：只显示评分和分类）
        let title = `号码${num}: ${category} | 评分${typeof score === 'number' ? score.toFixed(1) : score}`;
        let freq = item.freq ?? 0;
        let miss = item.miss ?? 0;
        let consec = item.consecutiveMiss ?? 0;
        return `<span style="cursor:pointer" onclick="showNumDetail(this, '${num}', ${freq}, ${miss}, ${consec}, ${score})" title="${title}">${prefix}${num}</span>`;
    }).join(' ');
    
    // ★ 分层格式化生肖显示（方案B：组首标图标）
    let shownZodiacLevels = new Set();
    let zodiacHtml = zodiacResult.map((item, index) => {
        let zodiac = item.zodiac;
        let level = item.level || 'normal';
        let score = item.score ?? '?';
        let category = item.category || '';
        
        let prefix = '';
        if (!shownZodiacLevels.has(level)) {
            if (level === 'core') prefix = '🔥';
            else if (level === 'supplement') prefix = '⭐';
            else if (level === 'cold') prefix = '💎';
            shownZodiacLevels.add(level);
        }
        
        let title = `生肖${zodiac}: ${category} | 评分${typeof score === 'number' ? score.toFixed(1) : score}`;
        let zFreq = item.freq ?? 0;
        let zFreqRate = item.freqRate ?? 0;
        let zMiss = item.miss ?? 0;
        return `<span style="cursor:pointer" onclick="showZodiacDetail(this, '${zodiac}', ${zFreq}, ${zFreqRate}, ${zMiss}, ${score})" title="${title}">${prefix}${zodiac}</span>`;
    }).join(' ');
    
    document.getElementById("tmOut").innerHTML = `
    <div class="card tm">
    🔥 当前${currentPeriod}期分析<br><br>
    🎯 号码推荐：<span style="word-break:break-all;">${numsHtml}</span><br>
    <!--<small style="color:#666;">(🔥核心5个 ⭐补充5个 💎观察5个)</small><br>--><br>
    🐭 生肖推荐：<span style="word-break:break-all;">${zodiacHtml}</span><br>
    <!--<small style="color:#666;">(🔥必选 ⭐备选 💎观察)</small><br>-->
    </div>`;
}

    // ⭐ 直接用热号15码生成投注方案（提取纯号码 + 保留层级）

// 静默补全缺失的开奖结果（不触发界面刷新）- 纯云端模式
async function silentUpdateMissingResults(list) {
    const needUpdate = list.filter(i => (i.open === null || i.open === undefined) && i.expect);
    if (needUpdate.length === 0) return;

    try {
        const data = await fetchData();
        let updated = false;
        
        for (let item of needUpdate) {
            const found = data.find(d => d.qishu == item.expect);
            if (found && found.num) {
                // 解析num字段（兼容多种格式）
                let nums;
                if (Array.isArray(found.num)) {
                    nums = found.num;
                } else if (typeof found.num === 'string') {
                    // 处理字符串格式，可能包含 "+" 号
                    nums = found.num.replace(/\+/g, '').split(',').map(n => parseInt(n.trim()));
                }
                
                if (nums && nums.length >= 7) {
                    // 取最后一个作为特码（第7个号码）
                    let teCode = nums[nums.length - 1];
                    
                    // 验证特码是否有效（1-49）
                    if (teCode >= 1 && teCode <= 49) {
                        item.open = teCode;
                        item.hitNums = item.nums.includes(item.open);
                        let openZodiac = getZodiac(item.open);
                        item.hitZodiac = (item.zodiacNums || []).includes(openZodiac);
                        updated = true;
                    } else {
                        // 特码无效，跳过
                    }
                } else {
                    // 号码数量不足，跳过
                }
            }
        }
        
        if (updated) {
            // ★ 纯云端模式：使用统一的saveCloudData保存
            await saveCloudData(list).catch(e => console.log("静默补全保存失败:", e.message));
        }

    } catch (e) {
        // 补全失败，忽略
    }
}

// 每天9点和10点自动刷新
function scheduleRefresh() {
    let now = new Date();
    let next9 = new Date();
    next9.setHours(9, 0, 0, 0);
    let next10 = new Date();
    next10.setHours(18, 0, 0, 0);

    let targets = [next9, next10];
    for (let t of targets) {
        if (t <= now) t.setDate(t.getDate() + 1);
    }
    let next = targets[0] < targets[1] ? targets[0] : targets[1];
    let delay = next - now;

    setTimeout(() => {
        location.reload();
    }, delay);
}

// 从云端加载历史推荐（页面打开时自动调用）- 纯云端模式
async function loadFromCloud() {
  // ★ 使用统一的云端读取（带内存缓存）
  let {data} = await getCloudData();
  return data.length > 0 ? data : null;
}

async function init(){
    let useCache = false;  // ★ 是否使用了缓存数据
    let box = document.getElementById("indexOut");
    
    // ★ 1. 立即显示加载提示 + 从缓存显示滚动条（0ms，不等网络）
    const showLoading = (msg, subMsg) => {
        document.getElementById("tmOut").innerHTML = `<div style="text-align:center; padding:40px 20px;">
            <div style="font-size:28px; margin-bottom:15px;">🎯</div>
            <div style="font-size:16px; color:#333; font-weight:bold;">${msg}</div>
            <div style="font-size:13px; color:#888; margin-top:8px;">${subMsg}</div>
        </div>`;
    };
    showLoading("正在初始化...", "请稍候");
    
    // ⚡ 立即从缓存显示滚动条（毫秒级，不等任何网络请求）
    try {
        let cache = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
        if (cache && cache.length > 0) {
            updateMarquee(cache[0]);  // 立即显示滚动条
        }
    } catch(e) {}
    
    // ★ 2. 加载云端历史（由步骤7统一处理，避免提前设置缓存）
    // if (CLOUD_API_KEY) {
    //     try { await loadFromCloud(); } catch(e) { console.log("云端加载失败:", e); }
    // }

    // ★ 3. 获取开奖数据
    try{
        data = await fetchData();
        if (!data || data.length === 0) {
            let cacheStr = localStorage.getItem("cacheHistory");
            if (cacheStr) { data = JSON.parse(cacheStr); useCache = true; }
        }
    }catch(e){
        let cacheStr = localStorage.getItem("cacheHistory");
        if (cacheStr) { data = JSON.parse(cacheStr); useCache = true; }
    }
    
    // ★ 4. 数据获取失败 → 显示错误
    if(!data || !data.length){
        box.innerHTML = `⚠️ 数据加载失败<br><br>
        <div style="font-size:12px;color:#666;margin:10px 0;">
        可能的原因：<br>• 网络连接问题<br>• 服务器暂时不可用
        </div>
        <button onclick="location.reload()">🔄 重试</button>`;
        return;
    }
    
    // ★ 5. 用最新数据更新滚动条
    let latest = data[0];
    updateMarquee(latest);
    
    // ★ 6. 保存缓存
    if (!useCache) { localStorage.setItem("cacheHistory", JSON.stringify(data)); }
    
    // ★ 7. 显示推荐（页面加载时强制云端，后续操作使用缓存）
    showLoading("正在获取推荐数据...", "请稍候，正在连接云端");
    
    try {
        // ★ 页面加载时：先强制从云端读取（确保最新数据）
        let {data: list, fromCache} = await getCloudData();  // 首次云端，10s内缓存
        
        // ★ 然后显示分析结果（这次会使用刚缓存的云端数据）
        await showTmAnalysis();
        
        // ★ 根据实际数据来源显示提示
        showToast(fromCache ? `✅ 数据已加载` : `✅ 数据已更新`);
    } catch(e) {
        if (e.message !== "CLOUD_ERROR") {
            showToast(`❌ 加载失败`);
        }
    }
}

// ===== 初始化 =====
init();
scheduleRefresh();
</script>
