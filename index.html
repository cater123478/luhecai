}

// ===== 数据 =====
async function fetchRaw(){
    try {
        // 添加10秒超时控制
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        
        let res = await fetch("https://ls.kjkj.fit/kj?t=" + Date.now(), {
            cache: "no-store",
            signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        if(!res.ok){
            throw new Error(`接口状态异常: ${res.status}`);
        }
        let text = await res.text();
        try{
            return JSON.parse(text);
        }catch(e){
            console.warn("返回不是JSON：", text.substring(0, 200));
            return { data: [] };
        }
    }catch(e){
        if (e.name === 'AbortError') {
            console.error("接口请求超时（>10秒）");
        } else {
            // 接口请求失败
        }
        return { data: [] };
    }
}

async function fetchData(forceRefresh = false){
    const CACHE_KEY = "cacheHistory";
    const CACHE_TIME_KEY = "cacheHistoryTime";
    const EXPIRE = 30 * 60 * 1000;
    
    // 安全读取缓存
    let cache = [];
    try {
        let cacheStr = localStorage.getItem(CACHE_KEY);
        if (cacheStr) {
            cache = JSON.parse(cacheStr);
        }
    } catch(e) {
        console.warn("缓存数据解析失败，将重新获取");
        cache = [];
        localStorage.removeItem(CACHE_KEY);
    }
    
    let cacheTime = localStorage.getItem(CACHE_TIME_KEY);

    // 如果不是强制刷新，且缓存有效，则使用缓存
    if(!forceRefresh && cache.length > 0 && cacheTime && (Date.now() - cacheTime < EXPIRE)){
        return cache;
    }
    
    if (forceRefresh) {
        // 强制刷新，忽略缓存
    }

    try{
        let json = await fetchRaw();
        let data = (json.data || []).slice(0, kjDataSize);
        // ❗ 接口空 → 用旧缓存
        if(!data.length){
            if(cache.length > 0){
                console.warn("接口无数据，用缓存");
                return cache;
            }
            return [];
        }
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        localStorage.setItem(CACHE_TIME_KEY, Date.now());
        return data;
    }catch(e){
        console.warn("拉取数据异常", e);
        if(cache.length > 0){
            return cache;
        }
        return [];
    }
}

    return raw
        .filter(i=>i && i.num)

}

// ===== 特码分析 =====
async function showTmAnalysis(forceUpdate=false){
    if(forceUpdate && !confirm("=====  确认刷新特码？=====")){

    }
    let box = document.getElementById("tmOut");
    box.innerHTML = "⏳ 正在计算分析...";

    let raw = await fetchData();

    }

    let latest = raw[0];
    let history = getHistory(raw);
    let currentPeriod = Number(latest.qishu) + 1;

    updateResult(latest);

    // ⭐ 只算热号15码
    let hot15 = getHotNumbers(history);

    currentAnalysis = {
        nums: hot15,

    // ⭐ 保存历史

function saveHot15History(hot15, latest, history) {
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    let expect = Number(latest.qishu) + 1;

    // 删除当前期旧记录
    list = list.filter(i => i.expect != expect);

    // 插入当前期（带热号15码）
    list.unshift({
        expect: expect,
        date: latest.date,
        nums: hot15,
        zodiacNums: getHotZodiacs(history),
        top: [],
        kill: [],
        open: null,
        hit: null
    });

    // 补全最近10期（只有没记录的才补）
    let exists = new Set(list.map(i => Number(i.expect)));
    let currentQishu = Number(latest.qishu);
    for (let i = currentQishu; i > currentQishu - 10; i--) {
        if (!exists.has(i) && i !== expect) {
            list.push({
                expect: i,
                date: latest.date,
                nums: [],
                top: [],
                kill: [],
                open: null,
                hit: null
            });
        }
    }

    list.sort((a, b) => b.expect - a.expect);
    if (list.length > 30) list = list.slice(0, 30);
    localStorage.setItem("tmHistory", JSON.stringify(list));

    // 自动同步到云端（静默执行，不阻塞）
    saveToCloud(list).catch(e => console.error("云端同步失败:", e));
}

function updateResult(latest){
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    let qishu = Number(latest.qishu);
    
    // 解析特码（兼容多种格式）
    let nums;
    if (Array.isArray(latest.num)) {
        nums = latest.num;
    } else if (typeof latest.num === 'string') {
        nums = latest.num.replace(/\+/g, '').split(',').map(n => parseInt(n.trim()));
    }
    let openNum = nums ? nums[nums.length - 1] : null;
    
    let found = false;
    list.forEach(item => {
        if(Number(item.expect) === qishu){
            found = true
            if(item.open === null){
                item.open = openNum;
                item.hitNums = item.nums.includes(openNum);
                item.hitTop  = item.top.includes(openNum);
                item.hit = item.hitTop;
                // ⭐ 生肖命中
                item.hitZodiac = item.zodiacNums ? item.zodiacNums.includes(getZodiac(openNum)) : false;            }
        }
    });
    if(!found){
        list.unshift({
            expect: qishu,
            date: latest.date,
            nums: [],
            zodiacNums: [],
            top: [],
            kill: [],
            open: openNum,
            hit: false,
            hitNums: false,
            hitTop: false,
            hitZodiac: false
        });
    }
    list.sort((a,b)=>b.expect - a.expect);
    localStorage.setItem("tmHistory", JSON.stringify(list));

    // 开奖结果更新后自动同步到云端
    saveToCloud(list).catch(e => console.error("云端同步失败:", e));

    let hot15History = JSON.parse(localStorage.getItem("hot15History") || "[]");
    let idx = hot15History.findIndex(item => item.expect === qishu);
    if (idx !== -1) {
        hot15History[idx].open = openNum;
        hot15History[idx].hit = hot15History[idx].nums.includes(openNum);
        localStorage.setItem("hot15History", JSON.stringify(hot15History));
    }
}

// ===== 50期热号15码 =====
function getHotNumbers(history, count = 15) {
    // ⭐ 方案C升级版：频率 + 遗漏值 + 连续遗漏 + 温和补冷 + 分层输出
    let data = history.slice(0, 50);  // 只用最近50期
    let freq = {};           // 50期内出现次数
    let lastAppearIndex = {};// 最后一次出现的位置（索引，越小越近）
    let consecutiveMiss = {};// ★ 连续遗漏值（从最近一期开始连续没出的期数）

    for (let i = 0; i < data.length; i++) {
        let num = data[i][6];  // ★ 只看特码（第7个号码，索引6）
        freq[num] = (freq[num] || 0) + 1;
        
        // 记录最后出现的位置（i越小=越近期）
        if (lastAppearIndex[num] === undefined || i < lastAppearIndex[num]) {
            lastAppearIndex[num] = i;
        }
    }

    // ★ 计算连续遗漏值
    for (let n = 1; n <= 49; n++) {
        consecutiveMiss[n] = 0;
        // 从最新一期往前遍历，找连续没出现的期数（只看特码）
        for (let i = 0; i < data.length; i++) {
            if (data[i][6] === n) {  // ★ 只检查特码位置
                break;
            }
            consecutiveMiss[n]++;
        }
        // 如果50期都没出，连续遗漏=50（或更多）
        if (lastAppearIndex[n] === undefined) {
            consecutiveMiss[n] = 50;
        }
    }

    // 计算每个号码的综合分
    let scores = [];
    for (let n = 1; n <= 49; n++) {
        let f = freq[n] || 0;
        let rawMiss = lastAppearIndex[n] !== undefined ? lastAppearIndex[n] : 999;
        // ★ 遗漏值上限为50（避免极冷门号码分数虚高）
        let miss = Math.min(rawMiss, 50);
        let consec = Math.min(consecutiveMiss[n], 50);  // 连续遗漏也限制上限
        
        // ★ 升级版评分公式：频率 × 权重 + √遗漏 × 遗漏权重 + 连续遗漏 × 连续权重
        let score = f * 6 + Math.sqrt(miss) * 3 + consec * 0.3;
        
        scores.push({
            num: n,
            freq: f,
            rawMiss: rawMiss,
            miss: miss,
            consecutiveMiss: consec,  // ★ 新增：连续遗漏
            score: score
        });
    }

    // 按综合分降序排列
    scores.sort((a, b) => b.score - a.score);

    // ★ 温和补冷策略 + 分层选择
    let result = [];
    let used = new Set();
    
    // 1. 先取前 (count-2) 个非0次的高分号码
    let normalCount = Math.max(count - 2, Math.floor(count * 0.8));
    for (let s of scores) {
        if (result.length >= normalCount) break;
        if (s.freq > 0) {
            result.push({num: s.num, level: 'normal', ...s});
            used.add(s.num);
        }
    }
    
    // 2. 如果还不够，继续补
    for (let s of scores) {
        if (result.length >= count - 2) break;
        if (!used.has(s.num)) {
            result.push({num: s.num, level: 'supplement', ...s});
            used.add(s.num);
        }
    }
    
    // 3. 最后2个位置：给遗漏最大（最久没出）的0次号码
    let zeroFreqNums = scores.filter(s => s.freq === 0 && !used.has(s.num));
    zeroFreqNums.sort((a, b) => b.rawMiss - a.rawMiss);
    
    for (let s of zeroFreqNums) {
        if (result.length >= count) break;
        result.push({num: s.num, level: 'cold', ...s});
        used.add(s.num);
    }
    
    // 4. 如果0次的不够2个，用剩余最高分的补满
    for (let s of scores) {
        if (result.length >= count) break;
        if (!used.has(s.num)) {
            result.push({num: s.num, level: 'cold', ...s});
            used.add(s.num);
        }
    }

    // ★ 分层标记
    // 核心(🔥)：前5个（最高分，最可信）
    // 补充(⭐)：中间5个（中等分数）
    // 观察(💎)：最后5个（含冷门补位）
    let coreCount = 5;
    let supplementCount = 5;
    
    result.forEach((item, index) => {
        if (index < coreCount) {
            item.level = 'core';      // 🔥 核心必选
        } else if (index < coreCount + supplementCount) {
            item.level = 'supplement'; // ⭐ 补充选择
        } else {
            item.level = 'cold';      // 💎 观察冷门
        }
    });

    return result; // 返回包含层级信息的对象数组
}

function getHotZodiacs(history, count = 4) {
    // ⭐ 方案C升级版：频率 + 遗漏值 + 过热抑制 + 连续遗漏
    let data = history.slice(0, 50);
    let freq = {};           // 50期内出现次数
    let lastAppearIndex = {};// 最后一次出现的位置（索引，越小越近）
    
    // 12生肖列表
    const ALL_ZODIACS = ['马', '蛇', '龙', '兔', '虎', '牛', '鼠', '猪', '狗', '鸡', '猴', '羊'];
    
    // 提前读取一次原始数据
    let raw = JSON.parse(localStorage.getItem("cacheHistory") || "[]");

    for (let i = 0; i < data.length; i++) {
        let num = data[i][6];
        let zodiac = getZodiac(num);
        if (!zodiac) continue;
        
        freq[zodiac] = (freq[zodiac] || 0) + 1;
        
        // 记录最后出现的位置（i越小=越近期）
        if (lastAppearIndex[zodiac] === undefined || i < lastAppearIndex[zodiac]) {
            lastAppearIndex[zodiac] = i;
        }
    }

    // ★ 计算连续遗漏值（从最近一期开始连续没出的期数）
    let consecutiveMiss = {};
    for (let z of ALL_ZODIACS) {
        consecutiveMiss[z] = 0;
        for (let i = 0; i < data.length; i++) {
            let num = data[i][6];
            let zodiac = getZodiac(num);
            if (zodiac === z) {
                break;
            }
            consecutiveMiss[z]++;
        }
        if (lastAppearIndex[z] === undefined) {
            consecutiveMiss[z] = 50;
        }
    }

    // ★ 评分参数
    const OVERHEAT_THRESHOLD = 0.13;  // 频率超过13%才算过热
    const NORMAL_WEIGHT = 6;          // 正常频率权重
    const PENALTY_WEIGHT = 4;         // 过热惩罚权重
    const MISS_WEIGHT = 3;            // 遗漏权重
    const CONSEC_WEIGHT = 0.5;        // ★ 连续遗漏权重

    // 计算每个生肖的综合分
    let scores = [];
    for (let zodiac of ALL_ZODIACS) {
        let f = freq[zodiac] || 0;
        let rawMiss = lastAppearIndex[zodiac] !== undefined ? lastAppearIndex[zodiac] : 999;
        let missValue = Math.min(rawMiss, 50);
        let consec = Math.min(consecutiveMiss[zodiac], 50);  // ★ 连续遗漏

        // ★ 过热检测与抑制
        let freqRate = f / 50;
        let freqWeight = (freqRate > OVERHEAT_THRESHOLD) ? PENALTY_WEIGHT : NORMAL_WEIGHT;

        // ★ 升级版综合评分公式：频率 × 权重 + √遗漏 × 遗漏权重 + 连续遗漏 × 连续权重
        let score = f * freqWeight + Math.sqrt(missValue) * MISS_WEIGHT + consec * CONSEC_WEIGHT;
        
        scores.push({
            zodiac: zodiac,
            freq: f,
            freqRate: freqRate,
            miss: missValue,
            consecutiveMiss: consec,  // ★ 新增：连续遗漏
            weight: freqWeight,
            score: score
        });
    }

    // 按综合分降序排列
    scores.sort((a, b) => b.score - a.score);

    // 取前count个，并添加层级标记
    let result = scores.slice(0, count).map((s, index) => ({
        ...s,
        level: index < 2 ? 'core' : (index < count - 1 ? 'supplement' : 'cold')
    }));

    return result; // 返回包含层级信息的对象数组
}

// 静默补全缺失的开奖结果（不触发界面刷新）
async function silentUpdateMissingResults(list) {
    const needUpdate = list.filter(i => (i.open === null || i.open === undefined) && i.expect);
    if (needUpdate.length === 0) return;

    try {
        const data = await fetchData();
        let updated = false;
        
        for (let item of needUpdate) {
            const found = data.find(d => d.qishu == item.expect);
            if (found && found.num) {
                // 解析num字段（兼容多种格式）
                let nums;
                if (Array.isArray(found.num)) {
                    nums = found.num;
                } else if (typeof found.num === 'string') {
                    // 处理字符串格式，可能包含 "+" 号
                    nums = found.num.replace(/\+/g, '').split(',').map(n => parseInt(n.trim()));
                }
                
                if (nums && nums.length >= 7) {
                    // 取最后一个作为特码（第7个号码）
                    let teCode = nums[nums.length - 1];
                    
                    // 验证特码是否有效（1-49）
                    if (teCode >= 1 && teCode <= 49) {
                        item.open = teCode;
                        item.hitNums = item.nums.includes(item.open);
                        let openZodiac = getZodiac(item.open);
                        item.hitZodiac = (item.zodiacNums || []).includes(openZodiac);
                        updated = true;
                    } else {
                        // 特码无效，跳过
                    }
                } else {
                    // 号码数量不足，跳过
                }
            }
        }
        
        if (updated) {
            // 保存更新后的数据（静默保存，不刷新界面）
            localStorage.setItem("tmHistory", JSON.stringify(list));

            // 同步到云端
            saveToCloud(list).catch(e => {});
        }

    } catch (e) {
        // 补全失败，忽略
    }
}

// 每天9点和10点自动刷新
function scheduleRefresh() {
    let now = new Date();
    let next9 = new Date();
    next9.setHours(9, 0, 0, 0);
    let next10 = new Date();
    next10.setHours(18, 0, 0, 0);

    let targets = [next9, next10];
    for (let t of targets) {
        if (t <= now) t.setDate(t.getDate() + 1);
    }
    let next = targets[0] < targets[1] ? targets[0] : targets[1];
    let delay = next - now;

    setTimeout(() => {
        location.reload();
    }, delay);
}

// 从云端加载历史推荐（页面打开时自动调用）
async function loadFromCloud() {
  if (!CLOUD_API_KEY) {
    return null;
  }
  
  const binId = getCloudBinId();
  if (!binId) {
    return null;
  }
  
  try {
    const res = await fetch(`${JSONBIN_API_URL}/b/${binId}/latest`, {
      headers: { "X-Master-Key": CLOUD_API_KEY }
    });
    
    if (!res.ok) {
      return null;
    }
    
    const result = await res.json();
    const cloudData = result.record;
    
    if (cloudData && Array.isArray(cloudData)) {
      // 获取本地数据用于智能合并
      let localData = [];
      try {
        localData = JSON.parse(localStorage.getItem("tmHistory") || "[]");
      } catch(e) {}
      
      // 智能合并：对于每期数据，优先保留有open值（已开奖）的版本
      const mergedData = [];
      const processedExpects = new Set();
      
      // 先处理云端数据
      for (const cloudItem of cloudData) {
        if (!cloudItem.expect) continue;
        
        const localItem = localData.find(i => i.expect === cloudItem.expect);
        let finalItem = { ...cloudItem };
        
        if (localItem) {
          // 合并策略：优先保留有有效open值的版本
          const cloudHasOpen = cloudItem.open !== null && cloudItem.open !== undefined && cloudItem.open !== 0;
          const localHasOpen = localItem.open !== null && localItem.open !== undefined && localItem.open !== 0;
          
          if (localHasOpen && !cloudHasOpen) {
            // 本地有open值，云端没有 → 用本地的open
            finalItem.open = localItem.open;
            finalItem.hitNums = localItem.hitNums;
            finalItem.hitZodiac = localItem.hitZodiac;
          } else if (localHasOpen && cloudHasOpen && localItem.open !== cloudItem.open) {
            // 两边都有open但值不同 → 保留本地的（假设本地是最新修复过的）
            finalItem.open = localItem.open;
            finalItem.hitNums = localItem.hitNums;
            finalItem.hitZodiac = localItem.hitZodiac;
          }
          
          // 合并nums/zodiacNums（取更完整的）
          if ((!finalItem.nums || finalItem.nums.length === 0) && (localItem.nums && localItem.nums.length > 0)) {
            finalItem.nums = localItem.nums;
          }
          if ((!finalItem.zodiacNums || finalItem.zodiacNums.length === 0) && (localItem.zodiacNums && localItem.zodiacNums.length > 0)) {
            finalItem.zodiacNums = localItem.zodiacNums;
          }
        }
        
        mergedData.push(finalItem);
        processedExpects.add(cloudItem.expect);
      }
      
      // 添加本地有但云端没有的记录
      for (const localItem of localData) {
        if (localItem.expect && !processedExpects.has(localItem.expect)) {
          mergedData.push(localItem);
        }
      }

      // 按期号排序（新的在前）
      mergedData.sort((a, b) => (b.expect || 0) - (a.expect || 0));

      // 保存合并后的数据
      localStorage.setItem("tmHistory", JSON.stringify(mergedData));
      return mergedData;
    }

    return null;
  } catch (e) {
    return null;
  }
}

    localStorage.removeItem("cacheHistoryTime");

    try {
        // 强制刷新获取最新数据
        const data = await fetchData(true);  // true = 强制刷新
        
        if (data && data.length > 0) {
            box.innerHTML = "";
            updateMarquee(data[0]);  // 传入已获取的数据
            await showTmAnalysis();
            alert(`✅ 刷新成功！\n\n当前期号：${data[0].qishu}期\n数据时间：${new Date().toLocaleTimeString()}`);
        } else {
            box.innerHTML = "⚠️ 获取数据失败，请检查网络";
        }
    } catch(e) {
        box.innerHTML = "❌ 刷新失败：" + e.message;
    }
}

// 修复所有历史数据的特码和命中结果
async function fixAllHistoryData() {
    let box = document.getElementById("indexOut");
    
    if (!confirm("🔧 确定要修复所有历史数据吗？\n\n这将：\n1. 强制获取最新开奖数据\n2. 重新计算每期的特码（取最后一个号码）\n3. 更新所有命中结果\n4. 保存到本地并同步云端")) {
        return;
    }
    
    box.innerHTML = "🔧 正在修复历史数据，请稍等...";
    
    try {
        // 1. 获取历史记录
        let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");

        if (list.length === 0) {
            alert("没有历史数据需要修复");
            return;
        }

        // 2. 获取最新开奖数据（强制刷新，不用缓存）
        box.innerHTML = "🔧 步骤1/4: 正在强制获取最新开奖数据...";

        const data = await fetchData(true);  // true = 强制刷新

        if (!data || data.length === 0) {
            alert("❌ 无法获取开奖数据，请检查网络连接\n\n可能需要点击多次重试");
            return;
        }

        // 3. 逐期修复
        box.innerHTML = "🔧 步骤2/4: 正在重新计算特码和命中结果...";
        let fixedCount = 0;
        let errorCount = 0;
        let skipCount = 0;
        
        for (let item of list) {
            const found = data.find(d => d.qishu == item.expect);
            
            if (found && found.num) {
                // 解析号码（兼容数组和字符串）
                let nums;
                if (Array.isArray(found.num)) {
                    nums = found.num.map(n => parseInt(n));
                } else if (typeof found.num === 'string') {
                    // 去除所有非数字字符，然后分割
                    nums = found.num.replace(/[^0-9,]/g, '').split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));
                }

                if (nums && nums.length >= 7) {
                    // 取最后一个作为特码
                    let newOpenNum = nums[nums.length - 1];
                    
                    // 验证特码有效性（1-49）
                    if (newOpenNum >= 1 && newOpenNum <= 49) {
                        let oldOpen = item.open;
                        
                        // 强制更新（不管是否相同）
                        item.open = newOpenNum;
                        
                        // 重新计算命中结果
                        item.hitNums = (item.nums || []).includes(item.open);
                        let openZodiac = getZodiac(item.open);
                        item.hitZodiac = (item.zodiacNums || []).includes(openZodiac);
                        
                        if (oldOpen !== newOpenNum) {
                            fixedCount++;
                        } else {
                            skipCount++;
                        }
                    } else {
                        // 特码无效
                        errorCount++;
                    }
                } else {
                    // 号码数量不足
                    errorCount++;
                }
            } else {
                // API中未找到该期数据
            }
        }

        // 4. 保存修复后的数据
        box.innerHTML = "🔧 步骤3/4: 正在保存到本地存储...";
        localStorage.setItem("tmHistory", JSON.stringify(list));

        // 5. 同步到云端
        box.innerHTML = "🔧 步骤4/4: 正在同步到云端...";
        let cloudResult = await saveToCloud(list);
        
        // 6. 强制刷新显示
        box.innerHTML = "";
        updateMarquee(data[0]);  // 传入已获取的数据
        await showTmAnalysis();  // 这会重新渲染主界面
        
        // 手动触发一次历史结果显示（确保使用最新数据）
        await showTmHistory();   // 强制刷新历史记录
        
        // 7. 显示结果
        alert(`✅ 修复完成！\n\n📊 数据统计：\n• 修复了 ${fixedCount} 条记录\n• 无需修复 ${skipCount} 条\n• 出错 ${errorCount} 条\n\n💾 数据已保存到本地${cloudResult ? '并同步到云端' : '（云端同步失败）'}\n\n请查看"历史投注结果"确认`);

    } catch(e) {
        box.innerHTML = "❌ 修复失败：" + e.message;
        alert("❌ 修复失败：" + e.message + "\n\n请查看控制台(F12)了解详情");
    }
}

async function init(){
    let box = document.getElementById("indexOut");
    const startTime = Date.now();
    
    // ⚡ 立即从缓存显示滚动提示（毫秒级，不等任何网络请求）
    try {
        let cache = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
        if (cache && cache.length > 0) {
            let latest = cache[0];
            let numsHtml = formatNums(latest.num);
            let base = "📊 自动同步最新开奖，每日仅生成一次分析结果";
            let text = `${base}　　📢 最新开奖：${latest.qishu}期（${latest.date}）${numsHtml}`;
            document.getElementById("marqueeText").innerHTML = text + "　　" + text;
        } else {
            document.getElementById("marqueeText").innerHTML = "📊 自动同步最新开奖，每日仅生成一次分析结果　　📊 自动同步最新开奖，每日仅生成一次分析结果";
        }
    } catch(e) {
        document.getElementById("marqueeText").innerHTML = "📊 自动同步最新开奖，每日仅生成一次分析结果　　📊 自动同步最新开奖，每日仅生成一次分析结果";
    }
    
    box.innerHTML = "⏳ 正在连接服务器...";
    let slowTimer = setTimeout(()=>{
        const elapsed = Math.round((Date.now() - startTime) / 1000);
        box.innerHTML = `🐢 网络较慢（已等待${elapsed}秒），请稍等...<br><small>可能原因：防火墙/代理/网络问题</small>`;
    }, 5000);

    // 自动从云端加载历史推荐（如果配置了API Key）
    if (CLOUD_API_KEY) {
      await loadFromCloud();
    }

    box.innerHTML = "⏳ 正在获取开奖数据...";
    let data = [];
    let useCache = false;
    
    try{
        data = await fetchData();
        
        // 如果API返回空数据，尝试使用缓存
        if (!data || data.length === 0) {
            let cacheStr = localStorage.getItem("cacheHistory");
            if (cacheStr) {
                try {
                    data = JSON.parse(cacheStr);
                    useCache = true;
                } catch(e) {
                    // 缓存解析失败
                }
            }
        }
    }catch(e){
        // API失败时，尝试使用缓存
        let cacheStr = localStorage.getItem("cacheHistory");
        if (cacheStr) {
            try {
                data = JSON.parse(cacheStr);
                useCache = true;
            } catch(e2) {
                // 缓存也解析失败
            }
        }
    }
    clearTimeout(slowTimer);
    
    if(!data || !data.length){
        box.innerHTML = `
        ⚠️ 数据加载失败<br><br>
        <div style="font-size:12px;color:#666;margin:10px 0;">
        可能的原因：<br>
        • 网络连接问题<br>
        • 防火墙/杀毒软件拦截<br>
        • 服务器暂时不可用
        </div>
        <button onclick="location.reload()" style="margin-right:10px;">🔄 重试</button>
        <button onclick="fixAllHistoryData()">🔧 修复历史数据</button>
        `;
        return;
    }
    
    box.innerHTML = "";
    if (useCache) {
        box.innerHTML += `<div style="color:#ff9800;font-size:12px;margin-bottom:10px;">⚠️ 当前使用的是缓存数据（网络可能有问题）</div>`;
    }
    updateMarquee(data[0]);  // 传入已获取的数据，不再重复请求
    await showTmAnalysis();
}

// ===== 初始化 =====
init();
scheduleRefresh();
</script>
