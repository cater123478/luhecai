<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玩彩选号系统</title>

<style>
body{font-family:Arial;max-width:650px;margin:auto;padding:15px;background:#f5f6fa;}
h2{text-align:center;}

.card{
  background:#fff;
  border-radius:12px;
  padding:12px;
  margin-top:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.fixed{border-left:5px solid #4a90e2;}
.best{border-left:5px solid #28a745;}
.balance{border-left:5px solid #ff9800;}
.tm{border-left:5px solid #e91e63;}

.btn{
  display:block;width:100%;padding:14px;margin-top:10px;
  border:none;border-radius:12px;font-size:16px;color:#fff;
}

.btn-rec{background:linear-gradient(45deg,#4caf50,#2ecc71);}
.btn-fixed{background:linear-gradient(45deg,#2196f3,#42a5f5);}
.btn-data{background:linear-gradient(45deg,#ff9800,#ffb74d);}
.btn-tm{background:linear-gradient(45deg,#e91e63,#f06292);}

#toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.8);
  color:#fff;
  padding:10px 16px;
  border-radius:20px;
  font-size:14px;
  opacity:0;
  transition:all 0.3s;
  z-index:999;
}
#toast.show{
  opacity:1;
  bottom:100px;
}
.tip{
  background:linear-gradient(45deg,#e3f2fd,#f1f8ff);
  color:#333;
  padding:10px 14px;
  border-radius:10px;
  font-size:14px;
  margin:10px 0;
  border-left:4px solid #2196f3;
}
.tip2{
  text-align:center;
  font-size:13px;
  color:#666;
  margin-top:6px;
}
.marquee{
  width:100%;
  overflow:hidden;
  background:#2196f3;
  color:#fff;
  font-size:12px;
  padding:6px 0;
}

.marquee-text{
  display:inline-block;
  white-space:nowrap;
  padding-left:100%;
  animation:scroll 28s linear infinite;
}

@keyframes scroll{
  0%{ transform:translateX(0); }
  100%{ transform:translateX(-100%); }
}

/* 新开奖高亮 */
.highlight{
  color:#ffeb3b;
  font-weight:bold;
}

.mq-num{
  display:inline-block;
  margin:0 2px;
  padding:2px 6px;
  border-radius:6px;
  font-size:16px;
  color:#fff;
}

.mq-normal{
  background:#607d8b;
}

.mq-tm{
  background:#ff5722;
  font-weight:bold;
  transform:scale(1.15);
  box-shadow:0 0 6px rgba(255,87,34,0.7);
}
</style>
</head>

<body>
<div class="marquee">
  <div id="marqueeText" class="marquee-text"></div>
</div>
<!-- ==============================偏向筛选型================================= -->
<h2>🔥 玩彩选号系统</h2>
<div class="tip2">
  ⚡ 建议每天只参考一次，避免频繁刷新影响判断
</div>
<!--<button class="btn btn-rec" onclick="generateRecommendations()">🎯 刷新推荐</button>
<button class="btn btn-fixed" onclick="changeFixed()">🔄 换固定组</button>-->
<button class="btn btn-tm" onclick="showTmAnalysis()">📊 特码分析</button>
<button class="btn btn-rec" onclick="generateBets()">💰 生成投注方案</button>
<button class="btn btn-data" onclick="loadHistory()">📥 获取开奖数据</button>
<button class="btn btn-fixed" onclick="showTmAnalysis(true)">📊 强制刷新特码（慎用）</button>

<div id="fixedOut"></div>
<div id="out"></div>
<div id="tmOut"></div>
<div id="betOut"></div>
<div id="history"></div>
<div id="toast"></div>
<script>

const lockDays = 7;
const today = new Date().toISOString().split("T")[0];
let fixedData = JSON.parse(localStorage.getItem("fixedData") || "{}");
let loading = false;
const kjDataSize = 100;
const hisKjDataSize = 50;

function seededRandom(seed){
    let x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
}

// ===== 数据 =====
async function fetchRaw(){
    let res = await fetch("https://ls.kjkj.fit/kj?t=" + Date.now(), {
        cache: "no-store"
    });
    return await res.json();
}

async function fetchData(){

    let cache = localStorage.getItem("cacheHistory");
    let lastId = localStorage.getItem("cacheLastId");
    let lastCheck = localStorage.getItem("lastCheckTime");
    let today = new Date().toISOString().split("T")[0];
    let lastCheckDate = localStorage.getItem("lastCheckDate");
    // ⭐ 每天第一次 → 强制检查
    let forceCheckToday = false;
    if(lastCheckDate !== today){
        forceCheckToday = true;
        localStorage.setItem("lastCheckDate", today);
    }
    if(cache){
        // ⭐ 2. 30秒内不检查（但“当天首次”例外）
        if(!forceCheckToday && lastCheck && Date.now() - lastCheck < 30000){
            return JSON.parse(cache);
        }
        // ⭐ 3. 超过30秒 或 当天首次 → 检查
        localStorage.setItem("lastCheckTime", Date.now());
        try{
            let json = await fetchRaw();
            let latestId = json.data[0].id;
            // 👉 没变 → 用缓存
            if(lastId == latestId){
                return JSON.parse(cache);
            }
            // 👉 有新开奖 → 更新
            let data = json.data.slice(0, kjDataSize);
            localStorage.setItem("cacheHistory", JSON.stringify(data));
            localStorage.setItem("cacheLastId", latestId);
            return data;
        }catch(e){
            return JSON.parse(cache);
        }
    }
    // ❗ 没缓存才请求
    let json = await fetchRaw();
    let data = json.data.slice(0, kjDataSize);

    localStorage.setItem("cacheHistory", JSON.stringify(data));
    localStorage.setItem("cacheLastId", json.data[0].id);
    localStorage.setItem("lastCheckTime", Date.now());
    localStorage.setItem("lastCheckDate", today);

    return data;
}

async function fetchData2(){
    let cache=localStorage.getItem("cacheHistory");
    let lastId=localStorage.getItem("cacheLastId");

    if(cache){
        backgroundUpdate(lastId);
        return JSON.parse(cache);
    }

    let json=await fetchRaw();
    let data=json.data.slice(0,kjDataSize);

    localStorage.setItem("cacheHistory",JSON.stringify(data));
    localStorage.setItem("cacheLastId",json.data[0].id);

    return data;
}

async function backgroundUpdate(oldId){
    try{
        let json=await fetchRaw();
        let latestId=json.data[0].id;

        if(oldId!=latestId){
            let data=json.data.slice(0,kjDataSize);
            localStorage.setItem("cacheHistory",JSON.stringify(data));
            localStorage.setItem("cacheLastId",latestId);
        }
    }catch(e){}
}

// ===== 工具 =====
function getHistory(raw){
    return raw
        .filter(i=>i && i.num)
        .map(i=>i.num.split(',').map(Number));
}

function showToast(msg){
    let t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("show");

    setTimeout(()=>{
        t.classList.remove("show");
    },2000);
}

// ===== 杀号 =====
function killNumbers(history){
    let freq=Array(50).fill(0);
    let last=Array(50).fill(999);

    history.forEach((p,idx)=>{
        let tm=p[6];
        freq[tm]++;
        last[tm]=Math.min(last[tm],idx);
    });

    let killSet=new Set();

    for(let i=1;i<=49;i++){
        if(last[i]>80) killSet.add(i);
        if(freq[i]<=1) killSet.add(i);
        if(last[i]>20 && freq[i]<3) killSet.add(i);
    }

    return killSet;
}

// ===== 特码权重 =====
function calcTmWeights(history, seed){

    let freq=Array(50).fill(0);
    let recent=Array(50).fill(0);
    let last=Array(50).fill(999);

    history.forEach((p,idx)=>{
        let tm=p[6];
        freq[tm]++;
        last[tm]=Math.min(last[tm],idx);
    });

    history.slice(0,15).forEach((p,idx)=>{
        let tm=p[6];
        recent[tm]+=(15-idx);
    });

    let maxF=Math.max(...freq);
    let maxR=Math.max(...recent);

    let killSet=killNumbers(history);
    let weights=[];

    for(let i=1;i<=49;i++){

        if(killSet.has(i)){
            weights[i]=0.01;
            continue;
        }

        let hot=freq[i]/(maxF||1);
        let boom=recent[i]/(maxR||1);
        let gap=last[i]/history.length;

        weights[i] =
            0.5
            + hot*0.6
            + boom*1.0
            + gap*0.4
            + seededRandom(seed + i)*0.2;
    }

    return weights;
}

// ===== 特码生成 =====
function genTmUltimate(w, seed){
    let arr=[];

    for(let i=1;i<=49;i++){
        arr.push({n:i,w:w[i]});
    }

    arr.sort((a,b)=>b.w-a.w);

    let top=arr.slice(0,12).map(i=>i.n);

    let res=[];
    let idx=0;

    while(res.length < 6){
        let x = top[Math.floor(seededRandom(seed + idx)*top.length)];
        idx++;

        if(!res.includes(x)) res.push(x);
    }

    return {
        nums:res.sort((a,b)=>a-b),
        top,
        kill:arr.slice(12).map(i=>i.n)
    };
}

// ===== 正码 =====
function calcWeights(history, seed){
    let freq=Array(50).fill(0);

    history.forEach(p=>p.forEach(n=>freq[n]++));

    let maxF=Math.max(...freq);
    let weights=[];

    for(let i=0;i<50;i++){
        weights[i] = 0.5 + (freq[i]/maxF) + seededRandom(seed + i)*0.2;
    }

    return weights;
}

function genOne(w,c,seed){
    let n=[];
    let idx=0;

    while(n.length < c){
        let x = Math.floor(seededRandom(seed + idx)*49)+1;
        idx++;

        if(!n.includes(x)) n.push(x);
    }

    return n.sort((a,b)=>a-b);
}

// ===== 推荐 =====
async function generateRecommendations(){

    let raw=await fetchData();
    let history=getHistory(raw);
    let latestId = raw[0].id;

    let seed_rec = latestId * 10 + 2;

    let w = calcWeights(history, seed_rec);
    let wtm = calcTmWeights(history, seed_rec);

    let pool=[];

    for(let i=0;i<200;i++){

        let seedLoop = seed_rec + i * 100;

        let tm = genTmUltimate(wtm, seedLoop);
        let z  = genOne(w, 4, seedLoop + 50);

        pool.push({
            t:tm.nums,
            z,
            sc: seededRandom(seedLoop + 99)*100
        });
    }

    pool.sort((a,b)=>b.sc-a.sc);

    let best=pool[0];
    let second=pool[1];

    document.getElementById("out").innerHTML=`
    <div class="card best">
    🟢 最优推荐<br>
    特码：${best.t.join(",")}<br>
    正码：${best.z.join(",")}
    </div>

    <div class="card balance">
    🟡 次优推荐<br>
    特码：${second.t.join(",")}<br>
    正码：${second.z.join(",")}
    </div>`;
}

// ===== 固定组 =====
async function initFixed(force=false){
    let raw=await fetchData();
    let history=getHistory(raw);
    let latestId = raw[0].id;
    let seed_fix = latestId * 10 + 3;
    if(!force && fixedData.t){
        renderFixed();
        return;
    }

    // let wtm=calcTmWeights(history);
    // let tm=genTmUltimate(wtm);

    let wtm = calcTmWeights(history, seed_fix);
    let tm;
    if(fixedData.t){
        // ① 保留4个最强号码
        let keep = selectKeep(fixedData.t, history);
        // ② 只补2个新号码
        while(keep.length < 6){
            let pool = genTmUltimate(wtm, seed_fix).nums;
            let x = pool[Math.floor(seededRandom(seed_fix++)*pool.length)];

            if(!keep.includes(x)){
                keep.push(x);
            }
        }
        tm = {nums: keep.sort((a,b)=>a-b)};
    }else{
        // 第一次生成
        tm = genTmUltimate(wtm, seed_fix);
    }
    let z = genOne(calcWeights(history,seed_fix),4,seed_fix);

    // fixedData={t:tm.nums,z};

    let expire = new Date();
    expire.setDate(expire.getDate() + lockDays);

    fixedData = {
        t:tm.nums,
        z,
        start: today,
        expire: expire.toISOString().split("T")[0]
    };

    localStorage.setItem("fixedData",JSON.stringify(fixedData));

    renderFixed();
}

function selectKeep(oldNums, history){
    let freq = {};
    oldNums.forEach(n=>{
        freq[n] = 0;
        history.forEach(p=>{
            if(p.includes(n)){
                freq[n]++;
            }
        });
    });
    // 按出现次数排序（出现多 = 强号）
    return oldNums.sort((a,b)=>freq[b]-freq[a]).slice(0,4); // ⭐保留4个
}

function renderFixed(){
    if(!fixedData.t) return;

    document.getElementById("fixedOut").innerHTML=`
    <div class="card fixed">
    🔵 固定追号组<br>
    特码：${fixedData.t.join(",")}<br>
    正码：${fixedData.z.join(",")}
    </div>`;
}

async function changeFixed(){
    if(confirm("确认更换固定组？将重新锁定7天")){
        await initFixed(true);
    }
}

// ===== 特码分析 =====
async function showTmAnalysis(forceUpdate=false){
    if(forceUpdate && !confirm("=====  确认刷新特码？=====")){
        return;
    }
    const today = new Date().toISOString().split("T")[0];
    let cache = localStorage.getItem("tmAnalysis");
    let cacheDate = localStorage.getItem("tmDate");
    let lastId = localStorage.getItem("tmLastId");
    // 👉 先拿最新开奖ID（关键）
    let raw = await fetchData();
    let latestId = raw[0].id;
    let seed_tm = latestId * 10 + 1;
    // ⭐ 如果开奖更新 → 强制刷新
    if(lastId != latestId){
        forceUpdate = true;
        localStorage.setItem("tmLastId", latestId);
        showToast("🆕 检测到新开奖，已自动更新");
    }

    // ✅ 缓存命中才用
    if(cache && cacheDate === today && !forceUpdate){
        renderTm(JSON.parse(cache));
        showToast("📌 今日分析已锁定");
        return;
    }
    let history = getHistory(raw);
    let wtm = calcTmWeights(history, seed_tm);
    let result = genTmUltimate(wtm, seed_tm);
    localStorage.setItem("tmAnalysis", JSON.stringify(result));
    localStorage.setItem("tmDate", today);
    renderTm(result);
    if(forceUpdate){
        if(lastId != latestId){
            // 自动刷新（已提示过，不用再提示）
        }else{
            showToast("♻️ 已手动刷新分析");
        }
    }
}

function renderTm(result){
    document.getElementById("tmOut").innerHTML=`
    <div class="card tm">
    🔥 特码分析（今日锁定）<br><br>
    ⭐ Top12：${result.top.join(",")}<br><br>
    ❌ 杀号：<span style="word-break:break-all;">
${result.kill.slice(0,20).join(",")}
</span><br><br>
    🎯 推荐：${result.nums.join(",")}
    </div>`;
}

async function generateBets(){

    let raw=await fetchData();
    let history=getHistory(raw);
    let latestId = raw[0].id;
    let seed_bet = latestId * 10 + 4;
    let wtm = calcTmWeights(history, seed_bet);
    let result = genTmUltimate(wtm, seed_bet);
    let bets = shrinkBets(result.top, seed_bet);

    let html=`<div class="card tm">
    💰 投注方案（根据个人情况选择其中一个或多个方案）<br><br>`;

    bets.forEach((b,i)=>{
        html+=`方案${i+1}：${b.join(",")}<br>`;
    });
    html+=`</div>`;
    document.getElementById("betOut").innerHTML = html;
}

function shrinkBets(top, seed){
    let result=[];

    for(let i=0;i<10;i++){

        let arr=[...top];

        // Fisher-Yates 洗牌（稳定版）
        for(let j=arr.length-1;j>0;j--){
            let k = Math.floor(seededRandom(seed + i*50 + j)*(j+1));
            [arr[j], arr[k]] = [arr[k], arr[j]];
        }

        let pick = arr.slice(0,6).sort((a,b)=>a-b);
        result.push(pick);
    }

    return result;
}

// ===== 开奖 =====
async function loadHistory(){
    if(loading) return;
    loading = true;

    let box = document.getElementById("history");
    box.innerHTML = "⏳ 正在加载开奖数据...";
    await new Promise(r => setTimeout(r, 300));
    let list = await fetchData();

    let html=`<div class="card tm"><b>📊 最近开奖 ${hisKjDataSize}期</b><br>`;

    list.slice(0,hisKjDataSize).forEach(i=>{
        html += `${i.qishu}期 (${i.date})<br>${i.num}<br><br>`;
    });

    html+=`</div>`;

    box.innerHTML = html;

    loading = false;
}

// ⭐ 格式化号码（最后一个=特码）
function formatNums(nums){
    let arr = nums.split(",");
    return arr.map((n,idx)=>{
        // ⭐ 最后一个号码特殊处理
        if(idx === arr.length - 1){
            return `<span class="mq-num mq-tm">${n}</span>`;
        }
        return `<span class="mq-num mq-normal">${n}</span>`;
    }).join("");
}

async function updateMarquee(){
    let base = "📊 自动同步最新开奖，每日仅生成一次分析结果";
    try{
        let raw = await fetchData(); // 用你的缓存函数
        let latest = raw[0];
        let lastId = localStorage.getItem("marqueeLastId");
        let numsHtml = formatNums(latest.num);
        let text = "";
        // ⭐ 判断是否新开奖
        if(lastId != latest.id){
            text = `${base}　　<span class="highlight">🆕 新开奖：${latest.qishu}期（${latest.date}）${numsHtml}</span>`;
            localStorage.setItem("marqueeLastId", latest.id);
        }else{
            text = `${base}　　📢 最新：${latest.qishu}期（${latest.date}）${numsHtml}`;
        }
        // ⭐ 双倍拼接（无缝滚动）
        document.getElementById("marqueeText").innerHTML = text + "　　" + text;
    }catch(e){
        console.log("滚动条失败", e);
        document.getElementById("marqueeText").innerText = base;
    }
}

async function init(){
    await fetchData();
    updateMarquee();
    showTmAnalysis();
}
// ===== 初始化 =====
// initFixed();
// generateRecommendations();
init();
</script>

</body>
</html>
