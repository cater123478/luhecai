name: Predict

on:
  schedule:
    - cron: "30 8,12 * * *"   # 每天 UTC 14:30（北京时间 22:30），按需改
  workflow_dispatch:         # 支持手动触发

permissions:
  contents: write            # 允许提交 result.json

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: pip install -r ./zodiac_prediction/requirements.txt

      - name: Run predict
        run: python ./zodiac_prediction/predict.py

      - name: Commit result.json
        run: |
          git config user.name "cater12478"
          git config user.email "928865989@qq.com"
          git add ./zodiac_prediction/result.json
          git add ./zodiac_prediction/result.json ./zodiac_prediction/recommend_history.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update"
            git push
          fi
      - name: Show result
        run: cat ./zodiac_prediction/result.json
