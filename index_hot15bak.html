function seededRandom(seed){
    let x = Math.sin(seed) * 10000;
    return x - Math.floor(x);

// ===== 数据 =====
async function fetchRaw(){
    try{
        let res = await fetch("https://ls.kjkj.fit/kj?t=" + Date.now(), {
            cache: "no-store"
        });

        if(!res.ok){
            throw new Error("接口状态异常");
        }

        let text = await res.text();

        try{
            return JSON.parse(text);
        }catch(e){
            console.warn("返回不是JSON：", text);
            return { data: [] };
        }

    }catch(e){
        console.log("接口失败", e);
        return { data: [] };
    }
}

async function fetchData(){
    const CACHE_KEY = "cacheHistory";
    const CACHE_TIME_KEY = "cacheHistoryTime";
    const EXPIRE = 30 * 60 * 1000;
    let cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "[]");
    let cacheTime = localStorage.getItem(CACHE_TIME_KEY);

    if(cache.length > 0 && cacheTime && (Date.now() - cacheTime < EXPIRE)){
        return cache;
    }

    try{
        let json = await fetchRaw();
        let data = (json.data || []).slice(0, kjDataSize);

        // ❗ 接口空 → 用旧缓存
        if(!data.length){
            if(cache){
                console.warn("接口无数据，用缓存");
                return JSON.parse(cache);
            }
            return [];
        }

        // ✅ 写缓存
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        localStorage.setItem(CACHE_TIME_KEY, Date.now());

        return data;

    }catch(e){
        console.log("拉取数据异常", e);
        // ❗ 兜底
        if(cache){
            return JSON.parse(cache);
        }

        return [];
    }
}

// ===== 特码权重 =====
function calcTmWeights(history, seed){

    let freq = Array(50).fill(0);
    let last = Array(50).fill(999);

    history.forEach((p, idx)=>{
        let tm = p[6];
        freq[tm]++;
        // ⭐ 最近出现位置
        if(last[tm] === 999){
            last[tm] = idx;
        }
    });

    let maxF = Math.max(...freq);
    let weights = [];
    for(let i=1;i<=49;i++){
        // ⭐ 热度
        let hot = freq[i] / (maxF || 1);
        // ⭐ 重复加分
        let repeatBonus = 0;
        if (freq[i] >= 3) {
            repeatBonus = 0.3;
        } else if (freq[i] >= 2) {
            repeatBonus = 0.2;
        } else if (freq[i] >= 1) {
            repeatBonus = 0.1;
        }
        // ⭐ 遗漏值（越久没出越高），last[i] 越小 → 最近开过 → gap 小；last[i] 越大 → 很久没开 → gap 大
        let gap = Math.min(last[i], 40) / 40;
        // ⭐ 极冷号额外加分,===== 冷号加分（遗漏越久，加分越多） =====
        let cold = 0;
        // last[i] 表示号码 i 距离最近一次开奖的间隔期数（遗漏值）
        // 例如：last[1] = 0 表示 01 上期刚开，last[1] = 5 表示 01 已经5期没开了
        if(last[i] > 30){
            cold = 0.45;
        }else if(last[i] > 20){
            cold = 0.25;
        }else if(last[i] > 10){
            cold = 0.12;
        }

        // ⭐ 最近刚开 → 压制, ===== 近期惩罚（刚开过 → 权重打折） =====,默认不打折
        let recentPenalty = 1;
        if(last[i] <= 1){
          // 上期刚开 → 权重 × 0.45（严重压制）
            recentPenalty = 0.45;
        }else if(last[i] <= 3){
          // 最近2-3期开过 → 权重 × 0.7（中等压制）
            recentPenalty = 0.7;
        }

        // ⭐ 新权重公式
        // let w = 0.15 + hot * 0.35 + gap * 0.6 + cold + seededRandom(seed + i) * 0.18;
        // let w = 0.2 + hot * 0.45 + gap * 0.4 + cold + seededRandom(seed + i) * 0.12;
        let w = 0.2 + hot * 0.45 + gap * 0.4 + cold + repeatBonus + seededRandom(seed + i) * 0.12;
        // w *= recentPenalty;
        weights[i] = w;
    }

    return weights;
}


// ===== 特码生成 =====
function genTmUltimate(weights, seed){
    let arr = [];
    for(let i=1;i<=49;i++){
        arr.push({n: i, w: weights[i]});
    }
    arr.sort((a,b)=>b.w-a.w);
    let top = arr.slice(0,40).map(i=>i.n);
    let bets = shrinkBets(top, seed);

    // 统计号码出现频率
    let freq = {};
    bets.forEach(b=>{
        b.forEach(n=>{
            freq[n] = (freq[n] || 0) + 1;
        });
    });

    // 取出现频率最高的8个号码
    let nums = Object.keys(freq).sort((a,b)=>{
        let diff = freq[b] - freq[a];
        if(diff !== 0) return diff;
        return weights[b] - weights[a];
    }).slice(0,8).map(Number).sort((a,b)=>a-b);

    return { nums, top, kill: arr.slice(40).map(i=>i.n) };
}


// ===== 特码分析 =====
async function showTmAnalysis(forceUpdate=false){
    if(forceUpdate && !confirm("=====  确认刷新特码？=====")){
        return;
    }
    let box = document.getElementById("tmOut");
    box.innerHTML = "⏳ 正在计算分析...";
    await new Promise(r => setTimeout(r, 300));
    let raw = await fetchData();
    if(!raw || !raw.length){
        box.innerHTML = "⚠️ 拉取数据失败";
        return;
    }
    let latest = raw[0];
    let history = getHistory(raw);
    let latestId = latest.id;
    let currentPeriod = Number(latest.qishu) + 1;
    let seed_tm = latestId * 10 + 1;
    if(forceUpdate){
        seed_tm += Date.now();
    }
    updateResult(latest);
    // raw.slice(0, 10).forEach(item => updateResult(item));
      // ⭐ 每次都重新算（关键）
    let wtm = calcTmWeights(history, seed_tm);
    fixMissingHistory(latest);
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    let cachedItem = list.find(i => i.expect === currentPeriod);
    if(1===1 && cachedItem && !forceUpdate){
        showToast("✅ 已生成本期分析结果");
        currentAnalysis = {
            nums: cachedItem.nums,
            top: cachedItem.top,
            kill: cachedItem.kill,
            seed: seed_tm,
            weights: wtm
        };
        renderTm(list.find(i => i.expect === currentPeriod), currentPeriod);
        return;
    }
    let result = genTmUltimate(wtm, seed_tm);
    currentAnalysis = {
        nums: result.nums,
        top: result.top,
        kill: result.kill,
        seed: seed_tm,
        weights: wtm
    }
    savePrediction(result, latest);
    renderTm(result, currentPeriod);
    if(forceUpdate){
        showToast("♻️ 已手动刷新分析结果");
    }
}

function fixMissingHistory(latest){
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    let currentQishu = Number(latest.qishu)
    let exists = new Set(list.map(i => Number(i.expect)));
    // ⭐ 补最近10期（你可以改范围）
    for(let i = currentQishu; i > currentQishu - 10; i--){
        if(!exists.has(i)){
            list.unshift({
                expect: i,
                date: latest.date,
                nums: [],   // 没预测
                top: [],
                kill: [],
                open: null,
                hit: null,
                hitNums: false,
                hitTop: false
            });
        }
    }
    list.sort((a,b)=>b.expect - a.expect);
    localStorage.setItem("tmHistory", JSON.stringify(list));
}

function savePrediction(result, latest){

    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");

    let expect = Number(latest.qishu) + 1;
    list = list.filter(i => i.expect != expect);
    let history = getHistory(JSON.parse(localStorage.getItem("cacheHistory") || "[]"));
    let hot15 = getHot15(history);

    list.unshift({
        expect,
        date: latest.date,
        // nums: result.nums,
        nums: hot15,
        top: result.top,
        kill: result.kill,

        open: null,
        hit: null
    });

    // 限制数量
    if(list.length > 30){
        list = list.slice(0,30);
    }

    localStorage.setItem("tmHistory", JSON.stringify(list));
}

function updateResult(latest){
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    let qishu = Number(latest.qishu);
    let openNum = Number(latest.num.split(",")[6]);
    let found = false;
    list.forEach(item => {
        if(Number(item.expect) === qishu){
            found = true
            if(item.open === null){
                item.open = openNum;
                item.hitNums = item.nums.includes(openNum);
                item.hitTop  = item.top.includes(openNum);
                item.hit = item.hitTop;
            }
        }
    });
    if(!found){
        list.unshift({
            expect: qishu,
            date: latest.date,
            nums: [],
            top: [],
            kill: [],
            open: openNum,
            hit: false,
            hitNums: false,
            hitTop: false
        });
    }
    list.sort((a,b)=>b.expect - a.expect);
    localStorage.setItem("tmHistory", JSON.stringify(list));

    let hot15History = JSON.parse(localStorage.getItem("hot15History") || "[]");
    let idx = hot15History.findIndex(item => item.expect === qishu);
    if (idx !== -1) {
        hot15History[idx].open = openNum;
        hot15History[idx].hit = hot15History[idx].nums.includes(openNum);
        localStorage.setItem("hot15History", JSON.stringify(hot15History));
    }
}

// ===== 50期热号15码 =====
function getHot15(history) {
    let freq = {};
    for (let p of history.slice(0, 50)) {
        let num = p[6];
        freq[num] = (freq[num] || 0) + 1;
    }
    let sorted = Object.keys(freq).sort((a, b) => freq[b] - freq[a]);

    // 取前12个高频号
    let hot12 = sorted.slice(0, 12).map(Number);

    // 找最近5期出现1次的号码
    let recent = history.slice(0, 5);
    let recentFreq = {};
    for (let p of recent) {
        let num = p[6];
        recentFreq[num] = (recentFreq[num] || 0) + 1;
    }
    let candidates = Object.keys(recentFreq).filter(k => recentFreq[k] === 1).map(Number);
    candidates = candidates.filter(n => !hot12.includes(n));

    // 不够3个，从近10期出现1次的补
    if (candidates.length < 3) {
        let recent10 = history.slice(0, 10);
        let freq10 = {};
        for (let p of recent10) {
            let num = p[6];
            freq10[num] = (freq10[num] || 0) + 1;
        }
        let more = Object.keys(freq10).filter(k => freq10[k] === 1).map(Number);
        more = more.filter(n => !hot12.includes(n) && !candidates.includes(n));
        candidates = candidates.concat(more);
    }

    // 还不够，从高频池第13-18名补
    if (candidates.length < 3) {
        let backup = sorted.slice(12, 18).map(Number);
        backup = backup.filter(n => !hot12.includes(n) && !candidates.includes(n));
        candidates = candidates.concat(backup);
    }

    let hot15 = [...hot12, ...candidates.slice(0, 3)];
    return hot15.sort((a, b) => a - b);
}

function renderTm(result, currentPeriod) {
    let top30 = [...(result.top || [])].sort((a, b) => a - b);
    let kill = [...(result.kill || [])].sort((a, b) => a - b);

    let history = [];
    try {
        let raw = JSON.parse(localStorage.getItem("cacheHistory") || "[]");
        history = getHistory(raw);
    } catch (e) {}

    // 检查横财富缓存
    let hengCaiCache = localStorage.getItem('hengCaiCache');
    let finalNums = null;
    if (hengCaiCache) {
        try {
            let data = JSON.parse(hengCaiCache);
            let today = new Date().toISOString().split('T')[0];
            if (data.date === today && data.finalNums && data.finalNums.length > 0) {
                finalNums = data.finalNums;
            }
        } catch(e) {}
    }

    let label = finalNums ? `${finalNums.length}码` : `热号15码`;
    let nums = finalNums || getHot15(history);

    // renderTm 里，计算完 nums 后
    let hot15History = JSON.parse(localStorage.getItem("hot15History") || "[]");
    let exist = hot15History.some(item => item.expect === currentPeriod);
    if (!exist && nums.length > 0) {
        hot15History.unshift({
            expect: currentPeriod,
            nums: nums,
            open: null,
            hit: false,
            date: new Date().toISOString().split('T')[0]
        });
        hot15History = hot15History.slice(0, 30);
        localStorage.setItem("hot15History", JSON.stringify(hot15History));
    }

    document.getElementById("tmOut").innerHTML = `
    <div class="card tm">
    🔥 当前${currentPeriod}期分析<br><br>
    🎯 推荐：<span style="word-break:break-all;">${nums.join(",")}</span><br>
    </div>`;
}

async function generateBets(){
    // 如果没有缓存的分析结果，先调用分析
    if(!currentAnalysis){
        await showTmAnalysis(false);
    }
    if(!currentAnalysis){
        document.getElementById("betOut").innerHTML = `<div class="card tm">⚠️ 请先刷新特码分析</div>`;
        return;
    }

    let bets = shrinkBets(currentAnalysis.top, currentAnalysis.seed);

    let html = `<div class="card tm">
    💰 投注方案（选择其中一个或多个方案）<br><br>`;

    bets.forEach((b,i)=>{
        html += `方案${i+1}：${b.join(",")}<br>`;
    });

    document.getElementById("betOut").innerHTML = html;
}

function shrinkBets(top, seed){
    let result=[];

    for(let i=0;i<10;i++){

        let arr=[...top];

        // Fisher-Yates 洗牌（稳定版）
        for(let j=arr.length-1;j>0;j--){
            let k = Math.floor(seededRandom(seed + i*50 + j)*(j+1));
            [arr[j], arr[k]] = [arr[k], arr[j]];
        }

        let pick = arr.slice(0,8).sort((a,b)=>a-b);
        result.push(pick);
    }

    return result;
}

async function showTmHistory(){
    let list = JSON.parse(localStorage.getItem("tmHistory") || "[]");
    list = list.filter(i => i.open !== null && i.open !== undefined && i.expect).slice(0,fupanSize);
    if(!list.length){
        document.getElementById("tmHistory").innerHTML = "暂无历史投注数据";
        return;
    }

    let box = document.getElementById("tmHistory");
    box.innerHTML = "⏳ 正在加载历史投注结果...";
    await new Promise(r => setTimeout(r, 200));

    let html = `<div class="card tm">
    📊 历史投注结果 ${list.length}期<br>`;
    // 统计50期热号15码命中率
    let hot15History = JSON.parse(localStorage.getItem("hot15History") || "[]");
    let hitCount = hot15History.filter(item => item.hit === true).length;
    let total = hot15History.filter(item => item.open !== null).length;
    let hitRate = total > 0 ? Math.round(hitCount / total * 100) : 0;

    // html += `📊 热号15码历史命中率：${hitCount}/${total}（${hitRate}%）<br><br>`;

    list.forEach(i=>{
        html += `
        <div style="margin-bottom:10px;">
        ${i.expect}期<br>
        📝 Top${i.top.length}：<span style="word-break:break-all;">${[...i.top].sort((a,b)=>a-b).join(",")}</span><br>
        🎯 推荐：<span style="word-break:break-all;">${i.nums.join(",")}</span><br>
        🎲 开奖：<b style="color:#ff5722;">${i.open}</b><br>
        ${i.nums.length === 0 ? "⚠️ 无预测" : ""}
        ${i.hitNums ? "✅ 推荐命中" : ""}
        ${i.hitTop ? "✅ Top命中" : ""}
        ${i.nums.length > 0 && !i.hitNums && !i.hitTop ? "❌ 未中" : ""}
        </div>
        <hr>`;
    });
    html += `</div>`;
    box.innerHTML = html;
}

async function updateMarquee() {
  let base = "📊 自动同步最新开奖，每日仅生成一次分析结果";
  try {
    let raw = await fetchData(); // 用你的缓存函数
    let latest = raw[0];
    let lastId = localStorage.getItem("marqueeLastId");
    let numsHtml = formatNums(latest.num);
    let text = "";
    // ⭐ 判断是否新开奖
    if (lastId != latest.id) {
      text = `${base}　　<span class="highlight">🆕 新开奖：${latest.qishu}期（${latest.date}）${numsHtml}</span>`;
      localStorage.setItem("marqueeLastId", latest.id);
    } else {
      text = `${base}　　📢 最新开奖：${latest.qishu}期（${latest.date}）${numsHtml}`;
    }
    // ⭐ 双倍拼接（无缝滚动）
    document.getElementById("marqueeText").innerHTML = text + "　　" + text;
  } catch (e) {
    console.log("滚动条失败", e);
    document.getElementById("marqueeText").innerText = base;
  }
}

    await showTmAnalysis();
}
